<main class="nx-main">
  <div id="err"></div>
  <div class="q-head"><h1>เครื่องจักร</h1><button type="button" class="nx-btn primary" id="add" hidden>＋ เพิ่มเครื่อง</button></div>
  <div id="origin" class="ma-origin" role="tablist" aria-label="ที่มาของเครื่อง"></div>
  <div id="cards" class="q-cards"></div>
  <section class="nx-card q-box">
    <div class="q-bar">
      <div id="chips" class="q-chips" role="group" aria-label="ขนาด"></div>
      <select id="svc" aria-label="สถานะ Service"><option value="">ทุกสถานะ Service</option><option>ต่อ Service</option><option>ไม่ต่อ Service</option><option>ไม่ระบุ</option></select>
      <input id="q" type="search" placeholder="ค้นหาชื่อ Model S/N ลูกค้า" autocomplete="off" aria-label="ค้นหา">
    </div>
    <table class="q-t ma-t"><thead><tr><th>เครื่อง</th><th>Model</th><th>S/N</th><th class="hide-m">ลูกค้า</th><th>ขนาด</th><th>Service</th><th>ประกัน</th><th class="num">เคส</th></tr></thead>
      <tbody id="rows"></tbody></table>
    <p id="empty" class="q-empty" hidden>ไม่พบเครื่องจักร</p>
    <p id="more" class="q-empty" hidden></p>
  </section>
