<!-- ==========================================================================
     I-MODE Plus · หน้าหลักลูกค้า (Customer Home)

     ไฟล์นี้เป็น "หน้าจริง" ของหน้าหลักลูกค้า แก้ที่นี่ได้เลย
     ./pages/pages.js จะดึงเฉพาะ <section id="page-customer-portal"> ด้านล่าง
     ไปวางใน <main> ของ index.html ตอนหน้าเว็บกำลังโหลด

     ชื่อหน้าเปลี่ยนเป็น "Customer Home" แล้ว (เดิมชื่อ Customer Portal) แต่ id ของ section
     ยังเป็น page-customer-portal เหมือนเดิม เพราะเป็นชื่อที่ goPage(), renderCustomerPortal()
     และ CSS อีกหลายไฟล์อ้างถึงอยู่ — เปลี่ยน id เมื่อไหร่พังทันที ใช้ goPage('customer-home')
     ได้เลย ระบบจะแปลงชื่อให้เอง (ดู js/19-v69CustomerHomeScript.js)

     ทุกอย่างใน <head> นี้มีไว้ให้ "เปิดไฟล์นี้เดี่ยวๆ แล้วเห็นหน้าตาจริง" เท่านั้น
     ไม่ถูกส่งเข้า index.html จึงไม่กระทบลำดับ CSS ของแอป
     (ถ้าย้าย <link> พวกนี้เข้าไปใน <section> จะไปทับ CSS ของทั้งระบบ)

     id สามตัวนี้ห้ามเปลี่ยนชื่อ — renderCustomerPortal() เขียนข้อมูลลงไปโดยตรง:
     portalLineIdentity · portalMachineHero · portalContent
     ข้อมูลลูกค้า/เครื่อง จึงไม่มีอยู่ในไฟล์นี้ — ระบบเติมให้ตอนรันจากข้อมูลจริง
     ========================================================================== -->

<style>
  /* .page ถูกซ่อนไว้จนกว่า goPage() จะเติม .active ให้ — เปิดให้เห็นเฉพาะตอนดูไฟล์นี้เดี่ยวๆ */
  body{margin:0;background:#eef4ff}
  #page-customer-portal{display:block}
</style>

<body>

<section class="page customer-portal-page" id="page-customer-portal">
      <div class="portal-shell chome">

        <!-- หัวหน้า: โลโก้ | ชื่อศูนย์บริการ + สโลแกน | ปุ่มปิด -->
        <div class="portal-header chome-header">
          <img class="centry-portal-logo" src="./assets/imode-document-logo-removeBG.png" alt="I-MODE service">
          <div class="chome-headline">
            <b>I-MODE Plus</b>
            <small>Customer Service Center</small>
            <em>งานบริการคือหน้าที่ของเรา เพราะลูกค้าคือคนสำคัญ</em>
          </div>
          <button class="portal-close" onclick="exitCustomerPortal()">×</button>
        </div>

        <div id="portalLineIdentity" class="portal-line-identity"></div>

        <!-- การ์ดข้อมูลเครื่องจักร — renderCustomerPortal() เติมให้ตอนรัน (js/19) -->
        <div id="portalMachineHero"></div>

        <!-- ปุ่มบริการ · ห้ามเปลี่ยน class portal-action-grid — js/08 และ css/20 ใช้ค้นหา -->
        <div class="portal-action-grid chome-grid">
          <button class="chome-report" onclick="openPortalIssueForm()"><span>🔧</span><b>แจ้งปัญหาเครื่อง</b><i>SERVICE CASE</i></button>
          <button onclick="showPortalWarranty()"><span>🛡</span><b>เช็คประกัน</b><i>WARRANTY CHECK</i></button>
          <button onclick="openPortalServiceQuoteRequest()"><span>💰</span><b>ขอราคา Service</b><i>SERVICE QUOTATION</i></button>
          <button onclick="openPortalWarrantyRequest()"><span>📋</span><b>ซื้อ / ต่อ Warranty</b><i>BUY / RENEW WARRANTY</i></button>
          <button onclick="showPortalQuotations()"><span>🧾</span><b>ใบเสนอราคาของฉัน</b><i>MY QUOTATIONS</i></button>
          <button onclick="showPortalHistory()"><span>🕘</span><b>ประวัติ Service</b><i>SERVICE HISTORY</i></button>
          <button onclick="showPortalDocuments()"><span>📘</span><b>คู่มือเครื่อง</b><i>MANUAL &amp; DOCUMENT</i></button>
          <button onclick="contactServiceFromPortal()"><span>💬</span><b>ติดต่อ Service</b><i>CONTACT US</i></button>
          <button class="chome-wide" onclick="showPortalNews()"><span>📣</span><b>อัปเดตข้อมูลข่าวสาร และกิจกรรมล่าสุด</b><i>NEWS / ANNOUNCEMENT</i></button>
        </div>

        <div id="portalContent" class="portal-content"></div>

        <div class="portal-footer chome-footer">
          <span class="chome-motto">TRUST &bull; EXPERTISE &bull; ALWAYS WITH YOU</span>
          บริษัท ไอโมด พลัส จำกัด • I-MODE Plus Service &amp; Maintenance
        </div>
      </div>
    </section>

</body>
</html>
