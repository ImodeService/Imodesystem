<!--
  Service Case Detail — the full-page workspace for one case.

  Standalone on purpose: it is opened as its own document from the Service Cases list
  (service-case-detail.html?caseId=SRV-…), not injected into index.html, so the giant
  shared scope of the application is not a dependency and this page can be worked on
  without touching it.

  DATA
  The page never talks to Supabase itself. CaseDetailData is a read-only adapter over the
  same localStorage keys the application persists to, so opening a case here shows the
  real case rather than a mock, and nothing here can write over it. When the cloud becomes
  the source of truth, only the four marked functions in CaseDetailData change; no markup
  and no render function has to move. USE_MOCK_DATA is the third fallback and is used only
  when the id resolves to nothing, so the layout can still be reviewed on an empty device.

  STATE THAT IS PREPARED BUT NOT YET FILLED
  assignment / appointment / quotation / parts / qc / feedback / activity / internalNotes
  all exist on the ViewModel and render from whatever the case already carries. Where the
  application has no field for something yet (feedback, internal notes) the section says
  so rather than inventing a value.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap');
:root{
  --imode-blue:#0b63e5; --imode-navy:#0c225e; --imode-navy-2:#123a80;
  --imode-orange:#f27a1a; --imode-orange-dark:#d2620c;
  --ok:#079455; --warn:#f79009; --danger:#e31b2f;
  --ink:#12224a; --muted:#6b7d9e; --line:#e2ecfb; --line-2:#dfe9f8;
  --bg:#f4f8ff; --card:#fff;
  --radius:16px; --shadow:0 12px 30px rgba(18,58,128,.08);
  color-scheme:only light;
}
/* 2026-10-29: dark theme. Everything that reads these variables follows; fixed light backgrounds
   are caught by js/151, which also runs on this page. Same greys as Service's flat-dark. */
html[data-theme="dark"]{
  --bg:#1b1b1b; --card:#262626; --ink:#f1f1f1; --muted:#a9adb4; --line:#3a3a3a; --line-2:#3a3a3a;

}
html[data-theme="dark"] .scd-user .av,html[data-theme="dark"] #scdToast{background:#2563c9}
html[data-theme="dark"] h1,html[data-theme="dark"] h2,html[data-theme="dark"] h3,html[data-theme="dark"] h4,
html[data-theme="dark"] .t24-colon,html[data-theme="dark"] .t24-date,html[data-theme="dark"] .t24-dtxt{color:var(--imode-navy)}
html[data-theme="dark"] .t24-dtxt.is-empty{color:var(--muted)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  font-family:"Anuphan","Noto Sans Thai","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
a{color:var(--imode-blue)}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 40px}

/* ---------- topbar ---------- */
.scd-topbar{
  position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(18,58,128,.05);
}
.scd-topbar-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.scd-menu{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:17px;flex:none}
.scd-menu:hover{border-color:#b9d2f4;background:#f4f8ff}
.scd-menu:focus-visible{outline:3px solid var(--imode-blue);outline-offset:2px}
.scd-backbtn{font-size:24px;line-height:1;color:var(--imode-navy);font-weight:700}
.scd-brand{display:flex;flex-direction:column;line-height:1.2;flex:none}
.scd-brand b{color:var(--imode-navy);font-size:15px;letter-spacing:.2px}
.scd-brand small{color:var(--muted);font-size:11px}
.scd-search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#f6f9ff;border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.scd-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px}
.scd-tools{display:flex;align-items:center;gap:9px;flex:none}
.scd-chip-btn{height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:13px;font-weight:700;color:var(--imode-navy)}
.scd-chip-btn:hover{border-color:#b9d2f4}
/* Measured at 1024 / 768 / 390 / 360: the breadcrumb and footer links were 20px tall,
   which is under the comfortable thumb target. Only the hit area grows; nothing moves. */
.scd-back{min-height:32px;display:inline-flex;align-items:center;gap:4px;padding:5px 2px}
.scd-foot .scd-back{padding:5px 8px}
/* The breadcrumb link and the media "ดูทั้งหมด" button were 20px tall, the two smallest
   things a finger has to hit on this page. Only the hit area grows. */
.scd-crumb a,.scd-crumb button{min-height:32px;display:inline-flex;align-items:center;padding:5px 2px}
.media-meta button{min-height:32px;display:inline-flex;align-items:center;padding:5px 6px}
.scd-bell{position:relative}
.scd-bell b{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px}
.scd-user{display:flex;align-items:center;gap:9px;padding:5px 11px 5px 5px;border:1px solid var(--line);border-radius:999px;background:#fff}
.scd-user .av{width:32px;height:32px;border-radius:50%;background:var(--imode-navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.scd-user span{display:flex;flex-direction:column;line-height:1.2}
.scd-user b{font-size:12.5px;color:var(--imode-navy)}
.scd-user small{font-size:10.5px;color:var(--muted)}

/* ---------- breadcrumb + header ---------- */
.scd-crumb{display:flex;align-items:center;gap:9px;padding:16px 0 12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.scd-crumb a{text-decoration:none;font-weight:700}
.scd-crumb b{color:var(--imode-navy)}
.scd-headcard{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.scd-headmain{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.scd-title-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.scd-title-row h1{margin:0;font-size:28px;color:var(--imode-navy);letter-spacing:.3px}
.scd-customer{margin:6px 0 0;font-size:17px;font-weight:700;color:var(--imode-navy-2)}
.scd-meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px;font-size:13px;color:var(--ink)}
.scd-meta div{display:flex;align-items:center;gap:8px}
.scd-meta i{font-style:normal;font-size:15px}
.scd-meta small{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;border:1px solid transparent;white-space:nowrap}
.badge-status{background:var(--imode-blue);color:#fff}
.badge-status.is-done{background:var(--ok)}
.badge-status.is-hold{background:var(--warn);color:#3a2500}
.badge-prio{background:#eef4ff;border-color:#cfe0fa;color:var(--imode-navy-2)}
.badge-prio.is-urgent{background:#fdeaea;border-color:#f6cccc;color:#a51f1f}
.badge-ws{cursor:pointer;font:inherit;font-weight:700;border-width:1.5px;border-style:solid}
.badge-ws:hover{filter:brightness(.97)}
.badge-ws:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.badge-field{cursor:pointer;font:inherit;font-weight:700;border-width:1px;border-style:solid}
.badge-field:hover{filter:brightness(.97)}
.badge-field:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.badge-field.ftone-yellow{background:#fff4cc;border-color:#f5b400;color:#8a6100}
.badge-field.ftone-green{background:#dcf5e3;border-color:#22c55e;color:#15803d}
.badge-field.ftone-orange{background:#ffe8d1;border-color:#f59e0b;color:#b45309}
.badge-field.ftone-red{background:#fde2e2;border-color:#ef4444;color:#b42318}
.badge-field[class*="ftone-"]{border-width:1.5px}
html[data-theme="dark"] .badge-field.ftone-yellow{background:#3d3210!important;border-color:#f5b400!important;color:#ffd666!important}
html[data-theme="dark"] .badge-field.ftone-green{background:#123a22!important;border-color:#22c55e!important;color:#86efac!important}
html[data-theme="dark"] .badge-field.ftone-orange{background:#42290f!important;border-color:#f59e0b!important;color:#fdba74!important}
html[data-theme="dark"] .badge-field.ftone-red{background:#431b1b!important;border-color:#ef4444!important;color:#fca5a5!important}
.badge-sub{background:#fff6e8;border-color:#f5dcb4;color:#8a5200}
.scd-sla{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.scd-sla h3{margin:0 0 8px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.scd-sla-state{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;color:var(--ok)}
.scd-sla-state .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.scd-sla.is-risk .scd-sla-state{color:var(--warn)} .scd-sla.is-risk .dot{background:var(--warn)}
.scd-sla.is-over .scd-sla-state{color:var(--danger)} .scd-sla.is-over .dot{background:var(--danger)}
.scd-sla p{margin:9px 0 0;font-size:13px;color:var(--ink)}
.scd-sla-done{margin-top:12px;width:100%;min-height:40px;padding:9px 14px;border-radius:10px;
  border:1px solid var(--imode-blue);background:var(--imode-blue);color:#fff;font:700 13px/1.3 inherit;
  cursor:pointer;box-shadow:0 4px 0 #0a4bb0;transition:transform .12s,box-shadow .12s}
.scd-sla-done:hover{transform:translateY(-2px);box-shadow:0 6px 0 #0a4bb0}
.scd-sla-done:active{transform:translateY(3px);box-shadow:0 1px 0 #0a4bb0}
@media (prefers-reduced-motion:reduce){.scd-sla-done{transition:none}
  .scd-sla-done:hover,.scd-sla-done:active{transform:none}}

/* ---------- progress ---------- */
/* 2026-09-24 — THE SIDEWAYS SCROLL BELONGS TO THE CIRCLES, NOT TO THE WHOLE BLOCK.
   Reported with two screenshots: swiping to reach steps 4 and 5 on a phone dragged the open
   step drawer off to the left with them, and most of the card came out blank. The cause was
   here — .scd-progress carried overflow-x:auto and holds BOTH the step strip and the drawer,
   so one gesture moved both. The strip scrolls itself now (see .scd-steps below) and this box
   only clips, so the details stay put. "clip" rather than "hidden" on purpose: hidden would
   make this a scroll container on the vertical axis too, and the drawer animates its own
   height inside it (part 30). */
.scd-progress{margin-top:18px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 18px 16px;overflow-x:clip}
/* The strip is its own scroller, the same shape .sd-field (the nine field statuses) has used
   all along: no min-width on the container, a flex-basis on each item instead, so the row is
   5 x 152px — exactly the 760px it used to demand — and it scrolls inside its own box.
   flex-grow keeps the desktop layout identical: with room to spare the five spread across the
   card. A sixth step would simply make the row wider and still scroll, which the old hard
   760px could not do. */
.scd-steps{display:flex;align-items:flex-start;list-style:none;margin:0;padding:6px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
.scd-steps li{flex:1 0 152px;position:relative;text-align:center;padding:0 6px}
.scd-steps li::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:#e3ecfa;z-index:0}
.scd-steps li:first-child::before{display:none}
.scd-steps li.done::before,.scd-steps li.now::before{background:var(--ok)}
.scd-steps .mark{position:relative;z-index:1;width:34px;height:34px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#eef2f9;color:#8ea2c2;font-weight:800;font-size:14px;border:3px solid #fff;box-shadow:0 0 0 2px #e3ecfa}
.scd-steps li.done .mark{background:var(--ok);color:#fff;box-shadow:0 0 0 2px var(--ok)}
.scd-steps li.now .mark{background:var(--imode-blue);color:#fff;box-shadow:0 0 0 3px #cfe0fa}
.scd-steps b{display:block;margin-top:9px;font-size:13px;color:var(--imode-navy)}
.scd-steps li.pending b{color:#93a4c1}
.scd-steps small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.scd-steps li.now small{color:var(--imode-blue);font-weight:700}
.scd-after{display:flex;align-items:center;gap:9px;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}
.scd-after .mark{width:30px;height:30px;border-radius:50%;background:#eef2f9;color:#c6a02a;display:grid;place-items:center}
.scd-substates{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- 8. the circles are buttons ---------- */
.scd-steps li{padding:0}
.scd-step-btn{display:block;width:100%;border:0;background:none;padding:0 6px 4px;font:inherit;
  text-align:center;cursor:pointer;border-radius:12px;color:inherit}
.scd-step-btn:disabled{cursor:default}
.scd-step-btn:not(:disabled):hover .mark{transform:scale(1.08)}
.scd-step-btn:not(:disabled):hover b{color:var(--imode-blue)}
.scd-step-btn:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.scd-steps .mark{transition:transform .12s ease}
.scd-steps li.is-open .mark{box-shadow:0 0 0 4px #cfe0fa}
.scd-step-cue{display:block;margin-top:5px;font-size:11px;font-weight:700;font-style:normal;color:var(--imode-blue)}
.scd-steps li.is-blocked .scd-step-cue{color:#9a6516}
.scd-steps li.is-blocked .mark{background:#fdf0e2;color:#9a6516;box-shadow:0 0 0 2px #f3d3b2}

/* ---------- the drawer under a step ---------- */
/* 2026-09-21 - it slides, like the field panel inside it. The border, padding and background
   had to move to an inner element: they belong to the box that is being revealed, and left on
   the slider they would still paint a 30px empty sliver at max-height:0. */
.scd-stepdrawer{max-height:0;opacity:0;overflow:hidden;margin-top:0;
  transition:max-height .3s ease-in,opacity .22s ease,margin-top .3s ease-in}
.scd-stepdrawer.is-open{max-height:2400px;opacity:1;margin-top:14px;
  transition:max-height .34s cubic-bezier(.22,.9,.3,1),opacity .26s ease,margin-top .34s ease}
.scd-stepdrawer-in{border:1px solid var(--line-2);border-radius:14px;
  background:#f8fbff;padding:14px 16px}
@media (prefers-reduced-motion:reduce){.scd-stepdrawer{transition:opacity .18s ease}
  .scd-stepdrawer.is-open{max-height:none}}
.sd-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sd-head h4{margin:0;font-size:15px;color:var(--imode-navy)}
.sd-head p{margin:0;flex:1;font-size:12.5px;color:var(--muted)}
.sd-close{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:5px 12px;
  font:inherit;font-size:12px;font-weight:700;color:var(--imode-navy);cursor:pointer}
.sd-close:hover{border-color:var(--imode-blue);color:var(--imode-blue)}
.sd-kv{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;margin:0;font-size:13px}
.sd-kv dt{color:var(--muted)}
.sd-kv dd{margin:0;font-weight:600;color:var(--imode-navy);overflow-wrap:anywhere}
.sd-empty{margin:0;font-size:13px;color:var(--muted)}
.sd-hint{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
/* 2026-09-17, item 13 — the page's own confirmation dialog (scdAsk), matching js/78's in the
   application. This page does not load css/*, so its tokens are restated like every other
   style here. */
.scd-ask{position:fixed;inset:0;z-index:9500;background:rgba(9,22,54,.52);display:flex;
  align-items:center;justify-content:center;padding:18px;animation:scdAskIn .14s ease}
@keyframes scdAskIn{from{opacity:0}to{opacity:1}}
.scd-ask-card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:20px 18px 16px;
  text-align:center;box-shadow:0 26px 70px rgba(9,22,54,.34)}
.scd-ask-icon{font-size:30px;line-height:1;margin-bottom:8px}
.scd-ask-card h4{margin:0 0 7px;font-size:16px;font-weight:800;color:var(--imode-navy)}
.scd-ask-body{font-size:13px;color:#4a5c7d;line-height:1.65}
.scd-ask-body p{margin:0 0 6px}
.scd-ask-body p:last-child{margin-bottom:0}
.scd-ask-acts{display:flex;gap:9px;margin-top:16px}
.scd-ask-no,.scd-ask-yes{flex:1;padding:12px 10px;border-radius:13px;font:inherit;font-size:13.5px;
  font-weight:800;cursor:pointer}
.scd-ask-no{border:1px solid var(--line);background:#fff;color:#3d557f}
.scd-ask-no:hover{border-color:#94a9c8}
.scd-ask-yes{border:0;color:#fff;background:linear-gradient(180deg,#2f7bf0,#0b63e5);box-shadow:0 4px 0 #084bb0}
.scd-ask-card.is-danger .scd-ask-yes{background:linear-gradient(180deg,#e2574c,#cf3b30);box-shadow:0 4px 0 #a52a21}
.scd-ask-yes:active{transform:translateY(2px);box-shadow:0 1px 0 #084bb0}
.scd-ask-no:focus-visible,.scd-ask-yes:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.scd-ask{animation:none}.scd-ask-yes:active{transform:none}}
.sd-ok{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--ok)}
.ws-sub{margin:14px 0 6px;font-size:13.5px;font-weight:800;color:var(--imode-navy)}
.ws-sub:first-of-type{margin-top:4px}
.sd-wait{margin:10px 0 0;font-size:13px;font-weight:700;color:#9a6516}
.sd-acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.sd-team{margin-top:12px}
.sd-team>b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.sd-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sd-member{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:11px;
  padding:9px 11px;background:#fff;cursor:pointer;font-size:13px}
.sd-member.is-on{border-color:var(--imode-blue);background:#f3f8ff}
.sd-member span{font-weight:700;color:var(--imode-navy)}
.sd-member small{margin-left:auto;color:var(--muted);font-size:11.5px}
.sd-member input{width:17px;height:17px;flex:0 0 auto}
.sd-go{border:1px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 14px;
  font:inherit;font-size:12.5px;font-weight:700;color:var(--imode-navy);cursor:pointer}
.sd-go:hover{border-color:var(--imode-blue);color:var(--imode-blue)}
.sd-go:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.sd-revert{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.sd-revert small{color:var(--muted);font-size:12px}
.sd-go.sd-back{border-color:#f3c9a3;color:#9a4a00;background:#fffaf4}
.sd-go.sd-back:hover{border-color:#e07b1f;color:#7a3a00}

/* the technician's own nine-status track, under step 4 */
.sd-field{list-style:none;margin:0;padding:6px 4px 8px;display:flex;gap:0;overflow-x:auto;min-width:0}
.sd-field li{flex:1 0 108px;position:relative;text-align:center;padding:0 4px}
.sd-field li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#e3ecfa}
.sd-field li:first-child::before{display:none}
.sd-field li.done::before{background:var(--ok)}
.sd-field .fdot{position:relative;z-index:1;width:26px;height:26px;margin:0 auto;border-radius:50%;
  display:grid;place-items:center;background:#eef2f9;color:#8ea2c2;font-size:12px;font-weight:800;
  border:3px solid #fff;box-shadow:0 0 0 2px #e3ecfa}
.sd-field li.done .fdot{background:var(--ok);color:#fff;box-shadow:0 0 0 2px var(--ok)}
.sd-field li.now .fdot{background:var(--imode-blue);color:#fff;box-shadow:0 0 0 3px #cfe0fa}
.sd-field b{display:block;margin-top:7px;font-size:11.5px;color:var(--imode-navy);line-height:1.35}
.sd-field li.pending b{color:#93a4c1}
.sd-field small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
/* 2026-09-21 - every circle on the technician's track opens what was recorded at that step.
   The <li> keeps the connector line and the state classes; the button inside it is the
   control, so none of the rules above had to change. */
.sd-field .fdot{transition:transform .18s ease,box-shadow .18s ease}
.sd-fbtn{display:block;width:100%;margin:0;padding:2px 0 4px;border:0;background:none;
  font:inherit;color:inherit;cursor:pointer;border-radius:10px;text-align:center}
.sd-fbtn:hover .fdot{transform:scale(1.14)}
.sd-fbtn:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.sd-field li.is-open .fdot{box-shadow:0 0 0 3px #f6a11a}
.sd-field li.is-open b{color:#b26a00}
/* The slide. max-height rather than grid-template-rows: it needs no browser caveat, and
   1600px is far above a note plus a row of thumbnails. */
/* Two easings, on purpose. A declaration on the BASE selector is the one that runs when the
   class is REMOVED — the close — and the one on .is-open runs when it is added. Sharing the
   opening curve made the collapse look clipped: cubic-bezier(.22,.9,.3,1) is front-loaded, so
   a 226px panel was already down to 80px 55ms in and the slide was over before the eye caught
   it. Closing eases IN instead: slow off the mark, quick at the end. */
.sd-fdetail{max-height:0;opacity:0;overflow:hidden;margin-top:0;
  transition:max-height .3s ease-in,opacity .22s ease,margin-top .3s ease-in}
.sd-fdetail.is-open{max-height:1600px;opacity:1;margin-top:12px;
  transition:max-height .34s cubic-bezier(.22,.9,.3,1),opacity .26s ease,margin-top .34s ease}
.sd-fdetail-in{border:1px solid var(--line-2);border-radius:14px;background:#f7faff;padding:12px 14px}
.sd-fdetail-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sd-fdetail-head b{font-size:14px;color:var(--imode-navy)}
.sd-fdetail-x{margin-left:auto;border:1px solid var(--line-2);background:#fff;border-radius:999px;
  font:inherit;font-size:12px;padding:3px 12px;cursor:pointer;color:var(--muted)}
.sd-fentry+.sd-fentry{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.sd-fnote{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:#22304a;white-space:pre-wrap}
.sd-fcrew{display:flex;flex-wrap:wrap;gap:6px}
.sd-fcrew-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  color:var(--imode-navy);background:#eef4fd;border:1px solid var(--line-2);
  border-radius:999px;padding:3px 10px}
.sd-fcrew-chip.is-lead{background:#e6f0ff;border-color:#bcd6fb}
.sd-fcrew-chip.is-off{background:#f4f5f7;color:#7b8798}
.sd-fcrew-chip i{font-style:normal;font-size:10px;font-weight:700;color:#5b6d8c;opacity:.9}
.sd-fcrew-chip.is-off i{color:#94a0b2}
.sd-fedited{margin:6px 0 0;font-size:11.5px;color:#8a5200}
.sd-frevs{margin-top:6px}
.sd-frevs summary{cursor:pointer;font-size:11.5px;font-weight:700;color:#8a5200}
.sd-frevlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.sd-frevlist li{border:1px solid #eadfcc;background:#fffaf1;border-radius:10px;padding:6px 9px}
.sd-frevlist small{display:block;font-size:10.5px;color:#8d7a5e}
.sd-frevlist span{display:block;font-size:12.5px;color:#2a3550;white-space:pre-wrap;word-break:break-word}
@media (prefers-reduced-motion:reduce){.sd-fdetail{transition:opacity .18s ease}
  .sd-fdetail.is-open{max-height:none}.sd-fbtn:hover .fdot{transform:none}}

/* the status picker the ⇄ button opens */
.sd-when{margin-top:14px;border:1px solid var(--line-2);border-radius:12px;background:#f8fbff;padding:11px 12px}
.sd-when label{display:block;font-size:11.5px;font-weight:700;color:var(--imode-navy);margin-bottom:6px}
.sd-when label b{color:#d92d20}
.sd-when input{width:100%;box-sizing:border-box;border:1px solid var(--line-2);border-radius:11px;
  background:#fff;color:var(--imode-navy);font-family:inherit;font-size:13px;padding:9px 11px;min-height:40px}
.sd-when small{display:block;margin-top:6px;font-size:10.5px;color:var(--muted);line-height:1.5}
.sd-when.is-missing{border-color:#d92d20;background:#fff5f4}
.sd-when.is-missing label{color:#b42318}
.sd-statuses{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.sd-status{border:1px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 14px;
  font:inherit;font-size:13px;font-weight:700;color:var(--imode-navy);cursor:pointer}
.sd-status:hover{border-color:var(--imode-blue);color:var(--imode-blue)}
.sd-status.is-now{background:var(--imode-blue);border-color:var(--imode-blue);color:#fff;cursor:default}
.sd-status.tone-orange{border-color:#f59e0b;color:#b45309}.sd-status.tone-green{border-color:#22c55e;color:#15803d}.sd-status.tone-red{border-color:#ef4444;color:#b42318}.sd-status.is-now.tone-orange{background:#e07a1f;border-color:#e07a1f;color:#fff}.sd-status.is-now.tone-green{background:#15803d;border-color:#15803d;color:#fff}.sd-status.is-now.tone-red{background:#b42318;border-color:#b42318;color:#fff}
.sd-status:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}

/* ---------- the ใบตรวจ inside เอกสาร & รูปภาพ ---------- */
.rp-card{border:1px solid var(--line-2);border-radius:12px;background:#fff;padding:13px 15px;margin-top:9px}

.rp-card header span{font-size:12px;color:var(--muted)}
.rp-kv{margin:0;display:grid;gap:6px}
.rp-line{display:grid;grid-template-columns:128px 1fr;gap:4px 12px;font-size:12.8px}
.rp-line dt{color:var(--muted);margin:0}
.rp-line dd{margin:0;color:var(--imode-navy);font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}

/* ---------- ประวัติการเปลี่ยนสถานะ ----------

.scd-slog{margin-top:14px;border-top:1px solid var(--line);padding-top:11px}

.scd-slog[open] summary::after{transform:rotate(180deg)}
.slog-list{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:7px}
.slog-list li{display:grid;grid-template-columns:154px 1fr;gap:2px 12px;align-items:baseline;

  box-shadow:0 4px 0 #e6eefb;transition:transform .14s ease,box-shadow .14s ease}

.scd-act:focus-visible{outline:3px solid var(--imode-blue);outline-offset:2px}

.scd-act.green:active{box-shadow:0 1px 0 #05723f}

/* ---------- main grid ---------- */

.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}

.card-head h2{margin:0;font-size:17px;color:var(--imode-navy)}
.card-head .spacer{flex:1}

.problem{background:linear-gradient(180deg,#fff8f8,#fff);border-color:#f6d9d9}

/* รายละเอียดปัญหา — what the customer typed, in a panel of its own directly under the card
   head, with the attachments on the row below it. */

.issue-box>small{display:block;font-size:12.5px;font-weight:700;color:#a8535b;margin-bottom:6px}

.issue-box .desc{margin:8px 0 0;font-size:16px;color:#7a2a2a}

.cmp-tile img{width:100%;height:100%;object-fit:cover;display:block}
.cmp-tile:hover{border-color:var(--imode-blue)}
.cmp-tile:focus-visible{outline:2px solid var(--imode-blue);outline-offset:2px}
.cmp-tile.is-video{position:relative}
.cmp-grid .media-add{margin:0;line-height:1.3}
/* 2026-10-20: files staff added to the problem, and PDFs */
.cmp-tile.is-staff{box-shadow:inset 0 0 0 2px #f2810c}

.scd-ce-files .scd-ce-file img{width:34px;height:34px;object-fit:cover;border-radius:6px}

/* The page's drawers are popups. #scdPanel is empty and inert until panel() fills it, so it
   must not paint anything of its own until then — hence everything hangs off .is-open. */
#scdPanel.is-open{position:fixed;inset:0;z-index:11000;display:grid;place-items:center;padding:18px}
.scd-modal-back{position:absolute;inset:0;background:rgba(9,18,38,.55);backdrop-filter:blur(1px)}
#scdPanel.is-open .scd-modal-card{position:relative;z-index:1;width:min(620px,100%);
  max-height:88vh;display:flex;flex-direction:column;margin:0;min-width:0;
  box-shadow:0 26px 70px rgba(9,26,64,.32);animation:scdPop .16s ease-out}
#scdPanel.is-open .scd-modal-card:focus{outline:none}
#scdPanel.is-open .card-head{flex:0 0 auto}
/* min-width:0 on BOTH, measured — without it the card is a grid item and the body a flex
   item, and min-width:auto lets each take its min-content width from .scd-qdoc's min-width:720px.
   On a 390px phone the card came out 794px wide, so the signature pads and their buttons sat
   half off-screen along with the paper. Now only the paper scrolls, inside .scd-modal-body.
   Pre-existing — measured identical on the build before the combined save button. */
.scd-modal-body{overflow:auto;padding:0 16px 16px;min-width:0}
@keyframes scdPop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
body.scd-modal-open{overflow:hidden}
@media (max-width:640px){
  #scdPanel.is-open{padding:0;place-items:end stretch}
  #scdPanel.is-open .scd-modal-card{width:100%;max-height:92vh;border-radius:20px 20px 0 0}
}
@media (prefers-reduced-motion:reduce){#scdPanel.is-open .scd-modal-card{animation:none}}
.cmp-lightbox{position:fixed;inset:0;z-index:12000;background:rgba(9,18,38,.86);display:grid;place-items:center;padding:18px}

/* งาน Workshop */
.ws-radio{display:flex;flex-direction:column;gap:6px;font-weight:400;font-size:13px}

/* The control is drawn here rather than left to the browser, for two reasons reported on
   2026-09-18: clicking a native radio leaves Chrome's square focus ring sitting around it, and
   a dot does not read as "chosen" beside the ✓ of the แก้ไขทางออนไลน์ tick right underneath.
   appearance:none replaces it with a rounded box that fills blue and draws a check mark, and the
   whole row lights up with it. The ring is kept for :focus-visible ONLY — a keyboard user still
   has to see where they are; a mouse click no longer leaves a frame behind.
   Specificity matters here: .scd-ce-f input further down this sheet is (0,1,1) and would
   otherwise give the radio width:100% with a padded box, floating the dot in the middle of the
   row (part 27). This selector is (0,2,1), so it wins wherever .ws-radio is used. */
.ws-radio input[type=radio]{appearance:none;-webkit-appearance:none;position:relative;
  width:20px;height:20px;min-width:0;flex:0 0 auto;margin:0;padding:0;cursor:pointer;
  border:1.5px solid #c3d4ef;border-radius:7px;background:#fff;outline:none;
  transition:background .14s ease,border-color .14s ease,box-shadow .14s ease}
.ws-radio input[type=radio]::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(.35);opacity:0;
  transition:opacity .12s ease,transform .12s ease}
.ws-radio input[type=radio]:hover{border-color:#8fb4e8}
.ws-radio input[type=radio]:checked{background:var(--imode-blue);border-color:var(--imode-blue)}
.ws-radio input[type=radio]:checked::after{opacity:1;transform:rotate(45deg) scale(1)}
.ws-radio input[type=radio]:focus-visible{box-shadow:0 0 0 3px rgba(11,99,229,.24)}
.ws-radio label:has(input:checked){border-color:#9dc2f4;background:#f3f8ff}
.scd-ce-f .ws-radio label{font-size:13px;font-weight:400;color:var(--imode-navy)}
.ws-set{flex-wrap:wrap}
.ws-sig{display:block;max-width:260px;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px}
.ws-msg{width:100%;box-sizing:border-box;border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.6;background:#f8fbff;color:var(--imode-navy);resize:vertical}
.ws-line-btn{display:block;width:100%;margin-top:12px}

.scd-ol-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scd-ol-list li{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;min-width:0;overflow-wrap:anywhere}

/* company signatures under the quotation paper */
.qs-wrap{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qs-head{grid-column:1/-1;font-size:14px;font-weight:800;color:var(--imode-navy)}

/* The full paper, drawn from the application's stored HTML. These rules restate the
   .quote-paper-* rules of css/01 (this page does not load css/), scoped to .scd-qdoc. */
/* min-width:0 is what actually makes the overflow-x work. Without it this flex item takes its
   min-content width from .scd-qdoc's min-width:720px, so on a phone the whole modal body was
   720px wide inside a 390px card: the paper scrolled, but so did the signature pads and their
   buttons, half off-screen. Pre-existing — measured identical on the build before the combined
   save button — and fixed here because that button is the thing it hides. */
.scd-qdoc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scd-qdoc{min-width:720px;color:#1d232f}
.scd-qdoc .quote-doc.official{border:1px solid #dadce8;padding:18px 22px;background:#fff}
.scd-qdoc .quote-paper-header{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;padding-bottom:10px;border-bottom:2px solid #1748a5}
.scd-qdoc .quote-paper-logo{width:170px;height:74px;object-fit:contain;object-position:left center}

.scd-qdoc .quote-paper-company b{font-size:14px;color:#000}
.scd-qdoc .quote-paper-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:.02em;margin:6px 0 10px;color:#111}
.scd-qdoc .quote-paper-meta{display:grid;grid-template-columns:1.2fr .9fr;gap:18px;margin-bottom:8px}
.scd-qdoc .quote-paper-block .row{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-bottom:6px;font-size:13px;align-items:start}
.scd-qdoc .quote-paper-block .label{font-weight:700;color:#21306e}
.scd-qdoc .quote-paper-block .value{color:#111;min-height:18px}
.scd-qdoc .quote-paper-table table{width:100%;border-collapse:collapse;border:1px solid #444}
.scd-qdoc .quote-paper-table th,.scd-qdoc .quote-paper-table td{border:1px solid #444;padding:7px 8px;font-size:12px;vertical-align:top}
.scd-qdoc .quote-paper-table th{background:#f7f7fb;text-align:center;color:#111;font-weight:700}
.scd-qdoc .quote-paper-table td.right{text-align:right}
.scd-qdoc .quote-paper-remark{display:grid;grid-template-columns:90px 1fr;border-left:1px solid #444;border-right:1px solid #444;border-bottom:1px solid #444}
.scd-qdoc .quote-paper-remark div{padding:8px;font-size:12px}
.scd-qdoc .quote-paper-remark .label{font-weight:700;color:#21306e;border-right:1px solid #444}
.scd-qdoc .quote-paper-summary{margin-left:auto;width:340px;border-left:1px solid #444;border-right:1px solid #444;border-bottom:1px solid #444}
.scd-qdoc .quote-paper-summary .sum-row{display:grid;grid-template-columns:1fr 140px}
.scd-qdoc .quote-paper-summary .sum-row>div{padding:6px 8px;border-top:1px solid #444;font-size:12px}
.scd-qdoc .quote-paper-summary .sum-row b{text-align:right;display:block}
.scd-qdoc .quote-paper-summary .sum-row.total{font-weight:800;color:#21306e}
.scd-qdoc .quote-paper-sign{display:grid;grid-template-columns:1.1fr .9fr .9fr .9fr;border:1px solid #444;margin-top:12px}
.scd-qdoc .quote-paper-sign>div{min-height:122px;padding:10px;border-right:1px solid #444;font-size:12px}
.scd-qdoc .quote-paper-sign>div:last-child{border-right:0}
.scd-qdoc .quote-paper-sign b{display:block;margin-bottom:8px}

<script>
(function(){
'use strict';

/* =======================================================================
   0. configuration
   ======================================================================= */
/* Local storage is the live source on every device today; the cloud copy is pulled into
   it by the application's own syncCloud(). Flip USE_CLOUD when this page should read
   Supabase directly — only loadAll() below changes. */
var USE_CLOUD=false;
/* Third fallback, so the layout is still reviewable on a device with no data at all. */
var USE_MOCK_DATA=true;

var K={
  cases:'imode_test_v532_cases',
  customers:'imode_test_v532_customers',
  machines:'imode_test_v532_machines',
  tech:'imode_v5_tech',
  warranties:'imode_test_v532_warranties',
  reports:'imode_test_v532_service_reports',
  qc:'imode_v66_qc_records',
  lineRequests:'imode_test_v532_line_requests',
  quotes:'imode_test_v532_quotes',
  notifications:'imode_test_v532_notifications',
  settings:'imode_v5_settings',
  user:'imode_v5_current_user'
};
var APP='./index.html';

/* =======================================================================
   1. helpers
   ======================================================================= */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function readJSON(key,fallback){
  try{var raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){return fallback}
}
function el(id){return document.getElementById(id)}
/* 2026-09-19 — the same LOCAL-date rule as js/03's todayISO(). This document does not load
   js/03, so it carries its own copy; the two must stay in step. toISOString() is the date in
   UTC and Thailand is UTC+7, so before 07:00 local the Workshop รับเครื่อง / ส่งคืน dates
   defaulted to yesterday. */
function todayISO(){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
/* The same precedence the application's canPermission() uses — an enabled per-user entry
   wins, otherwise the resolved role's list — read from the same two keys. It is a display
   gate only: the delete itself is carried out by the application, which checks again with
   requirePermission(). Enforcement off means everything is allowed, exactly as in the app. */
function permissionRoleName(u,roles){
  var raw=String((u&&(u.permissionRole||u.role))||'');
  var names=(roles||[]).map(function(r){return String(r.name||'')});
  if(names.indexOf(raw)>=0)return raw;
  var n=raw.toLowerCase(),find=function(x){return names.indexOf(x)>=0?x:raw};
  if(n.indexOf('service manager')>=0||n.indexOf('supervisor')>=0)return find('Service Manager');
  if(n.indexOf('executive secretary')>=0||n.indexOf('admin')>=0||n.indexOf('coordinator')>=0)return find('Admin / Coordinator');
  if(n.indexOf('technician')>=0||n==='r&d'||n.indexOf('engineer')>=0)return find('Technician');
  if(n.indexOf('sales')>=0||n.indexOf('marketing')>=0)return find('Sales');
  return raw;
}
function can(key){
  var s=readJSON(K.settings,{})||{};
  if(!(s.systemBehavior&&s.systemBehavior.enforceRolePermissions))return true;
  var u=readJSON(K.user,null);
  var entry=(s.userPermissions||{})[String((u&&(u.id||u.name))||'').trim()];
  if(entry&&entry.enabled)return (entry.permissions||[]).indexOf(key)>=0;
  var roles=Array.isArray(s.roles)?s.roles:[];
  var r=roles.filter(function(x){return String(x.name||'')===permissionRoleName(u,roles)})[0];
  return !!(r&&(r.permissions||[]).indexOf(key)>=0);
}
function toast(msg){
  var t=el('scdToast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2400);
}
function fmtDateTime(v){
  if(!v)return '-';
  var d=new Date(v);if(isNaN(d))return String(v);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' '+
         d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function fmtDay(v){
  if(!v)return '-';
  var d=new Date(v);if(isNaN(d))return String(v);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
}
function daysBetween(a,b){return Math.round((new Date(a)-new Date(b))/86400000)}
/* 12. how long this case has been open. It counts to the day it closed, not to today —
   a case closed last month is 3 days old, not 40. */
function caseAgeMs(c){
  var from=new Date(c&&c.createdAt||0).getTime();
  if(!from||isNaN(from))return 0;
  var closed=['เสร็จสิ้น','ปิดเคส'].indexOf(c&&c.status)>=0;
  var to=closed?new Date(c.updatedAt||Date.now()).getTime():Date.now();
  return Math.max(0,to-from);
}
function caseAge(c){
  var ms=caseAgeMs(c);
  if(!ms)return '-';
  var d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),mi=Math.floor(ms%3600000/60000);
  var closed=['เสร็จสิ้น','ปิดเคส'].indexOf(c&&c.status)>=0;
  var txt=d?(d+' วัน '+h+' ชม.'):(h?(h+' ชม. '+mi+' นาที'):(mi+' นาที'));
  return txt+(closed?' (จนถึงวันปิดงาน)':'');
}
/* Only an OPEN case can look old. */
function ageTone(c){
  if(['เสร็จสิ้น','ปิดเคส'].indexOf(c&&c.status)>=0)return '';
  var d=caseAgeMs(c)/86400000;
  return d>=7?'late':(d>=3?'warn':'');
}

/* Machine image priority, kept the same as the application's:
   the machine's own photo, then a family reference image, then No Image. A reference
   image is only ever displayed — it is never written back onto the machine. */
var MACHINE_FAMILY={
  hydrogenHo500:'./assets/machines/hydrogen-ho500wt.webp',
  hydrogenHo200:'./assets/machines/hydrogen-ho200wt.webp',
  nitrogen:'./assets/machines/nitrogen-generator.webp',
  laserMarking:'./assets/machines/laser-marking-bgf20.jpg',
  laserWelding:'./assets/machines/laser-welding.webp',
  blueThunder:'./assets/machines/welding-blue-thunder.jpg',
  centrifugalVa20:'./assets/machines/centrifugal-va20.jpg',
  centrifugalVa38:'./assets/machines/centrifugal-va38.jpg',
  polishingFamily:'./assets/machines/polishing-family.webp'
};
function familyPhoto(m){
  if(!m)return '';
  var text=[m.model,m.name,m.nameTh,m.nameEn].filter(Boolean).join(' ').toLowerCase();
  var compact=text.replace(/[\s_-]+/g,'');
  if(compact.indexOf('ho500wt')>=0)return MACHINE_FAMILY.hydrogenHo500;
  if(compact.indexOf('ho200wt')>=0)return MACHINE_FAMILY.hydrogenHo200;
  if(/n\s*-?\s*(20|40)/i.test(text)||text.indexOf('nitrogen gas generator')>=0
     ||text.indexOf('เครื่องผลิตแก๊สไนโตรเจน')>=0)return MACHINE_FAMILY.nitrogen;
  if(/blue\s*-?\s*thunder/i.test(text))return MACHINE_FAMILY.blueThunder;
  if(/laser\s*weld|bull\s*thunder|เครื่องเชื่อมเลเซอร์/i.test(text))return MACHINE_FAMILY.laserWelding;
  if(/bgf\s*-?\s*20|laser\s*mark|เครื่องมาร์กเลเซอร์/i.test(text))return MACHINE_FAMILY.laserMarking;
  if(/va\s*38/i.test(text))return MACHINE_FAMILY.centrifugalVa38;
  if(/va\s*20/i.test(text))return MACHINE_FAMILY.centrifugalVa20;
  if(/va\s*18|20\s*l\s*x\s*3|msh|gyratory\s*polish|เครื่องขัดระบบไจเรต/i.test(text))return MACHINE_FAMILY.polishingFamily;
  if(/centrifugal\s*disc\s*finishing|เครื่องขัดแบบจานหมุนเหวี่ยง/i.test(text))return MACHINE_FAMILY.polishingFamily;
  return '';
}

/* getCaseIdFromUrl — the only thing the URL ever carries. */
function getCaseIdFromUrl(){
  var p=new URLSearchParams(window.location.search);
  return (p.get('caseId')||p.get('case')||'').trim();
}

/* =======================================================================
   2. data adapter
   Everything the page reads goes through here. Swapping localStorage for Supabase means
   rewriting these functions and nothing else — no render function touches storage.
   ======================================================================= */
var CaseDetailData=(function(){
  var db=null;
  function all(){
    if(db)return db;
    db={
      cases:readJSON(K.cases,[])||[],
      customers:readJSON(K.customers,[])||[],
      machines:readJSON(K.machines,[])||[],
      technicians:readJSON(K.tech,[])||[],
      warranties:readJSON(K.warranties,[])||[],
      reports:readJSON(K.reports,[])||[],
      qc:readJSON(K.qc,[])||[],
      lineRequests:readJSON(K.lineRequests,[])||[],
      quotes:readJSON(K.quotes,[])||[],
      notifications:readJSON(K.notifications,[])||[],
      settings:readJSON(K.settings,{})||{},
      user:readJSON(K.user,null)
    };
    return db;
  }
  function byId(list,id){
    for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];
    return null;
  }
  return {
    /* A case is found by id or by ticket, so a link may carry either. */
    loadCase:function(caseId){
      var list=all().cases;
      return Promise.resolve(byId(list,caseId)||list.filter(function(c){
        return String(c.ticket||'').toLowerCase()===String(caseId||'').toLowerCase();
      })[0]||null);
    },
    loadMachine:function(machineId){return Promise.resolve(byId(all().machines,machineId))},
    loadCustomer:function(customerId){return Promise.resolve(byId(all().customers,customerId))},
    loadTechnician:function(techId){return Promise.resolve(byId(all().technicians,techId))},
    /* 2026-09-20 — A JOB CAN HAVE A CREW, and this page only ever showed its lead.
       js/38 (part 17 §2) keeps the whole crew in c.assignees and the lead in c.assignee;
       across the wire the crew travels as a comma list in that one column, because
       service_cases has no assignees column. Both shapes are read here, in that order, so a
       row that came from the cloud reads the same as one written on this device.
       Unknown ids are dropped rather than shown blank: a technician removed from the team
       should not leave a nameless chip on the case. */
    loadCrew:function(c){
      var ids=[];
      try{
        if(c&&Object.prototype.toString.call(c.assignees)==='[object Array]'&&c.assignees.length)ids=c.assignees.slice();
        else if(c&&c.assignee)ids=String(c.assignee).split(',');
      }catch(e){}
      var seen={},out=[];
      ids.forEach(function(raw){
        var id=String(raw||'').trim();
        if(!id||seen[id])return;
        seen[id]=1;
        var t=byId(all().technicians,id);
        if(t)out.push(t);
      });
      return Promise.resolve(out);
    },
    allTechnicians:function(){return all().technicians.slice()},
    currentUser:function(){return all().user},
    roles:function(){return (all().settings.roles)||[]},
    loadMachineHistory:function(machineId){
      return Promise.resolve(all().cases.filter(function(c){return c.machineId===machineId}));
    },
    loadWarranty:function(machineId){
      var w=all().warranties.filter(function(x){return x.machineId===machineId})
        .sort(function(a,b){return new Date(b.endDate||0)-new Date(a.endDate||0)});
      return Promise.resolve(w[0]||null);
    },
    loadAssignment:function(c){
      return Promise.resolve({technicianId:c&&c.assignee||'',assignedAt:c&&c.updatedAt||'',
        coordinator:(all().user&&all().user.name)||''});
    },
    loadAppointment:function(c){
      return Promise.resolve({date:c&&c.appointment||'',location:c&&c.location||'',
        contact:c&&c.contact||'',status:c&&c.appointment?'confirmed':'pending'});
    },
    loadQuotation:function(caseId){
      var q=all().quotes.filter(function(x){return x.caseId===caseId})
        .sort(function(a,b){return new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0)});
      return Promise.resolve(q[0]||null);
    },
    loadReports:function(caseId){
      return Promise.resolve(all().reports.filter(function(r){return r.caseId===caseId}));
    },
    loadQc:function(caseId){
      return Promise.resolve(all().qc.filter(function(q){return q&&q.caseId===caseId}));
    },
    loadAttachments:function(c){
      /* Case evidence lives in three places, and all three are read so the card shows what
         really exists rather than a placeholder count: what the CUSTOMER attached when they
         reported the problem (c.media — this one was missed, which is why a reported photo
         never appeared here), then the field status log, then the service report. */
      var out=[];
      /* The same fallback js/42 uses in the application: submitPortalIssue() writes the
         attachments to BOTH the case and the line_customer_requests row, and until
         06-v70-case-media.sql the case column did not exist, so on a second device the
         photos can only be on the request. Without this the popup showed them and this page
         did not, for the same case. */

/* =======================================================================
   5b. writing — the only part of this page that changes anything
   The status circles in section 6 move the case forward, so the page needs a real write.
   It does two things and no more:
     1. rewrites this one case inside imode_test_v532_cases, the array the whole
        application reads;
     2. UPDATEs the two columns that changed on Supabase — update(), never upsert(), so a
        payload that does not name every column cannot blank the rest of the row.
   The connection is read from imode_v5_cloud, which js/23 writes on this device the first
   time the application boots. With no config the local write still happens and the caller
   is told the change has not left this device, rather than being told it worked.
   ======================================================================= */
var CaseWrite=(function(){
  var client=null,tried=false;
  function cfg(){
    /* production (js/00-env.js): the shipped server wins over whatever this device remembers */
    var E=window.IMODE_ENV;if(E&&E.production&&E.cloud&&E.cloud.url&&E.cloud.key)return {url:E.cloud.url,key:E.cloud.key};
    try{var c=JSON.parse(localStorage.getItem('imode_v5_cloud')||'{}');return (c&&c.url&&c.key)?c:null}
    catch(e){return null}
  }
  function db(){
    if(tried)return client;
    tried=true;
    var c=cfg();
    try{if(c&&window.supabase)client=window.supabase.createClient(c.url,c.key,window.IMODE_SB_OPTIONS)}catch(e){client=null}
    return client;
  }
  function localCases(){return readJSON(K.cases,[])||[]}
  /* Returns a promise that resolves {ok, cloud} — cloud:false means it is on this device
     only, which the caller says out loud. */
  /* 2026-10-20 (ข้อ 5): the chat line for this change goes out once the write has landed. */
  function patch(caseId,changes,why){
    var before=null;
    localCases().forEach(function(x){if(x&&x.id===caseId)before=x});
    var notes=[],moved='';
    if(before&&'status' in changes&&changes.status!==before.status){
      moved=(statusChatText(before.status,changes.status,
        why||(('assignees' in changes||'assignee' in changes)?'มอบหมายช่าง':'')));
    }
    if(before&&'assignees' in changes){
      var was=String(before.assignee||'')+'|'+((before.assignees||[]).join(','));
      var now=String(changes.assignee||'')+'|'+((changes.assignees||[]).join(','));
      if(was!==now&&(changes.assignees||[]).length){
        var names=(changes.assignees||[]).map(function(id){
          var t=null;try{t=CaseDetailData.allTechnicians().filter(function(x){return x.id===id})[0]}catch(e){}
          return (t&&t.name)||id;
        });
        notes.push('👷 มอบหมายช่าง: '+names.join(', ')+(changes.appointment?' · นัดหมาย '+fmtDateTime(changes.appointment):''));
      }
    }
    if(moved)notes.push(moved);        /* who got the job first, then where the case went */
    return patchNow(caseId,changes,why).then(function(r){
      if(r&&r.ok)notes.forEach(function(t){chatNote(caseId,t)});
      return r;
    });
  }
  function patchNow(caseId,changes,why){
    var list=localCases(),hit=null;
    for(var i=0;i<list.length;i++){
      if(list[i]&&list[i].id===caseId){hit=list[i];break}
    }
    if(!hit)return Promise.resolve({ok:false,reason:'not-found'});
    var prevStatus=hit.status;
    var hadMedia=hit.media;
    for(var k in changes)if(Object.prototype.hasOwnProperty.call(changes,k))hit[k]=changes[k];
    hit.updatedAt=new Date().toISOString();
    /* This page cannot load js/69 — it is a document of its own — so it writes its own entry.
       A status change made here is a person pressing a circle or picking from the list, with
       one exception: assigning also moves เคสใหม่ on to มอบหมายแล้ว, which is the rule doing
       it, not the coordinator choosing a status. */
    if('status' in changes&&changes.status!==prevStatus){
      noteStatusChange(caseId,prevStatus,changes.status,
        why||(('assignees' in changes||'assignee' in changes)?'มอบหมายช่าง':''));
    }
    try{localStorage.setItem(K.cases,JSON.stringify(list))}catch(e){
      /* 2026-10-29: photos are stored inside the case as base64, so a few cases with photos fill
         the browser's ~5 MB. The save then failed as a whole — the panel stayed open and nothing
         was kept ("แนบรูปแล้วกดบันทึกไม่ได้"). When the server is there, the new files go to the
         server and only the local copy leaves them out; without a server the person is told why. */
      var saved=false;
      if('media' in changes&&db()){
        hit.media=hadMedia;
        try{localStorage.setItem(K.cases,JSON.stringify(list));saved=true}catch(e2){}
        if(!saved)hit.media=changes.media;
      }
      if(!saved)return Promise.resolve({ok:false,reason:'storage'});
    }
    /* keep the page's own model in step so the next render shows the new state */
    try{if(caseDetailModel&&caseDetailModel.case&&caseDetailModel.case.id===caseId){
      if('status' in changes)caseDetailModel.case.status=changes.status;
      caseDetailModel.case.updatedAt=hit.updatedAt;
    }}catch(e){}

    var sb=db();
    if(!sb)return Promise.resolve({ok:true,cloud:false});
    var row={updated_at:hit.updatedAt};
    if('status' in changes)row.status=changes.status;
    /* service_cases has one `assignee` column and no `assignees`. js/38 puts the whole crew
       in it as a comma list, lead first, and splits it apart again on the way in — so this
       page has to write the same shape or a two-technician job would come back as one. */
    if('assignees' in changes||'assignee' in changes){
      var crew=changes.assignees||(changes.assignee?[changes.assignee]:[]);
      row.assignee=crew.length?crew.join(','):null;
    }
    /* 2026-09-16: the appointment was missing from this payload, so มอบหมายและนัดหมาย wrote the
       date to localStorage and never to Supabase — and syncCloud(), which replaces `cases`
       wholesale, threw it away on the next sync. Measured on the live project: 19 assigned
       cases with an empty appointment against one that still had its date, and that one had
       been scheduled through js/16's popup instead. The calendar filters every view on
       c.appointment, so those 19 jobs could never appear on it.
       Same shape of fault as the media column in part 18 and the crew in part 17: a field
       added to the object is dropped unless the payload names it. */
    if('appointment' in changes)row.appointment=changes.appointment||null;
    /* ลงรายละเอียดเคส on this page (2026-09-17). Column names are cloudUpsertCase()'s own. */
    var COLS={customerId:'customer_id',customer:'customer',contact:'contact',phone:'phone',email:'email',
      location:'location',branch:'branch',machineId:'machine_id',machine:'machine',model:'model',serial:'serial',
      machineSize:'machine_size',warranty:'warranty',channel:'channel',serviceType:'service_type',
      priority:'priority',issue:'issue',note:'note',fieldStatusLog:'field_status_log',
      /* 2026-10-20: files staff add to the problem (ข้อ 11/12) — service_cases.media, 06-v70-case-media.sql */
      media:'media'};
    for(var ck in COLS)if(Object.prototype.hasOwnProperty.call(changes,ck))row[COLS[ck]]=changes[ck];
    function send(){
      try{
        return Promise.resolve(sb.from('service_cases').update(row).eq('id',caseId))
          .then(function(r){
            if(r&&r.error){console.warn('[scd] cloud update failed',r.error);return {ok:true,cloud:false,error:r.error}}
            return {ok:true,cloud:true};
          },function(e){console.warn('[scd] cloud update threw',e);return {ok:true,cloud:false,error:e}});
      }catch(e){return Promise.resolve({ok:true,cloud:false,error:e})}
    }
    /* service_cases.reported (supabase/17-case-reported.sql) is sent only once it is known to
       exist: an update naming a missing column fails as a whole, and that would take the rest of
       the details down with it. */
    if(changes.reported&&typeof sb.from==='function'){
      return Promise.resolve(sb.from('service_cases').select('reported').limit(1)).then(function(res){
        if(!(res&&res.error))row.reported=changes.reported;
        return send();
      },function(){return send()});
    }
    return send();
  }
  return {
    setStatus:function(id,status,why){return patch(id,{status:status},why)},
    setDetails:function(id,changes){return patch(id,changes||{})},
    /* The case's attachments as the server holds them. js/72 trims the device's copy to stubs
       (name, type, size — no data) when the browser's storage is full, so a photo can be here
       as a grey document tile while the file itself is only in the cloud. Null = no answer. */
    /* The case's ใบตรวจ straight from service_reports. The technician app writes there directly,
       and the application only copies the rows into this device's storage on its next sync —
       which a full storage (js/72) can stop — so the page asks the server itself. The mapping is
       js/03's own (syncCloud). Null = no answer, [] = the server has none. */
    fetchReports:function(id){
      var sb=db();
      if(!sb||!id)return Promise.resolve(null);
      try{
        return Promise.resolve(sb.from('service_reports').select('*').eq('case_id',id)).then(function(res){
          if(!res||res.error||!Array.isArray(res.data))return null;
          return res.data.map(function(r){return {id:r.id,reportNo:r.report_no,caseId:r.case_id||'',
            customerId:r.customer_id||'',machineId:r.machine_id||'',techId:r.tech_id||'',
            serviceType:r.service_type||'',workType:r.work_type||'',checkInAt:r.check_in_at||'',
            appointment:r.appointment||'',checklist:r.checklist||[],diagnosis:r.diagnosis||'',
            workPerformed:r.work_performed||'',recommendation:r.recommendation||'',parts:r.parts||[],
            beforePhotos:r.before_photos||[],afterPhotos:r.after_photos||[],videos:r.videos||[],
            statusLog:r.status_log||[],customerAccept:r.customer_accept||'',
            customerSignature:r.customer_signature||'',techSignature:r.tech_signature||'',
            nextPm:r.next_pm||'',lineSentAt:r.line_sent_at||'',lineSendStatus:r.line_send_status||'',
            status:r.status||'Completed',createdAt:r.created_at,updatedAt:r.updated_at}});
        },function(){return null});
      }catch(e){return Promise.resolve(null)}
    },
    fetchMedia:function(id){
      var sb=db();
      if(!sb||!id)return Promise.resolve(null);
      try{
        return Promise.resolve(sb.from('service_cases').select('media').eq('id',id).limit(1)).then(function(r){
          var row=r&&r.data&&r.data[0];
          return row&&Array.isArray(row.media)?row.media:null;
        },function(){return null});
      }catch(e){return Promise.resolve(null)}
    },
    patch:function(id,changes,why){return patch(id,changes||{},why)},
    /* Assigning is the one other thing this page may change. The lead is always ids[0], the
       same rule js/38 enforces, so `assignee` and `assignees` can never disagree. A case
       still sitting at เคสใหม่ moves on to มอบหมายแล้ว in the same write, exactly as
       js/16's imodeAssignCase() does it — and the technician's own device derives the
       "you have been given a job" notice from the case itself (part 16 §5), so nothing
       else has to be sent. */
    setAssignees:function(id,ids,caseStatus,appointment){
      var crew=[],seen={};
      (ids||[]).forEach(function(v){
        var t=String(v||'').trim();
        if(!t||seen[t])return;
        seen[t]=1;crew.push(t);
      });
      var changes={assignees:crew,assignee:crew[0]||''};
      var when=String(appointment||'').trim();
      if(when)changes.appointment=when;
      /* มอบหมาย and นัดหมาย are one press now, so a case that had not got going yet lands on
         นัดหมายแล้ว — it has a real date on it, which is what that status means. Only the two
         early statuses are moved: a job already in progress being re-crewed keeps its own. */
      if(crew.length&&when&&['เคสใหม่','มอบหมายแล้ว'].indexOf(caseStatus)>=0)changes.status='นัดหมายแล้ว';
      else if(crew.length&&caseStatus==='เคสใหม่')changes.status='มอบหมายแล้ว';
      return patch(id,changes);
    },
    configured:function(){return !!cfg()},
    client:function(){return db()}
  };
})();

/* ---------- what the technician has done, read from the case ---------- */
/* The nine field statuses are js/03's FIELD_STATUSES, in order. The case carries the
   current one in fieldStatus and the whole history in fieldStatusLog, so this page can
   show the technician's progress without asking the application for anything. */
var FIELD_STEPS=['กำลังเดินทาง','ถึงหน้างาน','เริ่มตรวจเช็ก','กำลัง PM / Maintenance',
                 'กำลังซ่อม Service','รออะไหล่','ทดสอบเครื่อง','รอลูกค้าตรวจรับ','จบงาน'];
/* รออะไหล่ is a branch, not a stage every job must pass. The ordered main path is kept
   separately so a finished legacy/stale-cache case can still show the work it necessarily
   passed, without falsely claiming that it waited for parts. */
var FIELD_HOLD='รออะไหล่';
/* four colours for the nine field statuses, in FIELD_STEPS order (owner, 2026-10-29: "เหลือ เขียว
   เหลือง ส้ม แดง"): yellow = on the way / waiting for the customer, green = on site / finished,
   orange = working, red = waiting for parts. The badge under the case circles uses it (.ftone-*). */
var FIELD_TONES=['yellow','green','orange','orange','orange','red','orange','yellow','green'];
function fieldTone(label){
  var k=FIELD_STEPS.indexOf(String(label||''));
  return k>=0?FIELD_TONES[k]:'orange';
}
var FIELD_MAIN=FIELD_STEPS.filter(function(x){return x!==FIELD_HOLD});
function fieldLog(m){
  var log=(m&&m.raw&&m.raw.fieldStatusLog)||[];
  return Array.isArray(log)?log:[];
}
function fieldReached(m){
  var hit={};
  fieldLog(m).forEach(function(e){if(e&&e.status)hit[e.status]=e.createdAt||e.timestamp||''});
  var now=(m&&m.raw&&m.raw.fieldStatus)||(m&&m.case&&m.case.subStatus)||'';
  if(now&&!Object.prototype.hasOwnProperty.call(hit,now))hit[now]='';
  /* fieldStatus is the current ordered position even when an older case did not write one
     fieldStatusLog row per press. Infer only the main path up to that position. The hold
     branch remains reached solely when it is current or has its own recorded entry. */
  var at=FIELD_MAIN.indexOf(now);
  if(at>=0)FIELD_MAIN.slice(0,at+1).forEach(function(fs){
    if(!Object.prototype.hasOwnProperty.call(hit,fs))hit[fs]='';
  });
  return hit;
}
/* The name behind fieldStatusLog's techId. saveFieldStatus() writes `c.assignee||fieldTechId`,
   which for a crew is js/38's comma list, so only the lead is resolved - that is who the entry
   is attributed to. Read straight from storage: all() lives inside the data adapter. */
function fieldTechName(id){
  var raw=String(id||'').split(',')[0].trim();
  if(!raw)return '-';
  var list=readJSON(K.tech,[])||[];
  for(var i=0;i<list.length;i++)if(list[i]&&list[i].id===raw)return list[i].name||raw;
  return raw;
}
/* 2026-09-21 — THE ช่าง ROW LISTS EVERYONE ASSIGNED TO THE CASE, not one name.
   The entry itself only ever records ONE id: saveFieldStatus() writes `c.assignee||fieldTechId`,
   and js/38 keeps c.assignee as the LEAD with the crew in c.assignees (part 17 §2). So the
   crew has to come from the case — m.assignment.crew, which loadCrew() has already resolved to
   real technician records, reading c.assignees first and the comma list in c.assignee second.

   Whoever the entry recorded is added on the end if they are no longer on the case: a technician
   taken off it afterwards still did that step, and dropping their name would rewrite history. */
function fieldCrewFor(m,e){
  var out=[],seen={};
  var crew=(m&&m.assignment&&Object.prototype.toString.call(m.assignment.crew)==='[object Array]')
    ? m.assignment.crew : [];
  crew.forEach(function(t,i){
    if(!t||!t.id||seen[t.id])return;
    seen[t.id]=1;
    out.push({name:t.name||t.id,lead:i===0,off:false});
  });
  String((e&&e.techId)||'').split(',').forEach(function(raw){
    var id=String(raw||'').trim();
    if(!id||seen[id])return;
    seen[id]=1;
    out.push({name:fieldTechName(id),lead:false,off:true});
  });
  return out;
}
function fieldCrewHTML(m,e){
  var list=fieldCrewFor(m,e);
  if(!list.length)return '-';
  return '<span class="sd-fcrew">'+list.map(function(x){
    return '<span class="sd-fcrew-chip'+(x.lead?' is-lead':'')+(x.off?' is-off':'')+'">'
      +esc(x.name)+(x.lead?'<i>หัวหน้างาน</i>':'')
      +(x.off?'<i>ไม่ได้อยู่ในเคสแล้ว</i>':'')+'</span>';
  }).join('')+'</span>';
}

/* What the technician recorded at one field status: the time, who, the note, and the photos
   and clips attached through the บันทึกสถานะพร้อมรูป button - all of it already stored on the case as
   fieldStatusLog[], and until now shown nowhere on this page except as an anonymous thumbnail
   in the เอกสาร & รูปภาพ panel.

   The tiles are addressed by their index in caseDetailModel.attachments, matched on the data
   URL, so they reuse mediaTiles() and the page's existing lightbox rather than carrying a
   second copy of either. loadAttachments() pushes the very same string, so the match is an

/* 2026-09-28: the position the technician's phone recorded at a step — Check-in (js/03) and,
   since js/126, ถัดไป into ถึงหน้างาน both write latitude / longitude onto the entry. */
function gpsRowHTML(e,fs){

  var why={denied:'ช่างไม่ได้อนุญาตให้ใช้ GPS',unavailable:'หาพิกัดไม่ได้',timeout:'หาพิกัดไม่ทันเวลา',unsupported:'อุปกรณ์ไม่รองรับ GPS'}[e&&e.gpsError];
  return '<dt>พิกัด</dt><dd><span class="sd-empty" style="margin:0">ไม่ได้บันทึกพิกัด'+(why?' — '+esc(why):'')+'</span></dd>';
}
function fieldStepDetailHTML(m,k){
  var fs=FIELD_STEPS[k]||'';
  var entries=fieldLog(m).filter(function(e){return e&&e.status===fs});
  var atts=m.attachments||[];
  var head='<div class="sd-fdetail-head"><b>'+esc(fs)+'</b>'
    +'<button type="button" class="sd-fdetail-x" data-fstep-close="1">ปิด</button></div>';
  if(!entries.length){
    var isNow=String((m.raw&&m.raw.fieldStatus)||'')===fs;
    var wasReached=Object.prototype.hasOwnProperty.call(fieldReached(m),fs);
    return head+'<p class="sd-empty">'+(isNow
      ? 'ช่างอยู่ที่ขั้นนี้ แต่ยังไม่ได้บันทึกรายละเอียดหรือรูปจากหน้างาน'
      : wasReached
        ? 'ผ่านขั้นนี้แล้ว แต่ไม่มีรายละเอียดหรือรูปที่บันทึกจากหน้างาน'
        : 'ยังไม่ถึงขั้นนี้ - ยังไม่มีข้อมูลจากหน้างาน')+'</p>';
  }
  return head+entries.map(function(e){
    var tiles=[];
    (e.media||[]).forEach(function(mm){

        if(atts[i]&&atts[i].data===mm.data){tiles.push({a:atts[i],i:i});return}
      }
    });
    var missing=(e.media||[]).length-tiles.length;
    /* js/91 lets a technician correct what was written at a step, keeping the version it
       replaced on the entry as revisions[]. It rides in field_status_log, a real jsonb column,
       so the office sees the same history the technician does. Read only here — restoring a
       version belongs where the correction is made. */
    var revs=Array.isArray(e.revisions)?e.revisions:[];
    var histHTML=e.editedAt
      ? '<p class="sd-fedited">✎ แก้ไขล่าสุด '+esc(fmtDateTime(e.editedAt))
        +(e.editedBy?' โดย '+esc(e.editedBy):'')+'</p>'
        +(revs.length?'<details class="sd-frevs"><summary>🕐 ประวัติการแก้ไข ('+revs.length+')</summary>'
          +'<ol class="sd-frevlist">'+revs.map(function(r){
             return '<li><small>'+esc(fmtDateTime(r.at))+(r.by?' · '+esc(r.by):'')
               +(r.media?(' · ไฟล์ '+(r.media.length||0)):' · ไม่ได้เปลี่ยนรูป')+'</small>'
               +'<span>'+(r.note?esc(r.note):'<i>ไม่มีรายละเอียด</i>')+'</span></li>';
            }).join('')+'</ol></details>':'')
      : '';
    return '<div class="sd-fentry">'
      +'<dl class="sd-kv"><dt>เวลา</dt><dd>'+esc(fmtDateTime(e.createdAt))+'</dd>'
      +'<dt>ช่าง</dt><dd>'+fieldCrewHTML(m,e)+'</dd>'+gpsRowHTML(e,fs)+'</dl>'
      +histHTML
      +(e.note?'<p class="sd-fnote">'+esc(e.note)+'</p>'
              :'<p class="sd-empty">ไม่ได้บันทึกรายละเอียดเพิ่มเติม</p>')
      +(tiles.length?'<div class="cmp-grid" style="margin-top:10px">'+mediaTiles(tiles)+'</div>':'')
      +(missing>0?'<p class="sd-empty">มีไฟล์แนบอีก '+missing+' รายการที่เปิดจากเครื่องนี้ไม่ได้</p>':'')
      +'</div>';
  }).join('');
}

/* ============================ the two sliding blocks ============================
   The step drawer and the field panel inside it both open and close by sliding, and both are
   rendered by repaintProgress(), which REPLACES the whole progress block. That is what makes
   this less trivial than a class toggle:

   OPENING. A node that is inserted already-open has no start value to animate from, so a block
   being opened by a press is rendered collapsed and gets .is-open on the second animation
   frame. But repaintProgress() is also called by applyStatus(), by CaseLive and by the delete
   flow — and a block re-rendered by one of those must come back ALREADY open, or it would sit
   at max-height:0 with nothing left to trigger it and simply be invisible. slideNext is what
   tells the two apart: it names the one block this particular render is about to animate.

   SETTLING. When the opening transition finishes the cap is dropped to max-height:none, so a
   tall drawer can never be clipped by whatever number the stylesheet guessed.

   CLOSING. repaintProgress() removes the element, and a node that is gone cannot transition, so
   the collapse is run first and the repaint happens only once it has arrived. The pin is the
   whole trick: .is-open is a cap far above the content, so removing the class alone would
   animate 2400 -> 0 and nothing would appear to move until the value passed the real height,
   then it would snap. Pinning to scrollHeight first makes the whole 340ms visible — and it
   works whether the cap was a number or none. The inline value is set on both sides because
   inline beats the class, so the class alone could not take it back down.

   transitionend is not trusted on its own (a browser that skips the transition never fires it),
   so a timeout finishes the job and a data-closing flag stops the two from both repainting. */
var slideNext=null;
function slideWrap(id,cls){
  var fresh=(slideNext===id);
  return '<div class="'+cls+(fresh?'':' is-open')+'" id="'+id+'"'
    +(fresh?'':' style="max-height:none"')+'>';
}
function slideOpen(id){
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    var box=document.getElementById(id);
    if(!box)return;
    var reduce=false;
    try{reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){}
    if(reduce){box.classList.add('is-open');box.style.maxHeight='none';return}
    /* Animate to the block's REAL height, not to the class's cap. Measured: with the cap at
       2400px and a 163px drawer, max-height passes the content height about 24ms in, so the
       whole thing looked instant however long the transition was — the mirror image of what
       the cap does on the way out. scrollHeight is readable while max-height is 0 because the
       overflow is hidden, not display:none. */
    box.style.maxHeight=box.scrollHeight+'px';
    box.classList.add('is-open');
    var settle=function(){
      if(!box.classList.contains('is-open'))return;   /* closed again in the meantime */
      if(box.getAttribute('data-closing'))return;
      box.style.maxHeight='none';
    };
    box.addEventListener('transitionend',function(e){if(e.propertyName==='max-height')settle()});
    setTimeout(settle,420);
  })});
}
function slideShut(id,after){
  var box=document.getElementById(id);
  var reduce=false;
  try{reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){}
  if(!box||reduce){after();return}
  if(box.getAttribute('data-closing'))return;        /* already on its way out */
  box.setAttribute('data-closing','1');
  box.style.maxHeight=box.scrollHeight+'px';
  void box.offsetHeight;
  box.classList.remove('is-open');
  box.style.maxHeight='0px';
  var done=function(){
    if(!box.getAttribute('data-closing'))return;
    box.removeAttribute('data-closing');
    after();
  };
  box.addEventListener('transitionend',function(e){if(e.propertyName==='max-height')done()});
  setTimeout(done,420);
}
/* Closing the whole drawer closes the field panel with it — it lives inside. */
function closeStepDrawer(){
  slideShut('sdStepDrawer',function(){openStep=null;openField=null;repaintProgress()});
}
function closeFieldDetail(){
  /* the circle lets go at once, rather than staying ringed through the collapse */
  var li=document.querySelector('.sd-field li.is-open');
  if(li)li.classList.remove('is-open');
  var btn=document.querySelector('.sd-fbtn[aria-expanded="true"]');
  if(btn)btn.setAttribute('aria-expanded','false');
  slideShut('sdFieldDetail',function(){openField=null;repaintProgress()});
}

/* "the technician has finished" — จบงาน on the field track, or a service report exists.
   Either one is proof the work is over; a case can reach เสร็จสิ้น through the report path
   without the field track ever being touched. */
function fieldDone(m){
  if(!m||!m.case)return false;
  var now=(m.raw&&m.raw.fieldStatus)||m.case.subStatus||'';
  if(String(now)==='จบงาน')return true;
  if(Object.prototype.hasOwnProperty.call(fieldReached(m),'จบงาน'))return true;
  return !!(m.closing&&m.closing.serviceReportReady);
}

/* 2026-09-18: มอบหมาย and นัดหมาย are ONE circle. They were two, and by then they were two
   circles for one press — js/16's picker has demanded a technician AND a date together since
   part 22 ("รวมปุ่ม มอบหมายงาน กับ นัดหมาย ไว้ด้วยกัน"), and js/83's รับใบเสนอราคา goes through
   the same panel. Both statuses still exist and are still written; they simply share a step.

   EVERY STEP IS ADDRESSED BY KEY, through S(), and never by a literal index. Before this the
   page carried ~20 hard-coded numbers — stepDrawerHTML's branches, stepGate, WS_LABELS,
   wsWrite's keepStep, openStep — and merging two entries shifts every one of them by one,
   which is exactly the kind of silent off-by-one this file has been bitten by. Add or move a
   step and only this array changes. */
var STEPS=[
  {key:'intake',  th:'รับแจ้งปัญหา',       statuses:['เคสใหม่']},
  {key:'assign',  th:'มอบหมาย / นัดหมาย',  statuses:['มอบหมายแล้ว','นัดหมายแล้ว']},
  {key:'service', th:'กำลังให้บริการ',      statuses:['กำลังดำเนินการ','รออะไหล่']},
  {key:'done',    th:'งานเสร็จ / ตรวจรับ',  statuses:['รอส่งงาน','เสร็จสิ้น']},
  {key:'close',   th:'ปิดเคส',             statuses:['ปิดเคส']}
];
function S(key){
  for(var i=0;i<STEPS.length;i++)if(STEPS[i].key===key)return i;
  return -1;
}
function stepNo(key){return S(key)+1}   /* what the circle says on screen */
/* Hold states are shown as their own badges. They are never one of the six steps: a case
   that is waiting for parts is still at "กำลังให้บริการ". */
var HOLD_STATES={'รออะไหล่':'📦 รออะไหล่'};

function stepIndex(status){
  for(var i=0;i<STEPS.length;i++)if(STEPS[i].statuses.indexOf(status)>=0)return i;
  return 0;
}

function renderCaseHeader(m){
  var c=m.case,isDone=['เสร็จสิ้น','ปิดเคส'].indexOf(c.status)>=0;
  var hold=HOLD_STATES[c.status];
  return '<nav class="scd-crumb" aria-label="breadcrumb">'
    +'<a href="'+APP+'?page=cases">เคสงานบริการ</a><span>›</span><b>'+esc(c.caseNo)+'</b></nav>'
    +'<div class="scd-headcard">'
    +'<section class="scd-headmain">'
      +'<div class="scd-title-row">'
        +'<h1>'+esc(c.caseNo)+'</h1>'
        +'<span class="badge badge-status'+(isDone?' is-done':hold?' is-hold':'')+'">'
        +(isDone?'✔':'⟳')+' '+esc(c.status||'-')+'</span>'
        +'<span class="badge badge-prio'+(c.priority==='ด่วนมาก'?' is-urgent':'')+'">◷ '+esc(c.priority||'ปกติ')+'</span>'
        +(hold?'<span class="badge badge-sub">'+esc(hold)+'</span>':'')
      +'</div>'
      +'<p class="scd-customer">'+esc(m.customer.name)+'</p>'
      +'<div class="scd-meta">'
        +'<div><i>📅</i><small>รับแจ้ง:</small> '+esc(fmtDateTime(c.createdAt))+'</div>'
        +'<div class="scd-age'+(ageTone(c)?' is-'+ageTone(c):'')+'"><i>⏳</i><small>อายุเคส:</small> '
          +esc(caseAge(c))+'</div>'
        +'<div><i>💬</i><small>ช่องทาง:</small> '+esc(c.source||'-')+'</div>'
        +'<div><i>👤</i><small>ผู้ติดต่อ:</small> '+esc(m.customer.contactName||'-')
          +(m.customer.phone?'&nbsp;&nbsp;'+esc(m.customer.phone):'')+'</div>'

/* SLA is computed from what the case actually carries: a case nobody has picked up is on
   the response clock, a scheduled case counts down to its appointment, anything else has
   no target and says so rather than inventing "On Time". */
function renderSla(m){
  var c=m.case,cls='',state='On Time',line='',act='';
  if(['เสร็จสิ้น','ปิดเคส'].indexOf(c.status)>=0){
    state='Closed';line='ปิดงานแล้ว '+esc(fmtDateTime(c.updatedAt));
  }else if(!m.assignment.technician&&respondedStamp(c)){
    /* Answered but not yet assigned. The clock is settled; the case is not. */
    var rs=respondedStamp(c);
    state='Responded';line='ตอบกลับลูกค้าแล้ว '+esc(fmtDateTime(rs.at))
      +(rs.by?' · '+esc(rs.by):'');
  }else if(!m.assignment.technician&&c.status==='เคสใหม่'){
    var mins=30,left=new Date(c.createdAt).getTime()+mins*60000-Date.now();
    if(left<0){cls='is-over';state='Overdue';line='เกินเวลาตอบกลับ '+fmtLeft(-left);}
    else{cls=left<=10*60000?'is-risk':'';state=left<=10*60000?'At Risk':'On Time';
         line='ต้องตอบกลับภายใน '+fmtLeft(left);}
    /* This page never writes — it reads localStorage and hands every edit back to the
       application, which is also the only place that can push the stamp to Supabase. So
       the button is a hand-off: js/28 picks the intent up and calls imodeMarkResponded(). */
    act='<button type="button" class="scd-sla-done" data-action="mark-responded">'
       +'⏱ บันทึกว่าตอบกลับแล้ว</button>';
  }else if(c.status==='รออะไหล่'){
    cls='is-risk';state='On Hold';line='รออะไหล่ · นาฬิกางานหยุดชั่วคราว';
  }else if(m.appointment.date){
    var d=new Date(m.appointment.date)-Date.now();
    if(d<0){cls='is-over';state='Overdue';line='เลยเวลานัด '+fmtLeft(-d);}
    else{cls=d<=2*3600000?'is-risk':'';state=d<=2*3600000?'At Risk':'On Time';
         line='เหลืออีก '+fmtLeft(d)+' ถึงเวลานัด';}
  }else{
    cls='is-risk';state='No target';line='ยังไม่มีนัดหมาย จึงยังไม่มีกำหนด SLA';
  }
  return '<aside class="scd-sla '+cls+'"><h3>SLA</h3>'
    +'<div class="scd-sla-state"><span class="dot"></span>'+esc(state)+'</div>'
    +'<p>'+esc(line)+'</p>'+act+'</aside>';
}
function fmtLeft(ms){

/* ---------- ประวัติการเปลี่ยนสถานะ ----------
   Kept in settings.caseStatusLog by js/69, which is the application's file — this page reads
   the same key out of the same localStorage and appends its own entries there, because a
   separate document cannot share js/69's code. The entry a page writes travels on the next
   settings push the application makes; until then it is correct on this device and absent
   elsewhere. The timestamps here are RECORDED, unlike the ones under the six circles, which
   are inferred from other fields (createdAt, the appointment, the last field log entry,
   updatedAt) and can therefore read out of order. */
var STATUS_LOG_CAP=12;
function statusLogAll(){
  var s=readJSON(K.settings,{})||{};
  var m=s.caseStatusLog;
  return (m&&typeof m==='object')?m:{};
}
function statusLogFor(caseId){
  var l=statusLogAll()[caseId];
  return Array.isArray(l)?l:[];
}
function noteStatusChange(caseId,from,to,why){
  try{
    var s=readJSON(K.settings,{})||{};
    if(!s.caseStatusLog||typeof s.caseStatusLog!=='object')s.caseStatusLog={};
    var list=Array.isArray(s.caseStatusLog[caseId])?s.caseStatusLog[caseId]:[];
    var u=readJSON(K.user,null);
    list.push({at:new Date().toISOString(),from:from||'',to:to||'',
      by:(u&&(u.name||u.id))||'',how:why?'auto':'manual',why:why||''});
    while(list.length>STATUS_LOG_CAP)list.shift();
    s.caseStatusLog[caseId]=list;
    localStorage.setItem(K.settings,JSON.stringify(s));
  }catch(e){}
}

/* Which step is open underneath the track. null = none. */
var openStep=null;
var stepSlideDir=0; /* 1 = next enters from right, -1 = previous enters from left */
