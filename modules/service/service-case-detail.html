   repaintProgress() redraws the block, so this is read while rendering rather than toggled
   on a live node. */
var openField=null;
var fieldSlideDir=0;

function renderProgress(m){
  var idx=stepIndex(m.case.status),closed=m.case.status==='ปิดเคส';
  var times=stepTimes(m);
  var canWork=fieldDone(m),ws=isWorkshopCase(m.raw);
  var lis=STEPS.map(function(s,i){
    var cls=i<idx?'done':i===idx?'now':'pending';
    var mark=i<idx?'✔':String(i+1);
    /* WHAT A CIRCLE DOES depends on where it sits.
         behind or on the current step  → open it and show what happened there
         exactly one step ahead         → move the case forward to it
         further ahead                  → nothing; you cannot skip stages
       The one gate: step 5 cannot be reached while the technician is still working, and
       clicking it then opens step 4's track instead of refusing silently. */
    var role = i<=idx ? 'open' : (i===idx+1 ? 'next' : 'far');
    /* แก้ไขทางออนไลน์: the case may be closed from wherever it is, by the people allowed to. */
    if(i===S('close')&&!closed&&onlineState(m.raw).on&&mayCloseOnline())role='online';
    var gate = role==='next' ? stepGate(m,idx) : '';
    var blocked = !!gate;
    var hint = role==='open' ? 'ดูรายละเอียดขั้นนี้'
             : blocked ? gate+' — กดเพื่อดูรายละเอียด'
             : role==='next' ? 'กดเพื่อไปขั้นนี้'
             : 'ต้องผ่านขั้นก่อนหน้าก่อน';

      +(role==='far'?' disabled':'')

      +(times[i]?'<small>'+esc(times[i])+'</small>':'')
      +(role==='next'?'<em class="scd-step-cue">'+(blocked?'🔒 '+(ws?'ยังไปต่อไม่ได้':'รอช่าง'):'กดเพื่อไปต่อ ›')+'</em>':'')
      +(role==='online'?'<em class="scd-step-cue">กดปิดเคส (ออนไลน์) ›</em>':'')
      +'</button></li>';
  }).join('');
  var subs='';
  /* 2026-10-29: a Workshop job has no technician field status, so its badge is the one to press:
     it opens กำลังให้บริการ, where the Workshop track (wsDrawerHTML) is. Press again to shut. */
  if(ws){

      +' title="'+(wsOpen?'กดเพื่อปิด':'กดเพื่อดูรายละเอียดงาน Workshop')+'">🏭 งาน Workshop'
      +(wsTrackNow(m.raw)?' · '+esc(wsTrackNow(m.raw)):'')+(wsOpen?' ▴':' ▾')+'</button>';
  }
  if(HOLD_STATES[m.case.status])subs+='<span class="badge badge-sub">'+esc(HOLD_STATES[m.case.status])+'</span>';
  if(m.case.subStatus){
    /* 2026-10-29: the field status is a button. Colour follows the status (FIELD_TONES); pressing it
       opens กำลังให้บริการ with that status's circle already open, pressing again shuts it. */
    var fk0=FIELD_STEPS.indexOf(m.case.subStatus);
    var fopen=openStep===S('service')&&fk0>=0&&openField===fk0;
    subs+='<button type="button" class="badge badge-prio badge-field ftone-'+fieldTone(m.case.subStatus)+'" data-fbadge="1"'
      +' aria-expanded="'+fopen+'" title="'+(fopen?'กดเพื่อปิด':'กดเพื่อดูรายละเอียดสถานะหน้างาน')+'">'
      +'หน้างาน: '+esc(m.case.subStatus)+(fopen?' ▴':' ▾')+'</button>';

    +'<ol class="scd-steps">'+lis+'</ol>'

    +(openStep==null?'':slideWrap('sdStepDrawer','scd-stepdrawer')
      +'<div class="scd-stepdrawer-in">'+stepDrawerHTML(m,openStep)+revertHTML(m,openStep)+'</div></div>')
    +(subs?'<div class="scd-substates">'+subs+'</div>':'')
    +statusLogHTML(m)
    +'<div class="scd-after"><span class="mark">★</span>'
    +(closed?'<button class="scd-mod" style="box-shadow:none;padding:6px 12px" type="button" data-action="open-feedback">ประเมินความพึงพอใจ</button>'
            :'ประเมินความพึงพอใจ (หลังปิดเคส)')

   The status written is the step's first one; the chat hears about it as a ↩️ line. */
function mayRevert(){return can('case.edit')||can('case.assign')}

  var idx=stepIndex(m.case.status);
  if(i==null||i>=idx||!mayRevert())return '';
  return '<div class="sd-revert"><button type="button" class="sd-go sd-back" data-revert-step="'+i+'">'

function revertTo(i){
  var m=caseDetailModel,c=m.case;
  if(!mayRevert()){toast('บัญชีนี้ไม่มีสิทธิ์ย้อนสถานะเคส');return}
  var idx=stepIndex(c.status);
  if(!(i>=0&&i<idx))return;
  var next=STEPS[i].statuses[0];
  /* มอบหมาย / นัดหมาย: a case that still has its date goes back to นัดหมายแล้ว, not มอบหมายแล้ว */
  if(i===S('assign')&&m.appointment&&m.appointment.date)next='นัดหมายแล้ว';
  scdAsk({
    title:'ย้อนสถานะเคส',
    message:'เคส '+(c.caseNo||c.id)+'\nจาก “'+(c.status||'-')+'” กลับไปเป็น “'+next+'”\nทีมจะเห็นการย้อนสถานะนี้ในแชทของเคส',

    applyStatusNow(next);
  });

/* ---------- ใบเสนอราคาของเคสนี้ (2026-09-17) ----------
   Drawn inside step 2. The quotation's own track, fed from three places (see js/80's header):
   quoteApprovals (signed / sent back), quotation.status 'อนุมัติ' (confirmed), and
   settings.quoteDocs (the full paper, rendered by the application — this page cannot run
   quotationDocHTML). Step 3 is not locked behind it; the owner's decision. */
var QT_DONE='อนุมัติ';
var QT_STEPS=['ส่งให้ลูกค้าแล้ว','รอลูกค้าเซ็น','ลูกค้าส่งกลับมา','เสร็จสิ้น'];
function caseQuote(){
  var id=caseDetailModel.case.id;
  var list=(readJSON(K.quotes,[])||[]).filter(function(q){return q&&q.caseId===id})
    .sort(function(a,b){return new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0)});
  return list[0]||null;
}
function quoteFacts(q){
  var s=readJSON(K.settings,{})||{};
  var a=(s.quoteApprovals||{})[q.id]||null;
  var doc=(s.quoteDocs||{})[q.id]||null;
  var created=Date.parse(q.createdAt||''),signed=Date.parse(a&&a.at||''),baked=Date.parse(doc&&doc.at||'');
  if(a&&Number.isFinite(created)&&Number.isFinite(signed)&&signed<created)a=null;
  if(doc&&Number.isFinite(created)&&Number.isFinite(baked)&&baked<created)doc=null;
  var list=Array.isArray(s.quotationStatuses)?s.quotationStatuses:[];
  var draft=String(q.status||'ร่าง')===(list[0]||'ร่าง');
  /* 0 not sent · 1 waiting for the signature · 2 signed, not sent back · 3 sent back · 4 done */
  var state=draft?0:String(q.status)===QT_DONE?4:(a&&a.sentAt)?3:a?2:1;
  /* 2026-09-25: the customer's first open of the quotation (js/120, settings.quoteViews). Until
     then the track waits on step 1; from then on step 2 reads ลูกค้ากำลังเซ็น. */
  var v=(s.quoteViews||{})[q.id]||null,viewed=Date.parse(v&&v.at||'');
  if(v&&Number.isFinite(created)&&Number.isFinite(viewed)&&viewed<created)v=null;
  return {approval:a,doc:doc,state:state,opened:v&&v.at||''};
}
function quoteSectionHTML(){
  var q=caseQuote();
  var head='<div class="sd-qt"><div class="sd-qt-head"><b>📄 ใบเสนอราคาของเคสนี้</b>';
  if(!q){
    return head+'</div><p class="sd-empty">เคสนี้ยังไม่มีใบเสนอราคา</p>'
      +'<div class="sd-acts"><button type="button" class="sd-go" data-action="open-quotation">ทำใบเสนอราคา ›</button></div></div>';
  }
  var f=quoteFacts(q),a=f.approval;
  head+='<span>'+esc(q.id)+' · '+esc(Number(q.grand||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}))+' บาท</span></div>';
  if(f.state===0){
    return head+'<p class="sd-wait">ใบเสนอราคายังเป็นร่าง — ยังไม่ได้ส่งให้ลูกค้า</p>'
      +'<div class="sd-acts"><button type="button" class="sd-go" data-action="open-quotation">เปิดใบเสนอราคาในระบบหลัก ›</button></div></div>';
  }
  var when=[q.updatedAt||q.createdAt,a&&a.at,a&&a.sentAt,f.state===4?(q.updatedAt||''):''];
  /* A step is done once the state has passed it; the step the quotation is waiting at is `now`. */
  var doneUpTo=[1,2,3,4];
  var dots=QT_STEPS.map(function(label,k){
    var done=f.state>=doneUpTo[k]&&!(k===1&&f.state===1);

/* 2026-09-21 — ONE BUTTON FOR BOTH PADS, on top of the two per-role buttons.
   saveStaffSign(key) is now saveStaffSigns([key]): one function saves any number of roles in
   ONE pass, which is not only tidier but safer. Two separate saves meant two separate
   read-modify-writes of the settings row, and the second could read it before the first had
   landed and push the first back out — the same shape of race that lost the signatures in the
   first place. Saving both together is a single read and a single write.

   An empty block is skipped when the combined button is pressed (somebody may genuinely only
   be signing one) but complained about when its own button is pressed, because pressing that
   button is a statement about that block. A half-filled block — a name with no signature, or
   a signature with no name — always stops the save, whichever button was pressed. */
function saveStaffSign(key){return saveStaffSigns([key])}
function saveStaffSigns(keys){
  var q=caseQuote();
  if(!q)return;
  if(!can('quotation.create')){toast('บัญชีนี้ไม่มีสิทธิ์เซ็นใบเสนอราคา');return}
  var lenient=keys.length>1,jobs=[],stop=false;
  keys.forEach(function(key){
    if(stop)return;
    var r=QS_ROLES.filter(function(x){return x.key===key})[0];
    if(!r)return;
    var nameEl=el('qsName_'+key),pad=el('qsPad_'+key);
    var name=nameEl?nameEl.value.trim():'';
    var inked=!!(pad&&qsHasInk(pad));
    if(!name&&!inked&&lenient)return;              /* this role is simply not being signed */
    if(!name){
      stop=true;toast('กรุณาพิมพ์ชื่อ'+r.th);
      if(nameEl){nameEl.focus();nameEl.classList.add('is-missing');
        setTimeout(function(){nameEl.classList.remove('is-missing')},1800)}
      return;
    }
    if(!inked){stop=true;toast('กรุณาเซ็นชื่อ'+r.th+'ในกรอบก่อนบันทึก');return}
    jobs.push({r:r,name:name,sig:qsShrink(pad)});
  });
  if(stop)return;
  if(!jobs.length){toast('ยังไม่มีลายเซ็นให้บันทึก — กรุณาเซ็นชื่อในกรอบก่อน');return}

  var now=new Date().toISOString(),day=now.slice(0,10);
  var what='ลายเซ็น'+jobs.map(function(j){return j.r.th}).join(' และ ');
  /* 1. name and date: the quotation's own columns */
  var list=readJSON(K.quotes,[])||[];
  list.forEach(function(x){
    if(!x||x.id!==q.id)return;
    jobs.forEach(function(j){x[j.r.nameKey]=j.name;x[j.r.dateKey]=day});
    x.updatedAt=now;
  });
  /* 2. the images: settings, beside quoteApprovals */
  var s=readJSON(K.settings,{})||{};
  s.quoteStaffSigns=s.quoteStaffSigns||{};
  s.quoteStaffSigns[q.id]=s.quoteStaffSigns[q.id]||{};
  jobs.forEach(function(j){
    j.rec={name:j.name,sig:j.sig,at:now};
    s.quoteStaffSigns[q.id][j.r.key]=j.rec;
  });
  try{
    localStorage.setItem(K.quotes,JSON.stringify(list));
    localStorage.setItem(K.settings,JSON.stringify(s));
  }catch(e){toast('บันทึกไม่สำเร็จ — พื้นที่ในเครื่องเต็ม');return}
  try{CaseDetailData.refresh()}catch(e){}
  var finish=function(cloud){
    var snap=qsCapture();          /* taken now, not earlier: the other pad may have been
                                      drawn in while the cloud round trip was in flight */
    openQuoteDoc();
    qsRestore(snap);
    toast(cloud?('บันทึก'+what+'แล้ว')
               :('บันทึก'+what+'แล้ว · ยังอยู่เฉพาะเครื่องนี้ ยังไม่ได้ส่งขึ้นระบบกลาง'));
  };
  var sb=CaseWrite.client();
  if(!sb){finish(false);return}
  var row={updated_at:now};
  jobs.forEach(function(j){row[j.r.col]=j.name;row[j.r.dateCol]=day});
  /* The settings row is read fresh and only this one key is merged in, so this page never
     writes back a stale copy of everything else in settings. */
  Promise.all([
    Promise.resolve(sb.from('quotations').update(row).eq('id',q.id)),
    Promise.resolve(sb.from('system_settings').select('data').eq('id','main').maybeSingle()).then(function(res){
      if(!res||res.error||!res.data||!res.data.data)return {error:res&&res.error||'no-row'};
      var data=res.data.data;
      data.quoteStaffSigns=data.quoteStaffSigns||{};
      data.quoteStaffSigns[q.id]=data.quoteStaffSigns[q.id]||{};
      jobs.forEach(function(j){data.quoteStaffSigns[q.id][j.r.key]=j.rec});
      return sb.from('system_settings').update({data:data,updated_at:now}).eq('id','main');
    })
  ]).then(function(rs){finish(!rs.some(function(x){return x&&x.error}))},function(){finish(false)});
}

/* Only the timestamps the case really has are shown under a step. */
function stepTimes(m){
  var out=[];
  out[S('intake')]=m.case.createdAt?fmtDateTime(m.case.createdAt):'';
  /* One circle, so the appointment is what it shows once there is one — that is the later
     of the two facts and the one people are waiting on; the assignment time is in the drawer. */
  out[S('assign')]=m.appointment.date?fmtDateTime(m.appointment.date)
    :(m.assignment.technician?fmtDateTime(m.assignment.assignedAt):'');
  var log=(m.activity||[]).filter(function(a){return a.type==='field_status'});
  out[S('service')]=log.length?fmtDateTime(log[log.length-1].timestamp):'';
  out[S('done')]=m.closing.serviceReportReady?'มีใบตรวจแล้ว':'';
  out[S('close')]=m.case.status==='ปิดเคส'?fmtDateTime(m.case.updatedAt):'';
  return out;
}

/* A tile per attachment, addressed by its index in caseDetailModel.attachments — a data

   index travels and the lightbox reads the array. */

  return items.map(function(x){
    var body=(x.a.type==='image'&&x.a.data)
      ? '<img src="'+esc(x.a.data)+'" alt="'+esc(x.a.name||'')+'" loading="lazy">'
      : '<span>'+(x.a.type==='video'?'&#9654;':x.a.type==='audio'?'&#127925;':'&#128196;')+'</span>'
        +(x.a.type==='file'?'<small class="cmp-tile-name">'+esc(x.a.name||'PDF')+'</small>':'');
    return '<button type="button" class="cmp-tile'+(x.a.type==='video'?' is-video':'')+(x.a.from==='staff'?' is-staff':'')+'"'
      +' data-media="'+x.i+'" title="'+esc((x.a.name||'')+(x.a.by?' · เพิ่มโดย '+x.a.by:''))+'"'
      +' aria-label="เปิดไฟล์แนบ '+(x.i+1)+'">'+body+'</button>';
  }).join('');
}
function mediaBlock(label,items){

/* What the server holds that this device may not: photos js/72 trimmed to stubs, and ใบตรวจ the
   technician app wrote after this device's last sync. Asked once per case per page load, kept
   here, and merged into every render — load() rebuilds the model from storage every few seconds,
   so a one-off patch of the model would be gone on the next refresh. The stored copy is untouched. */
var fromServer={};   /* caseId -> {media:[...]|null, reports:[...]|null} */
function mergeFromServer(m){
  var id=m&&m.case&&m.case.id,got=id&&fromServer[id];
  if(!got)return;
  if(got.media)got.media.forEach(function(x,i){
    var a=m.attachments[i];
    if(a&&x&&x.data&&!a.data&&String(a.name||'')===String(x.name||''))a.data=x.data;
  });
  if(got.reports&&got.reports.length){
    var have={};
    (m.reports||[]).forEach(function(r){if(r&&r.id)have[r.id]=r});
    got.reports.forEach(function(r){
      var mine=have[r.id];
      if(!mine||String(r.updatedAt||'')>String(mine.updatedAt||''))have[r.id]=r;
    });
    var rs=Object.keys(have).map(function(k){return have[k]})
      .sort(function(a,b){return String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))});
    m.reports=rs;
    if(m.service)m.service.reportStatus='ready';
    if(m.closing){
      m.closing.serviceReportReady=true;
      m.closing.customerSignature=rs.some(function(x){return !!x.customerSignature});
      m.closing.technicianSignature=rs.some(function(x){return !!x.techSignature});
    }
  }
}
function askServer(m){
  var id=m&&m.case&&m.case.id;
  if(!id||m.isMock||fromServer[id])return;
  fromServer[id]={media:null,reports:null};
  var needMedia=m.attachments.some(function(a){return a.type==='image'&&!a.data});
  Promise.all([
    needMedia?CaseWrite.fetchMedia(id):Promise.resolve(null),
    CaseWrite.fetchReports(id)
  ]).then(function(r){
    fromServer[id]={media:r[0],reports:r[1]};
    if(!caseDetailModel||caseDetailModel.case.id!==id)return;
    var before=JSON.stringify([(caseDetailModel.reports||[]).length,
      caseDetailModel.attachments.filter(function(a){return !!a.data}).length]);
    mergeFromServer(caseDetailModel);
    var after=JSON.stringify([(caseDetailModel.reports||[]).length,
      caseDetailModel.attachments.filter(function(a){return !!a.data}).length]);
    if(before!==after)renderPage(caseDetailModel);
  });
}

   on this form: the step circles and the นัดหมาย button own those. */
/* ---------- แก้ไขทางออนไลน์ (2026-09-17) ----------
   "ขั้นตอนแรกคือติดต่อหาลูกค้า เราจะให้ลูกค้าเช็คตอนนั้นแหละ ถ้าหายก็ไปแก้ในลงรายละเอียดงาน
   เพิ่มเติมและติ๊ก online ทีนี้เราจะสามารถกดปิดเคสได้เลย แต่ต้องกดเอง". Decided with the owner:
   ticking requires a note of what the customer was told, with optional photo / video / audio;
   unticking puts ประเภทงาน back to what the customer chose; only admin and team leads close.

   WHERE IT LIVES: an entry in the case's own fieldStatusLog — {online:true|false, status, note,
   media, prevServiceType, createdAt, by}. field_status_log is a real jsonb column, so the
   state, the note and the files travel with the case row; nothing new in settings, no SQL.
   The newest entry that carries `online` is the current state. The technician's field track
   is unaffected: it matches only its own nine status words. */
var ONLINE_TYPE='แก้ไขออนไลน์';
var ONLINE_FILE_MAX=2.5*1024*1024;      /* after an image is shrunk; a clip or recording as-is */
var ONLINE_FILE_COUNT=4;
var CUSTOMER_TYPE_MAP={Service:'เข้าบริการหน้างาน',Maintenance:'เข้าบริการหน้างาน',
  PM:'PM / Preventive Maintenance',Online:ONLINE_TYPE,Workshop:'ลูกค้าส่งเครื่องเข้าบริษัท'};
var onlinePending=[];
function onlineState(raw){
  var log=(raw&&raw.fieldStatusLog)||[],last=null;
  for(var i=0;i<log.length;i++){if(log[i]&&typeof log[i].online==='boolean')last=log[i]}
  return {on:!!(last&&last.online),entry:last};
}
/* What the customer chose on the portal form (js/79 writes it into the note), else the type
   the case had when the box was ticked. */
function customerServiceType(raw,entry){
  var m=/ลูกค้าเลือกประเภทเคส:\s*(Service|Maintenance|PM|Online|Workshop)/.exec(String(raw&&raw.note||''));
  if(m&&CUSTOMER_TYPE_MAP[m[1]])return CUSTOMER_TYPE_MAP[m[1]];
  if(entry&&entry.prevServiceType)return entry.prevServiceType;
  return 'เข้าบริการหน้างาน';
}
function onlineSectionHTML(raw,pair){

function shrinkImageFile(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var k=Math.min(1,1280/Math.max(img.width,img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('image'))};
    img.src=url;
  });
}
function readFileData(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){resolve(String(r.result||''))};
    r.onerror=function(){reject(r.error)};
    r.readAsDataURL(file);
  });
}

      var job=/^image\//.test(t)?shrinkImageFile(file).then(function(d){return {data:d,type:'image/jpeg'}})
                               :readFileData(file).then(function(d){return {data:d,type:t}});
      return job.then(function(o){

        if(size>ONLINE_FILE_MAX){toast(file.name+' ใหญ่เกิน 2.5 MB');return}

   The machine comes to the company; usually R&D does the work. See js/81 for the decisions.
   Everything below is kept in the case's own fieldStatusLog (a real jsonb column that travels
   with the case) as entries tagged `workshop`:
     logistics  {inbound:'send'|'pickup', outbound:'self'|'deliver'}   the customer's choice
     received   {receivedDate, note (condition), accessories, media}  machine is on our bench
     status     {label}                                               R&D progress
     returned   {returnDate, method, receiver, sig}                   handed back
   Each entry also carries a readable `status`, so the customer's own case view (js/53) shows
   the machine's progress without knowing anything about Workshop.
   The six circles keep the case statuses they already had; only the labels, the drawers and
   the gates differ:
     3 รับเครื่องเข้าบริษัท (นัดหมายแล้ว)   needs a `received` entry
     4 R&D ตรวจ / ซ่อม     (กำลังดำเนินการ) leaves for 5 once the track reaches พร้อมส่งคืน
     5 QC / ส่งคืน         (เสร็จสิ้น)      QC must pass before the hand-back is recorded

/* ---------- หมวดหมู่งาน · ประเภทงาน (2026-09-18) ----------

   is restated here exactly as WS_TYPE, ONLINE_TYPE and CUSTOMER_TYPE_MAP already are. Keep the
   two in step: js/82 is the reference copy.

     service_type      carries the CATEGORY, as one of the five strings the system already
                       stores, so isWorkshopCase() and the online section keep working unchanged

var CC_FIELD='field',CC_WORKSHOP='workshop',CC_ONLINE='online';

var CC_CATS=[
  {v:CC_FIELD,label:'Field Service',th:'Field Service · ช่างไปหน้างานลูกค้า',works:['Service','Maintenance','PM',CC_INSTALL]},
  {v:CC_WORKSHOP,label:'Workshop',th:'Workshop · ลูกค้าส่งเครื่องเข้าบริษัท',works:['Service','Maintenance','PM']},

/* The two visible selects write into #ceType, which is KEPT (hidden, with its id and its full

var WS_LABELS={};
/* 2026-10-21 (ข้อ 10): the circles keep their names for every case. The owner: "ถ้าลูกค้าเลือก
   service หน้างาน ขั้น 3 จะแสดงของหน้างาน แต่ถ้าลูกค้าเลือกส่งเครื่องมา ขั้นที่ 3 จะเป็น Flow ของส่งมา
   ที่บริษัท" — so มอบหมาย / นัดหมาย is the same for both, and the Workshop work (receive the
   machine, the bench track) lives inside ขั้น 3 กำลังให้บริการ. ขั้น 4 keeps QC / ส่งคืน. */
var wsPending=[];
function isWorkshopCase(raw){return !!raw&&String(raw.serviceType||'')===WS_TYPE}
function wsLast(raw,kind){
  var log=(raw&&raw.fieldStatusLog)||[],last=null;
  for(var i=0;i<log.length;i++)if(log[i]&&log[i].workshop===kind)last=log[i];
  return last;
}
function wsTrackNow(raw){var e=wsLast(raw,'status');return e?e.label:''}
function wsInboundText(v){return v==='pickup'?'ให้บริษัทไปรับเครื่อง (คิดค่ารับตามระยะทาง)':v==='send'?'ลูกค้าส่งเครื่องมาเอง':'ยังไม่ได้เลือก'}
function wsOutboundText(v){return v==='deliver'?'ให้บริษัทไปส่งคืน (คิดค่าส่งตามระยะทาง)':v==='self'?'ลูกค้ามารับเครื่องคืนเอง':'ยังไม่ได้เลือก'}
function stepLabel(m,i){return (isWorkshopCase(m&&m.raw)&&WS_LABELS[i])||STEPS[i].th}
/* QC is its own module; the record is linked to the case by caseId (js/04 openQcModal). */
function wsQcPass(caseId){
  var list=readJSON('imode_v66_qc_records',[])||[];
  return list.filter(function(q){
    return q&&q.caseId===caseId&&q.type==='Pre-Delivery QC'&&['Pass','Conditional'].indexOf(q.status)>=0;
  }).sort(function(a,b){return new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0)})[0]||null;
}
function wsQcAny(caseId){
  var list=readJSON('imode_v66_qc_records',[])||[];
  return list.filter(function(q){return q&&q.caseId===caseId&&q.type==='Pre-Delivery QC'})[0]||null;
}
function wsWho(){var u=readJSON(K.user,null);return (u&&(u.name||u.username))||''}
function wsMayWork(){return can('field.status')||can('case.assign')}
/* Append one entry and optionally move the case status; re-render and keep the drawer open. */
function wsWrite(entry,status,keepStep,message){
  var c=caseDetailModel.case,raw=caseDetailModel.raw||{};
  var log=(raw.fieldStatusLog||[]).slice();
  entry.id=entry.id||('WS-'+Date.now().toString(36));
  entry.createdAt=entry.createdAt||new Date().toISOString();
  entry.by=entry.by||wsWho();
  entry.note=entry.note||'';
  entry.media=entry.media||[];
  log.push(entry);
  var changes={fieldStatusLog:log};
  if(status&&status!==c.status)changes.status=status;
  toast('กำลังบันทึก…');
  return CaseWrite.patch(c.id,changes,'Workshop').then(function(r){
    if(!r||!r.ok){toast(r&&r.reason==='storage'?'บันทึกไม่สำเร็จ — พื้นที่ในเครื่องเต็ม':'บันทึกไม่สำเร็จ');return false}
    if(entry.status)chatNote(c.id,'🏭 '+entry.status+(entry.workshop==='received'&&entry.note?' · สภาพเครื่อง: '+entry.note:''));
    closePanel();
    openStep=keepStep;
    try{CaseDetailData.refresh()}catch(e){}
    return load().then(function(res){
      if(res&&!res.error)renderPage(res);
      toast(r.cloud?message:(message+' · ยังอยู่เฉพาะเครื่องนี้ ยังไม่ได้ส่งขึ้นระบบกลาง'));
      return true;
    });
  });
}
function wsDrawerHTML(m,i,head){
  var raw=m.raw||{},c=m.case,l=wsLast(raw,'logistics')||{};
  var may=wsMayWork();
  if(i===S('service')){
    var rc=wsLast(raw,'received');
    var receive='<h5 class="ws-sub">① รับเครื่องเข้าบริษัท</h5>'
      +'<dl class="sd-kv"><dt>นำเครื่องเข้า</dt><dd>'+esc(wsInboundText(l.inbound))+'</dd>'
      +'<dt>รับเครื่องคืน</dt><dd>'+esc(wsOutboundText(l.outbound))+'</dd>'
      +(m.appointment.date?'<dt>นัดรับเครื่อง</dt><dd>'+esc(fmtDateTime(m.appointment.date))+'</dd>':'')
      +(rc?'<dt>รับเครื่องเมื่อ</dt><dd>'+esc(fmtDay(rc.receivedDate)||fmtDateTime(rc.createdAt))+(rc.by?' · '+esc(rc.by):'')+'</dd>'
          +'<dt>สภาพเครื่อง</dt><dd>'+esc(rc.note||'-')+'</dd>'
          +'<dt>อุปกรณ์ที่มากับเครื่อง</dt><dd>'+esc(rc.accessories||'-')+'</dd>'
          +(rc.media&&rc.media.length?'<dt>รูปตอนรับ</dt><dd>'+rc.media.length+' ไฟล์ (ดูใน เอกสาร &amp; รูปภาพ)</dd>':''):'')
      +'</dl>'
      +(rc?'<p class="sd-ok">✔ รับเครื่องเข้าบริษัทแล้ว</p>':'<p class="sd-wait">⏳ ยังไม่ได้บันทึกรับเครื่องเข้า — บันทึกก่อนจึงเริ่มตรวจ / ซ่อมได้</p>')
      +(may?'<div class="sd-acts"><button type="button" class="sd-go'+(rc?'':' is-primary')+'" data-action="ws-receive">'+(rc?'แก้ไขบันทึกรับเครื่อง ›':'บันทึกรับเครื่องเข้า ›')+'</button></div>':'');
    var now=wsTrackNow(raw),at={};
    ((raw.fieldStatusLog)||[]).forEach(function(e){if(e&&e.workshop==='status')at[e.label]=e.createdAt});
    var nowIdx=WS_TRACK.indexOf(now);
    var dots=WS_TRACK.map(function(label,k){
      var done=nowIdx>=0&&k<=nowIdx&&label!=='รออะไหล่'||label===now;
      return '<li class="'+(done?'done':'pending')+(label===now?' now':'')+'">'
        +'<span class="fdot">'+(done?'✔':String(k+1))+'</span><b>'+esc(label)+'</b>'
        +(at[label]?'<small>'+esc(fmtDateTime(at[label]))+'</small>':'')+'</li>';
    }).join('');
    var bench='<h5 class="ws-sub">② ช่างตรวจ / ซ่อมในบริษัท</h5>'
      +'<ol class="sd-field">'+dots+'</ol>'
      +(now==='พร้อมส่งคืน'?'<p class="sd-ok">✔ พร้อมส่งคืน — กดวงกลมขั้นที่ '+stepNo('done')+' เพื่อไปทำ QC และส่งคืน</p>'
        :'<p class="sd-wait">⏳ '+(now?'ตอนนี้: '+esc(now):'ยังไม่ได้เริ่มงาน')+' — ไปขั้นที่ '+stepNo('done')+' ได้เมื่อถึง “พร้อมส่งคืน”</p>')
      +(may&&rc?'<div class="sd-acts ws-set">'+WS_TRACK.map(function(label){
          return '<button type="button" class="sd-go'+(label===now?' is-primary':'')+'" data-ws-status="'+esc(label)+'">'+esc(label)+'</button>';
        }).join('')+'</div>':'');
    return head(stepNo('service')+'. กำลังให้บริการ','งาน Workshop · ลูกค้าส่งเครื่องเข้าบริษัท — เริ่มได้ก่อนลูกค้าเซ็นใบเสนอราคา')
      +receive+bench;
  }
  if(i===S('done')){
    var qc=wsQcPass(c.id),anyQc=wsQcAny(c.id),rt=wsLast(raw,'returned');
    return head(stepNo('done')+'. งานเสร็จ / ตรวจรับ','งาน Workshop · QC และส่งคืนเครื่อง — ต้องผ่าน QC ก่อนส่งคืนทุกครั้ง')
      +'<dl class="sd-kv"><dt>QC ก่อนส่งคืน</dt><dd>'
      +(qc?'✔ '+esc(qc.status)+' · '+esc(qc.qcNo||qc.id)
         :anyQc?'✕ ยังไม่ผ่าน ('+esc(anyQc.status||'-')+')':'ยังไม่ได้ทำ QC')+'</dd>'
      +'<dt>รับเครื่องคืน</dt><dd>'+esc(wsOutboundText(l.outbound))+'</dd>'
      +(rt?'<dt>ส่งคืนเมื่อ</dt><dd>'+esc(fmtDay(rt.returnDate)||fmtDateTime(rt.createdAt))+'</dd>'
          +'<dt>ผู้รับเครื่อง</dt><dd>'+esc(rt.receiver||'-')+'</dd>':'')
      +'</dl>'
      +(rt&&rt.sig?'<img class="ws-sig" src="'+esc(rt.sig)+'" alt="ลายเซ็นผู้รับเครื่อง">':'')
      +(rt?'<p class="sd-ok">✔ ส่งคืนเครื่องแล้ว — กดวงกลมขั้นที่ 6 เพื่อปิดเคส</p>'
          :qc?'<p class="sd-wait">QC ผ่านแล้ว — บันทึกการส่งคืนเครื่องได้เลย</p>'
          :'<p class="sd-wait">🔒 ต้องทำ QC ก่อนส่งคืน (Pre-Delivery QC) ให้ผ่านก่อน</p>')
      +'<div class="sd-acts">'
      +(qc?'':'<button type="button" class="sd-go is-primary" data-action="ws-qc">ทำ QC ก่อนส่งคืน ›</button>')
      +(may&&qc&&!rt?'<button type="button" class="sd-go is-primary" data-action="ws-return">บันทึกส่งคืนเครื่อง ›</button>':'')
      +'<button type="button" class="sd-go" data-action="open-case-attachments">เอกสาร &amp; รูปภาพ ›</button>'
      +'</div>';
  }
  return '';
}
/* ---- receiving the machine ---- */
function wsReceive(){
  if(!wsMayWork()){toast('บัญชีนี้ไม่มีสิทธิ์บันทึกงาน Workshop');return}
  var rc=wsLast(caseDetailModel.raw,'received')||{};
  wsPending=[];
  panel('บันทึกรับเครื่องเข้าบริษัท',
    '<form id="wsReceiveForm" class="scd-ce" novalidate>'
    +'<label class="scd-ce-f"><span>วันที่รับเครื่อง <b>*</b></span><input type="date" id="wsRecvDate" value="'+esc(rc.receivedDate||todayISO())+'"></label>'
    +'<label class="scd-ce-f"><span>สภาพเครื่องตอนรับ <b>*</b></span><textarea id="wsRecvNote" rows="3" placeholder="เช่น ฝาครอบมีรอยขีดข่วนด้านซ้าย เปิดเครื่องไม่ติด">'+esc(rc.note||'')+'</textarea></label>'
    +'<label class="scd-ce-f"><span>อุปกรณ์ที่มากับเครื่อง</span><input id="wsRecvAcc" placeholder="เช่น สายไฟ 1 เส้น, รีโมท, คู่มือ" value="'+esc(rc.accessories||'')+'"></label>'
    +'<div class="scd-ol-files"><label class="scd-chip-btn scd-ol-add">📷 แนบรูปเครื่องตอนรับ'
    +'<input type="file" id="wsRecvFiles" accept="image/*,video/*" multiple hidden></label><small>ถ่ายไว้เป็นหลักฐานสภาพเครื่อง</small></div>'
    +'<ul class="scd-ol-list" id="wsRecvList"></ul>'
    +'<div class="scd-ce-actions"><button type="button" class="scd-chip-btn" data-action="close-panel">ยกเลิก</button>'
    +'<button type="submit" class="scd-ce-save">บันทึกรับเครื่อง</button></div></form>');
  var inp=el('wsRecvFiles');
  if(inp)inp.addEventListener('change',function(){wsAddFiles(inp.files);inp.value=''});
  var ul=el('wsRecvList');
  if(ul)ul.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-ws-rm]');
    if(!b)return;wsPending.splice(Number(b.getAttribute('data-ws-rm')),1);wsRedraw();
  });
  el('wsReceiveForm').addEventListener('submit',function(e){
    e.preventDefault();
    var note=el('wsRecvNote').value.trim(),day=el('wsRecvDate').value;
    if(!day||!note){toast(!day?'กรุณาระบุวันที่รับเครื่อง':'กรุณาบันทึกสภาพเครื่องตอนรับ');var f=el(!day?'wsRecvDate':'wsRecvNote');if(f)f.focus();return}
    var idx=stepIndex(caseDetailModel.case.status);
    wsWrite({workshop:'received',status:'Workshop · รับเครื่องเข้าบริษัทแล้ว',receivedDate:day,note:note,
      accessories:el('wsRecvAcc').value.trim(),
      media:wsPending.map(function(f){return {name:f.name,type:f.type,size:f.size,data:f.data}})},
      idx<S('service')&&hasCrew(caseDetailModel)?'กำลังดำเนินการ':'',S('service'),'บันทึกรับเครื่องเข้าบริษัทแล้ว');
  });
}
function wsRedraw(){
  var ul=el('wsRecvList');
  if(ul)ul.innerHTML=wsPending.map(function(f,i){
    return '<li>'+onlineFileIcon(f.type)+' '+esc(f.name)+' <small>'+Math.max(1,Math.round(f.size/1024))+' KB</small>'
      +'<button type="button" class="scd-ol-rm" data-ws-rm="'+i+'" aria-label="เอาไฟล์นี้ออก">✕</button></li>';
  }).join('');
}
function wsAddFiles(list){
  [].slice.call(list||[]).reduce(function(p,file){
    return p.then(function(){
      if(wsPending.length>=ONLINE_FILE_COUNT){toast('แนบได้สูงสุด '+ONLINE_FILE_COUNT+' ไฟล์');return}
      var t=String(file.type||'');
      if(!/^(image|video)\//.test(t)){toast(file.name+' — แนบได้เฉพาะรูปหรือวิดีโอ');return}
      var job=/^image\//.test(t)?shrinkImageFile(file).then(function(d){return {data:d,type:'image/jpeg'}})
                               :readFileData(file).then(function(d){return {data:d,type:t}});
      return job.then(function(o){
        var size=Math.round((o.data.length-o.data.indexOf(',')-1)*0.75);
        if(size>ONLINE_FILE_MAX){toast(file.name+' ใหญ่เกิน 2.5 MB');return}
        wsPending.push({name:file.name,type:o.type,size:size,data:o.data});
      },function(){toast('อ่านไฟล์ '+file.name+' ไม่ได้')});
    });
  },Promise.resolve()).then(wsRedraw);
}
/* ---- the R&D track ---- */
function wsSetStatus(label){
  if(!wsMayWork()){toast('บัญชีนี้ไม่มีสิทธิ์อัปเดตสถานะงาน');return}
  var raw=caseDetailModel.raw||{},c=caseDetailModel.case;
  if(!wsLast(raw,'received')){toast('ยังไม่ได้บันทึกรับเครื่องเข้าบริษัท — บันทึกที่ขั้นที่ '+stepNo('service')+' ก่อน');openStep=S('service');repaintProgress();return}
  if(wsTrackNow(raw)===label){toast('สถานะเป็น “'+label+'” อยู่แล้ว');return}
  var idx=stepIndex(c.status),next='';
  /* The case follows the bench: waiting for parts is the case's own hold state, anything else
     is work in progress. A case already past that step is left where it is. */
  if(idx<=S('service'))next=label==='รออะไหล่'?'รออะไหล่':'กำลังดำเนินการ';
  wsWrite({workshop:'status',label:label,status:'Workshop · '+label},next,S('service'),'อัปเดตสถานะเป็น “'+label+'” แล้ว');
}
/* ---- QC, in the application's own QC module ---- */
function wsQc(){
  goApp('qc','&caseId='+encodeURIComponent(caseDetailModel.case.id)+'&intent=qc-predelivery');
}
/* ---- handing the machine back ---- */
function wsReturn(){
  if(!wsMayWork()){toast('บัญชีนี้ไม่มีสิทธิ์บันทึกการส่งคืน');return}
  var c=caseDetailModel.case,raw=caseDetailModel.raw||{};
  if(!wsQcPass(c.id)){toast('ต้องทำ QC ก่อนส่งคืนให้ผ่านก่อน');return}
  var l=wsLast(raw,'logistics')||{};
  panel('บันทึกส่งคืนเครื่อง',
    '<form id="wsReturnForm" class="scd-ce" novalidate>'
    +'<label class="scd-ce-f"><span>วันที่ส่งคืน <b>*</b></span><input type="date" id="wsRetDate" value="'+todayISO()+'"></label>'
    +'<div class="scd-ce-f"><span>วิธีส่งคืน</span><div class="ws-radio">'
    +'<label><input type="radio" name="wsRetMethod" value="self"'+(l.outbound!=='deliver'?' checked':'')+'> ลูกค้ามารับเอง (ไม่มีค่าส่ง)</label>'
    +'<label><input type="radio" name="wsRetMethod" value="deliver"'+(l.outbound==='deliver'?' checked':'')+'> บริษัทไปส่ง (คิดค่าส่งตามระยะทาง)</label></div></div>'
    +'<label class="scd-ce-f"><span>ชื่อผู้รับเครื่อง <b>*</b></span><input id="wsRetName" placeholder="ชื่อ-นามสกุล"></label>'
    +'<div class="scd-ce-f"><span>ลายเซ็นผู้รับเครื่อง <b>*</b></span><div class="qs-pad"><canvas id="wsRetPad" width="560" height="180" aria-label="ช่องเซ็นรับเครื่อง"></canvas></div></div>'
    +'<div class="qs-acts"><button type="button" class="scd-chip-btn" data-ws-clear="1">ล้างลายเซ็น</button></div>'
    +'<div class="scd-ce-actions"><button type="button" class="scd-chip-btn" data-action="close-panel">ยกเลิก</button>'
    +'<button type="submit" class="scd-ce-save">บันทึกส่งคืน</button></div></form>');
  qsInitPad('wsRetPad');
  el('wsReturnForm').addEventListener('click',function(e){
    if(!(e.target.closest&&e.target.closest('[data-ws-clear]')))return;
    var cv=el('wsRetPad');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv.dataset.ink='';
  });
  el('wsReturnForm').addEventListener('submit',function(e){
    e.preventDefault();
    var day=el('wsRetDate').value,name=el('wsRetName').value.trim(),pad=el('wsRetPad');
    if(!day){toast('กรุณาระบุวันที่ส่งคืน');return}
    if(!name){toast('กรุณาพิมพ์ชื่อผู้รับเครื่อง');el('wsRetName').focus();return}
    if(!qsHasInk(pad)){toast('กรุณาให้ผู้รับเครื่องเซ็นชื่อ');return}
    var m=document.querySelector('input[name="wsRetMethod"]:checked');
    var method=m?m.value:'self';
    wsWrite({workshop:'returned',status:'Workshop · ส่งคืนเครื่องแล้ว',returnDate:day,method:method,
      receiver:name,sig:qsShrink(pad),note:method==='deliver'?'บริษัทไปส่งคืน':'ลูกค้ามารับเครื่องคืน'},
      '',S('done'),'บันทึกส่งคืนเครื่องแล้ว');
  });
}

  type.addEventListener('change',function(){box.hidden=type.value!==WS_TYPE});

/* A radio cannot normally be unticked. These two questions are optional — the answer is often not
   known yet — so clicking the chosen option again clears it. The group's value is tracked here
   rather than read off the input, because by the time `click` fires the browser has already
   ticked it; a click forwarded from the <label> bubbles up with the input as its target too. */
function wireRadioToggle(box){
  if(!box)return;
  var cur={},list=box.querySelectorAll('input[type=radio]'),i;
  for(i=0;i<list.length;i++)if(list[i].checked)cur[list[i].name]=list[i].value;
  box.addEventListener('click',function(e){
    var r=e.target;
    if(!r||r.tagName!=='INPUT'||r.type!=='radio')return;
    if(cur[r.name]===r.value){
      r.checked=false;cur[r.name]='';
      r.dispatchEvent(new Event('change',{bubbles:true}));
    }else cur[r.name]=r.value;
  });
}
function workshopChanges(raw,serviceType){
  if(serviceType!==WS_TYPE)return null;
  var i=document.querySelector('input[name="ceWsIn"]:checked'),o=document.querySelector('input[name="ceWsOut"]:checked');
  var inbound=i?i.value:'',outbound=o?o.value:'';
  var l=wsLast(raw,'logistics')||{};
  /* Nothing picked and nothing picked before — a Workshop case saved without touching these must
     not write a log entry. Clearing an answer that WAS saved is a real change and is recorded. */
  if(!inbound&&!outbound&&!l.inbound&&!l.outbound)return null;
  if(inbound===(l.inbound||'')&&outbound===(l.outbound||''))return null;
  return {workshop:'logistics',inbound:inbound,outbound:outbound,
    status:'Workshop · นำเข้า: '+wsInboundText(inbound)+' / คืน: '+wsOutboundText(outbound),
    note:'',media:[],createdAt:new Date().toISOString(),by:wsWho(),id:'WS-'+Date.now().toString(36)};
}

/* =======================================================================
   ไฟล์แนบของปัญหา (2026-10-20, ข้อ 11 / 12)
   "ปุ่มเพิ่มไฟล์ในรายละเอียดเคสอะมันกดไม่ได้ ผมอยากให้แอดมินหรือคนอื่นๆกดได้ เพิ่มไฟล์ตรงปัญหา
   ที่ลูกค้าเจอ". The ＋ เพิ่มไฟล์ tile only showed a toast. Files now go into c.media — the
   list the customer's own photos are in, which travels in service_cases.media
   (06-v70-case-media.sql) — tagged from:'staff' with who added them and when.
   ======================================================================= */
var CASE_FILE_MAX=2.5*1024*1024,CASE_FILE_COUNT=20;
function caseFileKind(t){
  t=String(t||'');
  return /^image\//.test(t)?'image':/^video\//.test(t)?'video':/^audio\//.test(t)?'audio':/pdf$/i.test(t)?'file':'';
}
function readCaseFiles(list){
  var out=[],who=wsWho();
  return [].slice.call(list||[]).reduce(function(p,file){
    return p.then(function(){
      var t=String(file.type||''),kind=caseFileKind(t);
      if(!kind){toast(file.name+' — แนบได้เฉพาะรูป วิดีโอ ไฟล์เสียง หรือ PDF');return}
      var job=kind==='image'?shrinkImageFile(file).then(function(d){return {data:d,type:'image/jpeg'}})
                            :readFileData(file).then(function(d){return {data:d,type:t}});
      return job.then(function(o){
        var size=Math.round((o.data.length-o.data.indexOf(',')-1)*0.75);
        if(size>CASE_FILE_MAX){toast(file.name+' ใหญ่เกิน 2.5 MB');return}
        out.push({name:file.name,type:o.type,size:size,data:o.data,from:'staff',by:who,at:new Date().toISOString()});
      },function(){toast('อ่านไฟล์ '+file.name+' ไม่ได้')});
    });
  },Promise.resolve()).then(function(){return out});
}
/* What the case already shows: its own list, or — for a case from before the media column —
   the request it came from, copied over so adding one file does not hide the customer's. */
function caseMediaBase(raw){
  if(raw&&Array.isArray(raw.media)&&raw.media.length)return raw.media.slice();
  try{
    var reqs=readJSON(K.lineRequests,[])||[];
    for(var i=0;i<reqs.length;i++){
      var r=reqs[i];
      if(r&&raw&&r.caseId===raw.id&&Array.isArray(r.media)&&r.media.length)return r.media.slice();
    }
  }catch(e){}
  return [];
}
/* The new list, or null when nothing is left to add. */
function caseMediaWith(raw,items){
  var base=caseMediaBase(raw);
  if(base.length+items.length>CASE_FILE_COUNT){
    toast('แนบได้สูงสุด '+CASE_FILE_COUNT+' ไฟล์ต่อเคส');
    items=items.slice(0,Math.max(0,CASE_FILE_COUNT-base.length));
  }
  return items.length?base.concat(items):null;
}
function pickCaseFiles(done){
  var inp=document.createElement('input');
  inp.type='file';inp.multiple=true;inp.accept='image/*,video/*,audio/*,application/pdf';
  inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change',function(){
    readCaseFiles(inp.files).then(function(items){
      if(inp.parentNode)inp.parentNode.removeChild(inp);
      if(items.length)done(items);
    });
  });
  inp.click();
}

/* One place where a status really changes, whichever control asked for it. */
var scdAsk=(function(){
  var open=null;
  return function(opts){
    return new Promise(function(resolve){
      if(open){resolve(false);return}
      var prev=document.activeElement;
      var lines=String(opts.message||'').split('\n').filter(function(x){return x!==''});
      var ovl=document.createElement('div');
      open=ovl;
      ovl.className='scd-ask';
      ovl.innerHTML='<div class="scd-ask-card'+(opts.danger?' is-danger':'')+'" role="alertdialog"'
        +' aria-modal="true" aria-label="'+esc(opts.title||'ยืนยัน')+'">'
        +'<div class="scd-ask-icon" aria-hidden="true">'+(opts.danger?'🗑':'❓')+'</div>'
        +'<h4>'+esc(opts.title||'ยืนยันการทำรายการ')+'</h4>'
        +'<div class="scd-ask-body">'+lines.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'</div>'
        +'<div class="scd-ask-acts">'
        +'<button type="button" class="scd-ask-no" data-ask="0">'+esc(opts.cancelText||'ยกเลิก')+'</button>'
        +'<button type="button" class="scd-ask-yes" data-ask="1">'+esc(opts.okText||'ยืนยัน')+'</button>'
        +'</div></div>';
      function done(v){
        document.removeEventListener('keydown',key,true);
        if(ovl.parentNode)ovl.parentNode.removeChild(ovl);
        open=null;
        try{if(prev&&prev.focus)prev.focus()}catch(e){}
        resolve(!!v);
      }
      function key(e){
        if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(false)}
        else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();done(true)}
      }
      ovl.addEventListener('click',function(e){
        var b=e.target&&e.target.closest?e.target.closest('[data-ask]'):null;
        if(b){e.preventDefault();done(b.getAttribute('data-ask')==='1');return}
        if(e.target===ovl){e.preventDefault();done(false)}
      });
      document.body.appendChild(ovl);
      document.addEventListener('keydown',key,true);
      var yes=ovl.querySelector('.scd-ask-yes');
      if(yes)yes.focus();
    });
  };
})();

function applyStatus(next,why){

    toast(GATE_CREW);assignTechnician();return;
  }

    title:closing?'ปิดเคสนี้':'เปลี่ยนสถานะเคส',
    message:(why?why+'\n':'')+'เคส '+(c.caseNo||c.id)+'\nจาก “'+(c.status||'-')+'” เป็น “'+next+'”',
    okText:closing?'ปิดเคส':'เปลี่ยนสถานะ',

/* Why the circle one step ahead cannot be pressed yet, or '' when it can. */
/* 2026-10-20 (ข้อ 7): nobody gets past มอบหมาย without a technician on the case. */
var GATE_CREW='ยังไม่ได้มอบหมายช่าง — มอบหมายงานก่อนจึงไปขั้นถัดไปได้';
function hasCrew(m){return !!(m&&m.assignment&&(m.assignment.technician||(m.assignment.crew||[]).length))}
function stepGate(m,idx){
  if(isWorkshopCase(m.raw)){
    if(idx===S('assign')&&!hasCrew(m))return GATE_CREW;
    if(idx===S('service')&&wsTrackNow(m.raw)!=='พร้อมส่งคืน')return 'รอช่างอัปเดตให้ถึง “พร้อมส่งคืน”';
    if(idx===S('done')&&!wsLast(m.raw,'returned'))return 'ต้องผ่าน QC และบันทึกส่งคืนเครื่องก่อน';
    return '';
  }
  if(idx===S('assign')&&!hasCrew(m))return GATE_CREW;
  return (idx===S('service')&&!fieldDone(m))?'รอช่างอัปเดตให้จบกระบวนการก่อน':'';
}
/* A circle was pressed. */
function stepPressed(i,role){
  var m=caseDetailModel,idx=stepIndex(m.case.status);
  if(role==='online'){closeOnline();return}
  if(role==='open'||role==='far'){
    if(openStep===i){closeStepDrawer();return}
    /* Opening from closed slides. Moving from one step to another swaps the content where it
       stands: sliding out and back in for a single press costs .7s and reads as sluggish. */
    if(openStep==null)slideNext='sdStepDrawer';
    else stepSlideDir=i>openStep?1:-1;
    openStep=i;
    openField=null;          /* a different step: start with the field track collapsed */
    repaintProgress();
    return;
  }
  /* role === 'next' */
  if(idx===S('intake')&&i===S('assign')&&!hasCrew(m)){
    toast('เลือกช่างและวันนัดหมายก่อน แล้วเคสจะไปขั้น “'+stepLabel(m,i)+'” เอง');
    assignTechnician();return;
  }
  var gate=stepGate(m,idx);
  if(gate===GATE_CREW){toast(gate);assignTechnician();return}
  if(gate){
    if(openStep==null)slideNext='sdStepDrawer';
    openStep=idx;                     /* show the step that is holding it up, and why */
    repaintProgress();
    toast('ยังข้ามไปขั้นถัดไปไม่ได้ — '+gate);
    return;
  }
  applyStatus(STEPS[i].statuses[0],'ขั้นถัดไปคือ “'+stepLabel(m,i)+'”');
}

/* Redraws only the progress block, so the rest of the page keeps its scroll and panels. */
function repaintProgress(){
  var host=document.querySelector('.scd-progress');
  /* slideNext is read while rendering, so it is cleared after, and cleared on the early
     return too — a stale one would render the next block collapsed with nothing to open it. */
  if(!host||!host.parentNode){slideNext=null;return}
  var id=slideNext,dir=stepSlideDir,oldDrawer=host&&host.querySelector('#sdStepDrawer');
  var oldInner=dir&&oldDrawer&&oldDrawer.querySelector('.scd-stepdrawer-in');
  var oldLayer=oldInner?oldInner.cloneNode(true):null;
  var oldHeight=oldDrawer?oldDrawer.getBoundingClientRect().height:0;
  var fieldDir=fieldSlideDir,oldField=host&&host.querySelector('#sdFieldDetail');
  var oldFieldInner=fieldDir&&oldField&&oldField.querySelector('.sd-fdetail-in');
  var oldFieldLayer=oldFieldInner?oldFieldInner.cloneNode(true):null;
  var oldFieldHeight=oldField?oldField.getBoundingClientRect().height:0;
  var wrap=document.createElement('div');
  wrap.innerHTML=renderProgress(caseDetailModel);
  var fresh=wrap.firstChild;
  host.parentNode.replaceChild(fresh,host);
  slideNext=null;
  stepSlideDir=0;
  fieldSlideDir=0;
  if(id)slideOpen(id);
  if(dir&&oldLayer){
    var box=fresh.querySelector('#sdStepDrawer'),next=box&&box.querySelector('.scd-stepdrawer-in');
    var reduce=false;try{reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){}
    if(box&&next&&!reduce){
      var nextHeight=box.getBoundingClientRect().height;
      box.style.cssText+=';position:relative;overflow:hidden;height:'+oldHeight+'px;max-height:'+oldHeight+'px;transition:height .4s cubic-bezier(.22,.9,.3,1),max-height .4s cubic-bezier(.22,.9,.3,1)';
      [oldLayer,next].forEach(function(el){el.style.cssText+=';position:absolute;inset:0;width:100%;transition:transform .4s cubic-bezier(.22,.9,.3,1),opacity .28s ease'});
      oldLayer.setAttribute('aria-hidden','true');oldLayer.style.transform='translateX(0)';
      next.style.transform='translateX('+(dir*100)+'%)';next.style.opacity='0';box.appendChild(oldLayer);
      requestAnimationFrame(function(){requestAnimationFrame(function(){oldLayer.style.transform='translateX('+(-dir*100)+'%)';oldLayer.style.opacity='0';next.style.transform='translateX(0)';next.style.opacity='1';box.style.height=nextHeight+'px';box.style.maxHeight=nextHeight+'px'})});
      setTimeout(function(){if(oldLayer.parentNode)oldLayer.remove();next.style.position='';next.style.inset='';next.style.width='';next.style.transition='';next.style.transform='';next.style.opacity='';box.style.position='';box.style.overflow='';box.style.height='';box.style.maxHeight='none';box.style.transition=''},430);
    }
  }
  if(fieldDir&&oldFieldLayer){
    var fieldBox=fresh.querySelector('#sdFieldDetail'),fieldNext=fieldBox&&fieldBox.querySelector('.sd-fdetail-in');
    var fieldReduce=false;try{fieldReduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){}
    if(fieldBox&&fieldNext&&!fieldReduce){
      var fieldNextHeight=fieldBox.getBoundingClientRect().height;
      fieldBox.style.cssText+=';position:relative;overflow:hidden;height:'+oldFieldHeight+'px;max-height:'+oldFieldHeight+'px;transition:height .4s cubic-bezier(.22,.9,.3,1),max-height .4s cubic-bezier(.22,.9,.3,1)';
      [oldFieldLayer,fieldNext].forEach(function(el){el.style.cssText+=';position:absolute;inset:0;width:100%;transition:transform .4s cubic-bezier(.22,.9,.3,1),opacity .28s ease'});
      oldFieldLayer.setAttribute('aria-hidden','true');oldFieldLayer.style.pointerEvents='none';
      fieldNext.style.transform='translateX('+(fieldDir*100)+'%)';fieldNext.style.opacity='0';fieldBox.appendChild(oldFieldLayer);
      requestAnimationFrame(function(){requestAnimationFrame(function(){oldFieldLayer.style.transform='translateX('+(-fieldDir*100)+'%)';oldFieldLayer.style.opacity='0';fieldNext.style.transform='translateX(0)';fieldNext.style.opacity='1';fieldBox.style.height=fieldNextHeight+'px';fieldBox.style.maxHeight=fieldNextHeight+'px'})});
      setTimeout(function(){if(oldFieldLayer.parentNode)oldFieldLayer.remove();fieldNext.style.position='';fieldNext.style.inset='';fieldNext.style.width='';fieldNext.style.transition='';fieldNext.style.transform='';fieldNext.style.opacity='';fieldBox.style.position='';fieldBox.style.overflow='';fieldBox.style.height='';fieldBox.style.maxHeight='none';fieldBox.style.transition=''},430);
    }
  }
}
/* ลบเคส. Moving the record into ถังขยะ, dropping the Supabase row and re-rendering the lists
   is still the application's job — only it owns settings.trash — so the case is handed over
   with intent=delete as นัดหมาย and เปลี่ยนสถานะ are.

   2026-09-18, on the owner's instruction "กดลบหน้าไหน popup ขึ้นหน้านั้น": the QUESTION is asked
   HERE, on the page the button is on, instead of after the jump. On yes a one-shot marker is
   left in sessionStorage and js/28 reads it, calls imodeDeleteCaseConfirmed() and clears it —
   so the visitor is asked exactly once, on the screen they pressed.

   The marker is in sessionStorage on purpose: a hand-made URL carrying intent=delete cannot
   set one, so that URL still goes through the asking path and still checks case.edit, which
   is the property part 21 deliberately gave it. */
function deleteCase(){
  var c=caseDetailModel&&caseDetailModel.case,id=c&&c.id;
  if(!id){toast('ไม่พบเคส');return}
  scdAsk({
    title:'ลบเคสนี้',
    message:'เคส '+(c.caseNo||c.ticket||id)+'\n'
      +'ย้ายไปถังขยะ พร้อมคำขอจากลูกค้าของเคสนี้ (ถ้ามี)\n'
      +'กู้คืนได้จากถังขยะภายใน 30 วัน',
    okText:'ลบเคส',
    danger:true
  }).then(function(ok){
    if(!ok)return;
    try{sessionStorage.setItem('imode_v70_delete_ok',id)}catch(e){}
    toast('กำลังย้ายเคสไปถังขยะ…');
    setTimeout(function(){goApp('cases','&caseId='+encodeURIComponent(id)+'&intent=delete')},350);
  });
}
/* This page still writes no business data. Stopping the response clock leaves one entry in
   imode_v70_case_responded — the device-local mirror js/48 owns — and the application
   applies it to the case and pushes it to Supabase on its next load. Handing the visitor
   back instead does not work: js/46 requires a password on every load, so an intent in the
   URL is spent at the login door and lost. */
var RESPONSE_MIRROR='imode_v70_case_responded';
function responseMirror(){
  try{var o=JSON.parse(localStorage.getItem(RESPONSE_MIRROR)||'{}');return (o&&typeof o==='object')?o:{}}
  catch(e){return {}}
}
/* The case's own field when the application has already applied it, this device's mirror
   while it has not, so the card reads the same either way. */
function respondedStamp(c){
  if(c&&c.respondedAt)return {at:c.respondedAt,by:c.respondedBy||''};
  var e=responseMirror()[c&&c.id];
  return e?{at:e.at,by:e.by||''}:null;
}
function markResponded(){
  var c=caseDetailModel&&caseDetailModel.case;
  if(!c){toast('ไม่พบเคส');return}
  if(respondedStamp(c)){toast('บันทึกการตอบกลับไว้แล้ว');return}
  try{
    var o=responseMirror();
    o[c.id]={at:new Date().toISOString(),by:''};
    localStorage.setItem(RESPONSE_MIRROR,JSON.stringify(o));
  }catch(e){toast('บันทึกไม่สำเร็จบนอุปกรณ์นี้');return}
  var host=document.querySelector('.scd-sla');
  if(host&&host.parentNode){
    var wrap=document.createElement('div');
    wrap.innerHTML=renderSla(caseDetailModel);
    host.parentNode.replaceChild(wrap.firstChild,host);
  }
  toast('บันทึกว่าตอบกลับลูกค้าแล้ว · นาฬิกาตอบกลับหยุดแล้ว');
}

   anywhere in this application yet, so a channel with no destination says so. */
function contactCustomer(channel){
  var cu=caseDetailModel.customer;
  if(channel==='phone'){

var CC_TYPES={phone:['โทร','📞'],email:['อีเมล','✉️'],line:['LINE','💬'],whatsapp:['WhatsApp','🟢']};
function ccHref(ch){
  var v=String(ch.value||'').trim();
  if(ch.type==='phone')return 'tel:'+v.replace(/[^0-9+]/g,'');
  if(ch.type==='email')return 'mailto:'+v+'?subject='+encodeURIComponent(caseDetailModel.case.caseNo||'');
  if(ch.type==='line')return /^https?:/i.test(v)?v:(v.charAt(0)==='@'?'https://line.me/R/ti/p/'+encodeURIComponent(v):'https://line.me/ti/p/~'+encodeURIComponent(v));
  if(ch.type==='whatsapp'){var d=v.replace(/[^0-9]/g,'');if(d.charAt(0)==='0')d='66'+d.slice(1);return 'https://wa.me/'+d}
  return '#';
}
function contactList(cu){

  String(cu.legacyPhone||'').split(/[,\/]+/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(v){ch.push({type:'phone',value:v})});
  if(cu.legacyEmail)ch.push({type:'email',value:cu.legacyEmail});
  return (cu.legacyContact||ch.length)?[{name:cu.legacyContact||'ผู้ติดต่อหลัก',position:'',channels:ch}]:[];
}

/* 2026-09-15: a POPUP, on the owner's instruction — "ผมบอกว่าทำเป็น POP UP". It used to be a
   card appended in the flow of the page, below the fold, which is why the นัดหมาย panel did
   not read as a dialog. Converting panel() itself rather than the assign caller means every
   drawer on this page — the six step drawers, ติดต่อลูกค้า, เปลี่ยนสถานะ — becomes a popup
   together, and there is still exactly one of them to maintain.
   #scdPanel keeps its id and its place in the markup: close-panel and two other functions
   address it by that name, and it is the element the overlay is painted on. */
function panel(title,html){
  var host=el('scdPanel');
  host.innerHTML='<div class="scd-modal-back" data-action="close-panel"></div>'
    +'<section class="card scd-modal-card" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'
    +'<div class="card-head"><span class="ic">▤</span><h2>'+esc(title)+'</h2><span class="spacer"></span>'
    +'<button type="button" class="scd-chip-btn" data-action="close-panel" aria-label="ปิด">ปิด</button></div>'
    +'<div class="scd-modal-body">'+html+'</div></section>';
  host.classList.add('is-open');
  document.body.classList.add('scd-modal-open');
  /* Focus the dialog so Escape reaches it and a screen reader announces it. */
  var card=host.querySelector('.scd-modal-card');
  if(card){card.setAttribute('tabindex','-1');try{card.focus({preventScroll:true})}catch(e){}}
}
function closePanel(){
  var host=el('scdPanel');
  if(host){host.innerHTML='';host.classList.remove('is-open')}
  document.body.classList.remove('scd-modal-open');
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  var host=el('scdPanel');
  if(host&&host.classList.contains('is-open')){e.preventDefault();closePanel()}
});

/* =======================================================================
   REALTIME — this page catches up without a reload
   -----------------------------------------------------------------------
   REPORTED 2026-09-20, with a screenshot of the quotation track sitting on รอลูกค้าเซ็น:
   "ลูกค้าส่งใบเสนอราคาแล้วแต่สถานะไม่เรียลไทม์ต้องกดรีหน้าเว็บก่อน".

   MEASURED BEFORE CHANGING ANYTHING, two browsers against the live project: an INSERT reached
   the other device in 5s and a status UPDATE in 0.5s. So Supabase realtime is on and
   09-v70-realtime-all.sql really was run — the stream was never the problem.

   THE PROBLEM IS THAT THIS FILE IS A DIFFERENT DOCUMENT. js/85-v70RealtimeScript.js subscribes
   and applies rows for index.html; service-case-detail.html loads supabase-js and js/51 and
   nothing else, so it had no subscription of any kind. Every other screen in the project
   updated itself and this one — the one an admin sits on while waiting for a customer to
   sign — could only be reloaded by hand.

   WHY IT DOES NOT JUST CALL syncCloud(): that lives in js/03, which this document does not
   load, and it replaces eleven arrays wholesale. Here we want the opposite — touch as little
   as possible.

   WHAT IT MAPS, AND WHY THE LIST IS SHORT. The page reads localStorage, so an incoming row has
   to be written there in the application's camelCase shape. Restating js/03's fromCaseDb()
   here in full is exactly how two copies drift apart (part 18's media column), so only the
   fields this page actually displays are mapped, and every other field on the local record is
   left untouched:

       service_cases     status, assignee, appointment, field_status, field_status_log, updated_at
       quotations        status, updated_at
       system_settings   quoteApprovals, quoteAccepts, caseFeedback, caseStatusLog  (nothing else —
                         never the configuration, same rule js/85 follows)

   A repaint is skipped when nothing actually changed, so your own writes do not make the page
   flash, and it is deferred while a drawer is open so an update cannot close a panel from
   under the person reading it. */
var CaseLive=(function(){
  var channel=null,pending=false,timer=null;
  var state={on:false,status:'',events:0};

  function readJ(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  function writeJ(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

  /* A drawer is a modal on this page; repainting under one would close it mid-read. */
  function busy(){
    try{
      var p=document.getElementById('scdPanel');
      if(p&&p.classList.contains('is-open'))return true;
      if(document.body.classList.contains('scd-modal-open'))return true;
    }catch(e){}
    return false;
  }
  function repaint(){
    if(busy()){
      pending=true;
      if(!timer)timer=setInterval(function(){
        if(busy())return;
        clearInterval(timer);timer=null;
        if(pending){pending=false;repaint()}
      },700);
      return;
    }
    pending=false;
    try{CaseDetailData.refresh()}catch(e){}
    try{
      load().then(function(res){
        if(res&&res.error)return;
        renderPage(res);
      },function(){});
    }catch(e){}
  }

  function caseId(){return getCaseIdFromUrl()}

  /* 2026-09-21 — A CORRECTION CHANGES NOTHING ABOUT THE LENGTH OF THE LOG.
     This compared `(fieldStatusLog||[]).length`, so a technician fixing a note through js/91 —
     or restoring an earlier version — arrived here, was written onto `hit`, and was then thrown
     away: before===after, so the function returned false, the array was never saved to
     localStorage and nothing repainted. The office saw the old wording until it reloaded.

     The fingerprint is deliberately NOT JSON.stringify(log): an entry carries base64 photos, so
     that would stringify hundreds of KB twice on every realtime event. These six small fields
     are what an edit actually moves — the note itself (notes are short), the edit stamp, and the
     counts of media and revisions. */
  function logPrint(log){
    if(!Array.isArray(log))return '';
    return log.map(function(e){
      e=e||{};
      return [e.id||'',e.status||'',e.note||'',e.editedAt||'',
              (e.media||[]).length,(e.revisions||[]).length].join('');
    }).join('');
  }
  function applyCase(row){
    if(!row||!row.id)return false;
    var list=readJ(K.cases,[])||[],hit=null;
    for(var i=0;i<list.length;i++)if(list[i]&&list[i].id===row.id){hit=list[i];break}
    if(!hit)return false;                       /* a case this device has never seen */
    var before=JSON.stringify([hit.status,hit.assignee,hit.appointment,hit.fieldStatus,
                               logPrint(hit.fieldStatusLog)]);
    if('status' in row)hit.status=row.status||'';
    if('appointment' in row)hit.appointment=row.appointment||'';
    if('field_status' in row)hit.fieldStatus=row.field_status||'';
    if('field_status_log' in row&&Array.isArray(row.field_status_log))hit.fieldStatusLog=row.field_status_log;
    if('updated_at' in row)hit.updatedAt=row.updated_at||hit.updatedAt;
    /* js/38 keeps a crew as a comma list in the one `assignee` column; both shapes are kept in
       step so the drawer and every reader agree. */
    if('assignee' in row){
      var raw=String(row.assignee||'');
      var crew=raw?raw.split(',').map(function(x){return x.trim()}).filter(Boolean):[];
      hit.assignee=crew[0]||'';
      hit.assignees=crew;
    }
    var after=JSON.stringify([hit.status,hit.assignee,hit.appointment,hit.fieldStatus,
                              logPrint(hit.fieldStatusLog)]);
    if(before===after)return false;
    writeJ(K.cases,list);
    return true;
  }

  function applyQuote(row){
    if(!row||!row.id)return false;
    var list=readJ(K.quotes,[])||[],hit=null;
    for(var i=0;i<list.length;i++)if(list[i]&&list[i].id===row.id){hit=list[i];break}
    if(!hit)return false;
    if(!('status' in row))return false;
    if(String(hit.status||'')===String(row.status||''))return false;
    hit.status=row.status||'';
    if(row.updated_at)hit.updatedAt=row.updated_at;
    writeJ(K.quotes,list);
    return true;
  }

  var SETTING_KEYS=['quoteApprovals','quoteAccepts','quoteViews','caseFeedback','caseStatusLog',
                    'quoteStaffSigns','quoteDocs'];
  /* 2026-09-21 — AN APPROVAL THAT HAS A SIGNATURE IS NEVER REPLACED BY ONE THAT HAS NONE.
     saveStaffSign() writes the WHOLE settings object back to system_settings, and this
     subscription hears its own echo a moment later. If that round trip ever returns an approval
     whose `sig` has been dropped — a trimmed payload, an older row, a device that never held
     the image — a blind copy would delete the customer's signature from this device, and the
     next openQuoteDoc() would render the paper without it. Approvals are only ever added, so
     preferring whichever copy actually carries the image is both the safe answer and the
     correct one. */
  function mergeApprovals(local,incoming){
    if(!incoming||typeof incoming!=='object')return local;
    if(!local||typeof local!=='object')return incoming;
    var out={},k;
    for(k in incoming)if(Object.prototype.hasOwnProperty.call(incoming,k))out[k]=incoming[k];
    for(k in local){
      if(!Object.prototype.hasOwnProperty.call(local,k))continue;
      var mine=local[k],theirs=out[k];
      if(mine&&mine.sig&&(!theirs||!theirs.sig))out[k]=mine;      /* keep the image */
      else if(!theirs)out[k]=mine;                                /* ours, not pushed yet */
    }
    return out;
  }
  function applySettings(row){
    var data=row&&row.data;
    if(!data||typeof data!=='object')return false;
    var s=readJ(K.settings,{})||{},moved=false;
    SETTING_KEYS.forEach(function(k){
      if(!(k in data))return;
      /* 2026-09-21 — every one of these is an {id: record} map that only ever grows, so the
         union is right for all of them, not only for approvals: an incoming copy that has
         lost an id this device holds must not delete it. The `.sig` clause inside simply
         never fires for the ones that carry no image. quoteDocs is the exception and is
         replaced: it is a cache js/80 re-bakes and caps at 25, and holds no signature. */
      var next=(k==='quoteDocs')?data[k]:mergeApprovals(s[k],data[k]);
      var a='',b='';
      try{a=JSON.stringify(next)}catch(e){return}
      try{b=JSON.stringify(s[k])}catch(e){b=''}
      if(a===b)return;
      s[k]=next;moved=true;
    });
    if(!moved)return false;
    writeJ(K.settings,s);
    return true;
  }

  /* Realtime delivers changes made AFTER the subscription starts; it is not an initial
     read. This standalone document boots from localStorage, so a case opened before the
     application's latest sync could otherwise keep an old/empty fieldStatusLog forever
     even while Supabase already held the complete track. Subscribe first, then pull this
     one row once so there is no gap between the snapshot and later events. */
  function pullCurrentCase(sb,mine){
    if(!sb||!mine)return;
    var cols='id,ticket,status,assignee,appointment,field_status,field_status_log,updated_at';
    function findBy(col){
      try{return Promise.resolve(sb.from('service_cases').select(cols).eq(col,mine).maybeSingle())}
      catch(e){return Promise.resolve({error:e,data:null})}
    }
    findBy('id').then(function(r){
      if(r&&!r.error&&r.data)return r;
      return findBy('ticket');
    }).then(function(r){
      if(!r||r.error||!r.data)return;
      if(applyCase(r.data))repaint();
    },function(){});
  }

  function start(){
    var sb=null;
    try{sb=CaseWrite.client()}catch(e){}
    if(!sb||typeof sb.channel!=='function'){state.status='no-client';return}
    var mine=caseId();
    try{
      channel=sb.channel('scd-live-'+Math.random().toString(36).slice(2,8));
      channel.on('postgres_changes',{event:'*',schema:'public',table:'service_cases'},function(p){
        state.events++;
        var row=p&&p.new;
        /* Only this case. Every other row on the project streams past and is ignored. */
        if(!row||!mine||(row.id!==mine&&String(row.ticket||'')!==mine))return;
        /* 2026-09-28: realtime cuts a row over ~1 MB (a case with photos) down to its small
           columns and says so in p.errors — field_status_log then never arrived and the
           technician's notes and photos waited for a reload. Read this one row back in full. */
        if((p.errors&&p.errors.length)||!('field_status_log' in row)){pullCurrentCase(sb,mine);return}
        if(applyCase(row))repaint();
      });
      channel.on('postgres_changes',{event:'*',schema:'public',table:'quotations'},function(p){
        state.events++;
        if(applyQuote(p&&p.new))repaint();
      });
      channel.on('postgres_changes',{event:'*',schema:'public',table:'system_settings'},function(p){
        state.events++;
        if(applySettings(p&&p.new))repaint();
      });
      channel.subscribe(function(st){
        state.status=String(st||'');
        state.on=(state.status==='SUBSCRIBED');
        if(state.on)pullCurrentCase(sb,mine);
      });
    }catch(e){state.status='error'}
  }

  /* 2026-10-21 ข้อ 6 "แชท Real time แล้ว บาร์สถานะไม่ real time": js/138 calls pull() when a
     status line lands in this case's chat, so the bar follows the chat even if the row's own
     event was missed. Another tab of this browser writes the same localStorage, so its change
     is already "ours" to applyCase(); the storage event repaints for it. */
  function pull(){
    var sb=null;
    try{sb=CaseWrite.client()}catch(e){}
    pullCurrentCase(sb,caseId());
  }
  window.addEventListener('storage',function(e){
    if(e&&(e.key===K.cases||e.key===K.quotes))repaint();
  });

  return {start:start,pull:pull,state:function(){return state}};
})();
window.CaseLive=CaseLive;

load().then(function(res){
  if(res&&res.error){renderError(res.error);window.scdReady=true;return}
  renderPage(res);
  window.scdReady=true;
  /* After the first paint, never before: subscribing earlier would race the render it is
     meant to refresh. */
  try{CaseLive.start()}catch(e){}
  /* 2026-10-20: back from เพิ่มเครื่อง (missingMachinePopup) — reopen ลงรายละเอียดเคส with the
     new machine already chosen; saving is still the person's own press. */
  try{
    var pm=new URLSearchParams(location.search).get('pickMachine');
    if(pm){
      var u=new URL(location.href);u.searchParams.delete('pickMachine');
      history.replaceState(history.state,'',u.pathname+u.search+u.hash);
      var ma=(readJSON(K.machines,[])||[]).filter(function(x){return x&&x.id===pm})[0];
      editCase();
      if(ma){
        var cs=el('ceCustomer'),ms=el('ceMachine');
        if(cs&&cs.value!==ma.customerId){cs.value=ma.customerId;cs.dispatchEvent(new Event('change',{bubbles:true}))}
        if(ms){ms.innerHTML=ceMachineOptions(ma.customerId,pm);ms.value=pm}
        toast('เพิ่มเครื่องแล้ว กด บันทึกเคส เพื่อใช้เครื่องนี้');
      }
    }
  }catch(e){}
}).catch(function(err){
  renderError('not-found');
  window.scdReady=true;
});
})();
</script>
<script>
/* 2026-09-24 — the quotation on this page is an A4 page too.

   The owner asked for every document to be A4 whenever it is opened to be looked at, and for a
   phone to show the whole page scaled down rather than a squashed or side-scrolling one.
   index.html gets that from js/112; this file is a separate document that loads nothing from
   js/, so it carries its own short copy — the same two-element wrapper and the same
   transform:scale(). Deliberately duplicated rather than shared, because sharing would make
   this page depend on a file it does not load.

   The paper is the stored quotationDocHTML markup baked by js/80. .scd-qdoc keeps its
   min-width:720px for anything that is not the paper; the paper itself becomes 210mm.
   Printing is unaffected — the print path clones the paper and writes its own stylesheet, and
   this wrapper sits outside the paper. */
(function(){
 'use strict';
 var A4=210*96/25.4;
 var KEY='imode_v70_a4_zoom';        /* the same per-device choice js/112 stores */
 function zoom(){try{return localStorage.getItem(KEY)==='full'?'full':'fit'}catch(e){return 'fit'}}
 function css(){
  if(document.getElementById('scdA4Style'))return;
  var st=document.createElement('style');st.id='scdA4Style';
  st.textContent=[
   '.scd-a4-fit{position:relative;overflow:hidden;margin:0 0 10px}',
   '.scd-a4-fit.is-full{overflow:auto;-webkit-overflow-scrolling:touch}',
   '.scd-a4-stage{transform-origin:top left}',
   '.scd-qdoc .quote-doc.official.scd-a4-page{width:210mm!important;max-width:none!important;'
    + 'min-height:297mm;box-sizing:border-box;margin:0!important;background:#fff}',
   /* the app's global table{min-width:860px} cannot fit a 794px page; see js/112 */
   '.scd-qdoc .scd-a4-page table{min-width:0}',
   '.scd-a4-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 9px;'
    + 'font-size:11px;color:#5a6b86}',
   '.scd-a4-bar .scd-a4-size{font-weight:700;color:#274a8c}',
   '.scd-a4-bar button{border:1px solid #ccd8ea;background:#fff;color:#274a8c;border-radius:999px;'
    + 'padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;min-height:32px}',
   '.scd-a4-bar button[aria-pressed="true"]{background:#1d55c9;border-color:#1d55c9;color:#fff}'
  ].join('');
  document.head.appendChild(st);
 }
 function measure(fit){
  var stage=fit.firstElementChild;if(!stage)return;
  var paper=stage.firstElementChild;if(!paper)return;
  var full=zoom()==='full';
  fit.classList.toggle('is-full',full);
  var avail=fit.clientWidth||fit.getBoundingClientRect().width;
  var w=paper.offsetWidth||A4;
  var sc=full?1:Math.min(1,avail/w);
  if(!isFinite(sc)||sc<=0)sc=1;
  stage.style.transform='scale('+sc+')';
  /* offsetHeight is unscaled, so the window has to reserve the scaled height or the panel
     ends with a tall empty area under the page. */
  fit.style.height=full?'':Math.max(40,Math.round(paper.offsetHeight*sc))+'px';
  var bar=fit.previousElementSibling;
  if(bar&&bar.classList.contains('scd-a4-bar')){
   var lab=bar.querySelector('.scd-a4-size');
   /* only when it really changes: a textContent write is a childList mutation, the observer
      below re-ran apply() on it, apply() scheduled fitAll() again — one frame after another,
      for ever. That was the "ค้าง" on ดูใบเสนอราคาเต็ม. */
   var txt='A4 · 210 × 297 mm · '+Math.round(sc*100)+'%';
   if(lab&&lab.textContent!==txt)lab.textContent=txt;
   var a=bar.querySelector('[data-scda4="fit"]'),b=bar.querySelector('[data-scda4="full"]');
   if(a)a.setAttribute('aria-pressed',String(!full));
   if(b)b.setAttribute('aria-pressed',String(full));
  }
 }
 function fitAll(){var l=document.querySelectorAll('.scd-a4-fit');for(var i=0;i<l.length;i++)measure(l[i])}
 function apply(){
  css();
  var papers=document.querySelectorAll('.scd-qdoc .quote-doc.official');
  var n=0,fresh=0;
  for(var i=0;i<papers.length;i++){
   var p=papers[i];
   if(p.closest('.scd-a4-stage')){n++;continue}
   fresh++;
   p.classList.add('scd-a4-page');
   /* .scd-qdoc carries min-width:720px so the restated .quote-paper-* grids had something to
      lay out against. The paper is a fixed 210mm now, so that floor is obsolete for it — and
      left in place it became the width the scale was computed AGAINST: measured 0.907 and a
      720px page on a 390px phone, still needing a sideways drag inside .scd-qdoc-wrap.
      Cleared on the element rather than through :has(), so it cannot depend on selector
      support, and only on a .scd-qdoc that really holds a page. */
   var host=p.closest('.scd-qdoc');
   if(host)host.style.minWidth='0';
   var fit=document.createElement('div');fit.className='scd-a4-fit';
   var stage=document.createElement('div');stage.className='scd-a4-stage';
   var bar=document.createElement('div');bar.className='scd-a4-bar';
   bar.innerHTML='<span class="scd-a4-size">A4 · 210 × 297 mm</span>'
    + '<button type="button" data-scda4="fit" aria-pressed="true">พอดีจอ</button>'
    + '<button type="button" data-scda4="full" aria-pressed="false">100%</button>';
   p.parentNode.insertBefore(bar,p);
   p.parentNode.insertBefore(fit,p);
   stage.appendChild(p);fit.appendChild(stage);
   var imgs=p.querySelectorAll('img');
   for(var k=0;k<imgs.length;k++){
    if(imgs[k].complete)continue;
    imgs[k].addEventListener('load',fitAll,{once:true});
    imgs[k].addEventListener('error',fitAll,{once:true});
   }
   n++;
  }
  if(fresh)requestAnimationFrame(function(){fitAll();requestAnimationFrame(fitAll)});
  return n;
 }
 window.imodeScdA4=apply;
 window.imodeScdA4Fit=fitAll;
 document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('[data-scda4]'):null;
  if(!b)return;
  try{localStorage.setItem(KEY,b.getAttribute('data-scda4')==='full'?'full':'fit')}catch(x){}
  fitAll();
 });
 /* openQuoteDoc() rebuilds the panel, and so does every staff signature save, so the paper
    arrives more than once. An observer is the one choke point all of those share. It is
    disconnected around our own writes, so the insertions above are never recorded rather than
    recorded and filtered — the loop that locked a tab up in part 17 §11. */
 var mo=new MutationObserver(function(){
  mo.disconnect();
  try{apply()}catch(e){}
  start();
 });
 function start(){
  var host=document.getElementById('scdPanel')||document.body;
  try{mo.observe(host,{childList:true,subtree:true})}catch(e){}
 }
 function boot(){apply();start()}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
 else boot();
 window.addEventListener('resize',function(){clearTimeout(window.__scdA4T);
  window.__scdA4T=setTimeout(fitAll,120)});
 window.addEventListener('orientationchange',function(){setTimeout(fitAll,260)});
})();
</script>
