.ic{height:18px;width:18px;display:inline-block;vertical-align:middle;flex-shrink:0}
[hidden]{display:none!important}

.bars-chart{display:flex;align-items:end;gap:4px;height:141px;border-bottom:1px solid #dae5f5;justify-content:space-between;padding:0 3px}.bar-column{height:137px;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}.bars-pair{display:flex;gap:2px;align-items:end;height:102px}.bar-in,.bar-out{width:7px;min-height:0;display:block;border-radius:3px 3px 0 0}.bar-in{background:#1877ef}.bar-out{background:#ff6e32}.bar-date{white-space:nowrap;font-size:9px;color:#93a0b8}

/* IMODE Typography V1.1 — ปรับฟอนต์ตามภาพหน้า Service ที่ผู้ใช้ส่งมา
   Kanit จะแสดงเมื่อเชื่อมต่ออินเทอร์เน็ต และ fallback เป็น Noto Sans Thai เมื่อออฟไลน์ */
html, body, button, input, select, textarea, option {
  font-family: 'Kanit','Noto Sans Thai',Tahoma,Arial,sans-serif !important;
}
body {font-size:14px;font-weight:400;line-height:1.62;}
.nav {font-size:14px;font-weight:500;}
.nav.active {font-weight:600;}
.app-title {font-size:21px;font-weight:600;}
.app-subtitle {font-size:12px;font-weight:400;}
.page-header h1 {font-weight:600;}
.card-head h2 {font-size:16px;font-weight:600;}
.content-panel h2, .modal-title h2 {font-weight:600;}
.kpi-label {font-size:12px;font-weight:500;}
.kpi-num {font-weight:600;}
.btn, .quick-btn {font-weight:500;}
.segment button {font-weight:500;}
.label, .data-table th {font-weight:600;}
.data-table {font-size:12px;}
.form-control, .search-holder input {font-size:13px;}
.status-badge {font-size:11px;font-weight:500;}
@media(max-width:760px){
  .app-title{font-size:17px;}
  .page-header h1{font-size:22px;}
  .card-head h2{font-size:15px;}
  .nav{font-size:14px;}
}

/* ===== IMODE UI Polish รุ่น 1.1 — ปรับตัวอักษร ระยะ สถานะ และหน้าจอมือถือ ===== */
:root{--muted:#5f7194;--muted2:#5f6f8c;--line:#e6ecf5;--focus:#1b54e2;--ok-bg:#e2f8ed;--ok:#06703b;--warn-bg:#fff4d9;--warn:#8a5d00;--bad-bg:#ffe8e8;--bad:#b32a2a}
::selection{background:#ffd9cc;color:#14244d}
html{scrollbar-color:#c5d1e6 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#c9d4e8;border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
button:focus:not(:focus-visible){outline:none}
b,strong{font-weight:500}
.num,.kpi-num,.data-table td,.big-zero,.donut-center b,.report-tile b{font-variant-numeric:tabular-nums}

/* Sidebar: ให้ทั้ง 15 เมนูอยู่ในจอสูง 900px โดยไม่ต้องเลื่อน */
.logo-wrap{min-height:96px;padding:14px 28px 10px}
.logo-wrap img{width:150px}
.nav-scroller{padding:8px 10px 14px}
.nav-head{font-size:11px;font-weight:500;letter-spacing:.2px;color:#5f6f8c;margin:12px 12px 4px}
.nav{min-height:36px;padding:6px 12px;margin:1px 0;border-radius:9px;font-size:14px;font-weight:400;color:#3f5580}
.nav .ic{width:18px;height:18px}
.nav.active{font-weight:500}
.nav-count{margin-left:auto;background:var(--orange);color:#fff;font-size:11px;line-height:18px;min-width:20px;text-align:center;border-radius:20px;padding:0 6px;font-weight:500}
.sidebar-bottom{padding:10px 12px 12px}
.side-role{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#f8faff;border-radius:10px;padding:8px 10px;text-align:left;color:var(--ink)}
.side-role:hover{border-color:#c7d6f3;background:#f2f6ff}
.side-role .avatar{width:32px;height:32px;font-size:12px}
.side-role strong{display:block;font-size:13px;color:var(--navy)}
.side-role small{display:block;font-size:11px;color:var(--muted)}
.tiny-status{font-size:11px;color:var(--muted);margin-top:9px}

/* Header */
.app-title{color:var(--blue)}
.app-subtitle{color:var(--muted)}
.mode-chip{font-size:12px;font-weight:500;color:#7a4f00}
.counter{font-size:11px;line-height:16px;font-weight:500;min-width:18px;text-align:center}
.profile{border:0;border-left:1px solid var(--border);background:none;text-align:left;border-radius:0;padding:4px 0 4px 15px;color:var(--ink)}
.profile:hover .avatar{background:#dce7ff}
.profile strong{font-size:13px;font-weight:500;color:var(--navy)}
.profile small{font-size:11px;color:var(--muted)}
.avatar{font-weight:500;font-size:13px}

/* Page header */
.breadcrumb{font-size:12px;color:var(--muted2)}
.page-header h1{font-weight:600}
.page-header p{font-size:13px;color:var(--muted)}

/* ปุ่มและฟอร์ม */
.btn{font-size:14px;font-weight:500;border-radius:9px;min-height:40px}
.btn.small{font-size:13px;min-height:34px;padding:5px 11px}
.btn:active:not(:disabled){transform:translateY(0);filter:brightness(.93)}
.btn.primary:hover:not(:disabled){background:#1747c4;filter:none}
.btn.danger:hover:not(:disabled){background:#ffe9e9}
.label{font-size:13px;font-weight:500;color:#3c5279}
.label-note{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.form-control{font-size:14px;color:var(--ink);min-height:42px;border-radius:9px}
.form-control::placeholder,.search-holder input::placeholder{color:#8794ad}
.form-control[readonly]{background:#f5f8fd;color:var(--muted)}
textarea.form-control{resize:vertical;min-height:84px;line-height:1.5}
.search-holder{min-height:42px;border-radius:9px}
.search-holder input{font-size:14px}
.field-hint{font-size:12px;color:var(--muted);margin-top:5px}
.form-banner{font-size:13px;color:#3f5a88}
.by-line{display:block;margin-top:3px;color:var(--muted)}
.summary-inline{font-size:13px}
.summary-inline .diff{margin-left:auto;font-weight:500;border-radius:20px;padding:2px 10px}
.diff.neg{background:var(--bad-bg);color:var(--bad)}.diff.pos{background:var(--ok-bg);color:var(--ok)}.diff.zero{background:#eef2f8;color:var(--muted)}
.machine-note{font-size:12px;color:var(--purple);background:#f2edff;border-radius:20px;padding:2px 10px}
.form-submit .spacer{flex:1}
.form-submit.wrap{flex-wrap:wrap}
.inline-form{display:flex;gap:8px;margin-top:14px}
.callout{font-size:13px;line-height:1.6}
.helper-note{font-size:12px;color:var(--muted)}

/* KPI: 6 ตัวตามสเปก */
.kpi-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
button.kpi{border:1px solid #edf1f8;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:box-shadow .18s,border-color .18s}
button.kpi:hover{border-color:#cbd9f3;box-shadow:0 8px 24px rgba(41,77,137,.09)}
.kpi{min-height:104px;padding:16px 14px}
.kpi .kpi-icon{width:46px;height:46px}
.kpi .ic{width:23px;height:23px}
.kpi-label{font-size:13px;font-weight:500;color:#3c5279}
.kpi-num{font-size:24px;font-weight:600}
.kpi-num small{font-size:14px;color:var(--muted);font-weight:400}
.kpi-num.red-text{color:var(--bad)}
.kpi-note{font-size:12px;color:var(--muted)}
.kpi.red{background:linear-gradient(120deg,#fff,#fff0f0)}
.kpi.red .kpi-icon{background:#ffe3e3;color:var(--red)}
.attention-bar{width:100%;display:flex;align-items:center;gap:12px;border:1px solid #ffd7c8;background:#fff6f2;color:#8a3412;border-radius:12px;padding:12px 16px;margin-bottom:12px;text-align:left;font-size:14px}
.attention-bar .ic{color:var(--orange)}
.attention-bar b{color:#b23c12}
.attention-bar .go{margin-left:auto;color:var(--orange);font-weight:500;white-space:nowrap}
.attention-bar:hover{background:#ffefe8}

/* การ์ดและหัวข้อ */
.card-head h2{font-weight:500;color:var(--blue)}
.content-panel h2,.section-card h2{font-size:16px;font-weight:500;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.section-card h2+.helper-note{margin-bottom:14px}
.section-card b{font-size:inherit;display:inline;margin:0;color:inherit}
.settings-col{display:flex;flex-direction:column;gap:13px;min-width:0}
.subtle-link{font-size:13px;font-weight:500}
.segment button{font-size:13px;font-weight:400;padding:6px 13px;color:#4f6489}
.segment button.active{font-weight:500}
.empty strong{font-weight:500;font-size:15px}
.empty p{font-size:13px;color:var(--muted)}
.empty-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mini-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 12px;font-size:13px;color:var(--muted)}
.mini-empty .ic{color:#9fb3d6;width:22px;height:22px}

/* ตาราง */
.data-table{font-size:13px}
.data-table th{font-size:12px;font-weight:500;color:#4a5f86}
.data-table td{color:#33496f}
.data-table td b{font-weight:500}
.data-table .num{text-align:right}
.data-table td.strong{font-weight:500;color:var(--navy)}
.data-table td.neg{color:var(--bad)}
.data-table td.clip{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.data-table tr.total td{background:#f6f8fd;font-weight:500}
.data-table .code{font-weight:500;color:var(--navy);letter-spacing:.1px}
.sub{font-size:12px;color:var(--muted)}
.name-cell{display:flex;align-items:center;gap:10px;min-width:220px}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line);background:#fff}
.thumb.ph{display:grid;place-items:center;background:#f2f6fd;color:#7f97c4}
.thumb.ph .ic{width:18px;height:18px}
.table-scroller.flush{margin:0 0 12px}
.table-footer{font-size:12px;color:var(--muted);padding-top:2px}
.content-panel .table-footer{padding:0 0 4px}
.tiny-action{width:32px;height:32px;justify-content:center;border-radius:8px}
.tiny-action:hover{background:#eef3ff}
.status-badge{font-size:12px;font-weight:500;min-width:72px}
.status-badge.ok{color:var(--ok)}.status-badge.low{background:var(--warn-bg);color:var(--warn)}.status-badge.out{color:var(--bad)}
.demo-tag{display:inline-block;margin-left:6px;font-size:11px;line-height:18px;padding:0 7px;border-radius:20px;background:#fff1d6;color:#7a4f00;font-weight:500;vertical-align:1px}
.mstatus{display:inline-flex;font-size:12px;line-height:20px;padding:0 9px;border-radius:20px;font-weight:500;white-space:nowrap}
.mstatus.done{background:var(--ok-bg);color:var(--ok)}.mstatus.pending{background:var(--warn-bg);color:var(--warn)}.mstatus.rejected{background:var(--bad-bg);color:var(--bad)}.mstatus.reversed{background:#eef1f6;color:#56657f}
.mtype{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mtype .ic{width:16px;height:16px}
.mtype.in .ic{color:var(--green)}.mtype.out .ic{color:var(--orange)}.mtype.transfer .ic{color:#1873e2}.mtype.count .ic{color:var(--purple)}.mtype.reverse .ic{color:#56657f}

/* แดชบอร์ด */
.recent-row,.legend-row,.alert-row{width:100%;border:0;background:none;text-align:left;color:inherit;font:inherit}
button.recent-row{border-bottom:1px solid #eff2f8;border-radius:0;align-items:center}
button.recent-row:hover{background:#fafcff}
.recent-info strong{font-size:13px;font-weight:500;color:var(--navy)}
.recent-info p{font-size:12px;color:var(--muted)}
.recent-time{font-size:11px;color:var(--muted2)}
.recent-icon.reverse{background:#eef1f6;color:#56657f}
.legend-row{font-size:13px;color:#3f5580;border-radius:6px;padding:3px 4px;margin:3px 0}
.legend-row:hover{background:#f4f7fd}
.legend-row strong{font-weight:500}
.donut-center b{font-weight:600}
.donut-center small{font-size:11px;color:var(--muted)}
.quick-btn{font-weight:500;font-size:14px}
.today-pills{display:flex;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.today-pills span{background:#f3f6fc;border-radius:20px;padding:2px 9px}
.today-pills b{color:var(--navy);font-weight:500}
.chart-legend{display:flex;gap:14px;justify-content:flex-end;font-size:12px;color:var(--muted);margin-bottom:4px}
.lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}.lg.in{background:#1877ef}.lg.out{background:#ff6e32}
.bar-date{font-size:11px;color:var(--muted2)}
.alert-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eff2f8;border-radius:0}
.alert-row:last-child{border-bottom:0}
.alert-row:hover{background:#fafcff}
.alert-row b{display:block;font-size:13px;color:var(--navy)}
.alert-row small{font-size:12px;color:var(--muted)}
.alert-qty{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;color:var(--muted)}
.alert-qty b{display:inline;font-size:15px}

/* รายงาน */
button.report-tile{background:#fff;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
button.report-tile:hover{border-color:#cbd9f3}
.report-tile .swatch{width:22px;height:4px;border-radius:4px;margin-bottom:6px}
.report-tile span{font-size:13px;color:var(--muted)}
.report-tile b{font-weight:600}

/* ตั้งค่า */
.settings-action strong{font-size:14px;font-weight:500}
.settings-action span{font-size:12px;color:var(--muted)}
.settings-action>span:first-child{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#f0f5ff;color:var(--blue2);flex:none}
.settings-action.danger strong{color:var(--bad)}
.settings-action.danger>span:first-child{background:var(--bad-bg);color:var(--bad)}
.warehouse-tile strong{font-weight:500;color:var(--navy)}
.warehouse-tile small{font-size:12px;color:var(--muted)}
.role-current{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px}
.role-current strong{display:block;color:var(--navy)}
.role-current small{display:block;font-size:12px;color:var(--muted)}
.role-current .btn{margin-left:auto}
.role-list{display:flex;flex-direction:column;gap:8px}
.role-option{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;color:var(--ink)}
.role-option:hover{border-color:#c7d6f3;background:#f8faff}
.role-option.active{border-color:var(--blue2);background:#f2f6ff}
.role-option strong{display:block;color:var(--navy)}
.role-option small{display:block;font-size:12px;color:var(--muted)}
.role-option>.ic{margin-left:auto;color:var(--blue2)}
.storage-meter{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);padding:4px 2px 0}
.storage-meter b{color:var(--navy)}

/* รายละเอียด */
.detail-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.kv-list{border:1px solid var(--line);border-radius:10px;padding:2px 12px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #eef2f8;font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);flex:none}
.kv b{text-align:right;color:var(--navy);font-weight:500}
.kv b small{color:var(--muted);font-weight:400}
.detail-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.detail-name{font-size:19px;font-weight:500;color:var(--blue);margin:6px 0 2px}
.stock-box{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;background:#f5f8ff;border-radius:10px;margin-bottom:14px}
.big-zero{font-weight:600;font-size:28px}
.big-zero span{font-size:15px;font-weight:400;color:var(--muted)}
.action-label{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:500}
.mini-moves{margin-bottom:12px}
.gallery{margin-bottom:14px}
.gallery-main{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f6f8fc;position:relative}
.gallery-main img{display:block;width:100%;height:280px;object-fit:contain;background:#fff}
.gallery-main figcaption{position:absolute;left:10px;bottom:10px;background:rgba(20,45,105,.82);color:#fff;font-size:12px;padding:2px 10px;border-radius:20px}
.gallery-strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}
.gallery-thumb{flex:none;width:78px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:3px;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--muted)}
.gallery-thumb img{width:100%;height:52px;object-fit:cover;border-radius:6px}
.gallery-thumb span{font-size:10px;line-height:1.3;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery-thumb.active{border-color:var(--blue2);box-shadow:0 0 0 2px #1b54e222;color:var(--blue2)}

/* ช่องรูป 8 ช่อง */
.slot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.slot-pick{display:grid;place-items:center;aspect-ratio:4/3;border:1.5px dashed #c3d3ee;border-radius:10px;background:#f8faff;cursor:pointer;overflow:hidden;color:#7f97c4;transition:border-color .15s,background .15s}
.slot-pick:hover{border-color:var(--blue2);background:#f1f6ff}
.slot-pick:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.slot.has .slot-pick{border-style:solid;border-color:var(--line);background:#fff}
.slot-pick img{width:100%;height:100%;object-fit:cover}
.slot-empty .ic{width:22px;height:22px}
.slot-name{font-size:12px;color:#3c5279;line-height:1.35;text-align:center}

const $=s=>document.querySelector(s);
const icon=(name,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;
const nfmt=x=>Number(x||0).toLocaleString('th-TH',{maximumFractionDigits:3});
const signed=x=>(x>0?'+':x<0?'−':'')+nfmt(Math.abs(x));
const money=x=>Number(x||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateText=x=>x?new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x)):'ยังไม่มีข้อมูล';
const dayKey=x=>new Date(x).toLocaleDateString('en-CA');
const now=()=>new Date().toISOString();
const nearZero=x=>Math.abs(x)<1e-7?0:Number(Number(x).toFixed(3));
const norm=s=>String(s||'').toLocaleLowerCase('th-TH').trim();

const empty=()=>({schema:SCHEMA,products:[],movements:[],warehouses:structuredClone(DEFAULT_WAREHOUSES),seq:{},updatedAt:null});

let session=loadSession();
let prefs={theme:'system',text:'normal',...(readJSON(PREFS_KEY)||{})};
const darkQuery=window.matchMedia?.('(prefers-color-scheme: dark)');
const resolvedTheme=()=>prefs.theme==='system'?(darkQuery?.matches?'dark':'light'):prefs.theme;
/* ใช้ธีมกับทั้งหน้า (สคริปต์ใน <head> ตั้งค่าเริ่มต้นไว้แล้วเพื่อไม่ให้จอกระพริบ) */
function applyPrefs(animate=false){
 const root=document.documentElement,t=resolvedTheme();
 if(animate){root.classList.add('theme-anim');setTimeout(()=>root.classList.remove('theme-anim'),260);}
 root.dataset.theme=t;root.dataset.text=prefs.text;
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',t==='dark'?'#0f1930':'#15379c');
 const b=document.getElementById('themeButton');
 if(b){b.innerHTML=icon(t==='dark'?'sun':'moon');b.title=t==='dark'?'เปลี่ยนเป็นธีมสว่าง':'เปลี่ยนเป็นธีมมืด';b.setAttribute('aria-label',b.title);}
}
function savePrefs(){try{localStorage.setItem(PREFS_KEY,JSON.stringify(prefs));}catch(e){}applyPrefs(true);}
darkQuery?.addEventListener?.('change',()=>{if(prefs.theme==='system')applyPrefs(true);});

function readJSON(key){try{return JSON.parse(localStorage.getItem(key));}catch(e){return null;}}
function validShape(x){return x&&Array.isArray(x.products)&&Array.isArray(x.movements)&&Array.isArray(x.warehouses)&&x.warehouses.length;}
function load(){
 const cur=readJSON(STORE_KEY);
 if(validShape(cur))return migrate(cur);
 const legacy=readJSON(LEGACY_KEY);       // ข้อมูลจากไฟล์รุ่น 1.0 ในเบราว์เซอร์เดียวกัน
 if(validShape(legacy)){const m=migrate(legacy);persist(m);return m;}
 return empty();
}
/* แปลงข้อมูลรุ่น 1.0 → 2 โดยไม่ทิ้งประวัติเดิม */
function migrate(x){
 if(x.schema===SCHEMA)return x;
 const out={...empty(),...x,schema:SCHEMA,seq:x.seq||{}};
 out.products=x.products.map(p=>{const {image,...rest}=p;return {demo:false,...rest,images:p.images||(image?{overview:image}:{}),balances:p.balances||{}};});
 const chrono=[...x.movements].reverse();
 const numbered=chrono.map(m=>{
  const deltas=m.deltas||legacyDeltas(m);
  return {status:'done',ref:'',requester:'',purpose:'',by:'ข้อมูลรุ่นก่อน',demo:false,...m,deltas,no:m.no||nextNo(out,m.type,m.at)};
 });
 out.movements=numbered.reverse();
 return out;
}
function legacyDeltas(m){
 const a=Number(m.amount||0);
 if(m.type==='in')return {[m.to]:a};
 if(m.type==='out')return {[m.from]:-a};
 if(m.type==='transfer')return {[m.from]:-a,[m.to]:a};
 if(m.type==='count')return {[m.to||m.from]:Number(m.change||0)};
 return {};
}
function persist(data=db,quiet=false){ // คืน false เมื่อบันทึกไม่สำเร็จ
 data.updatedAt=now();
 try{localStorage.setItem(STORE_KEY,JSON.stringify(data));return true;}
 catch(e){if(!quiet)toast('บันทึกลงเบราว์เซอร์ไม่สำเร็จ (พื้นที่เต็มหรือถูกปิดกั้น) โปรดสำรองข้อมูลทันที','bad');return false;}
}
function loadSession(){const s=readJSON(SESSION_KEY);return s&&ROLES[s.role]?s:{role:'admin'};}
function saveSession(){try{localStorage.setItem(SESSION_KEY,JSON.stringify(session));}catch(e){}}

const role=()=>ROLES[session.role];
const actor=()=>role().name;
/* คืนค่า 1 = ทำได้ทันที, 'request' = ส่งคำขอให้อนุมัติ, undefined = ไม่มีสิทธิ์ */
const can=action=>role().can[action];

const productById=id=>db.products.find(p=>p.id===id);
const catName=c=>CATS.find(x=>x.id===c)?.name||'ไม่ระบุ';
const whName=id=>db.warehouses.find(x=>x.id===id)?.name||'–';
const qty=p=>Object.values(p.balances||{}).reduce((a,x)=>a+Number(x||0),0);
const qtyAt=(p,w)=>Number(p?.balances?.[w]||0);
function stockStatus(p){
 const q=qty(p);
 if(q<=0)return {text:'หมดสต๊อก',type:'out'};
 if(Number(p.min||0)>0&&q<=Number(p.min))return {text:'ใกล้หมด',type:'low'};
 return {text:'พร้อมเบิก',type:'ok'};
}
const needsAttention=p=>stockStatus(p).type!=='ok';
const pending=()=>db.movements.filter(m=>m.status==='pending');

function nextNo(data,type,at){
 const d=new Date(at||Date.now());
 const key=`${DOC_PREFIX[type]||'DOC'}-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}`;
 data.seq[key]=(data.seq[key]||0)+1;
 return `${key}-${String(data.seq[key]).padStart(4,'0')}`;
}
/* ตรวจว่าการเปลี่ยนยอดทำได้หรือไม่ (ไม่ติดลบ และเครื่องจักรไม่เกิน 1 ต่อเลขเครื่อง) */
function checkDeltas(p,deltas){
 for(const [w,d] of Object.entries(deltas)){
  const after=nearZero(qtyAt(p,w)+d);
  if(after<0)return `สต๊อกไม่พอ: ${whName(w)} คงเหลือ ${nfmt(qtyAt(p,w))} ${p.unit}`;
 }
 if(p.category==='machines'){
  const total=nearZero(qty(p)+Object.values(deltas).reduce((a,b)=>a+b,0));
  if(total>1)return 'เครื่องจักรหนึ่งเลขประจำเครื่องมีได้ไม่เกิน 1 เครื่อง';
 }
 return null;
}
function applyDeltas(p,deltas){
 for(const [w,d] of Object.entries(deltas)){
  p.balances[w]=nearZero(qtyAt(p,w)+d);
  if(p.balances[w]===0)delete p.balances[w];
 }
}
const totalChange=m=>nearZero(Object.values(m.deltas||{}).reduce((a,b)=>a+b,0));

/* ชุดคำสั่งเปลี่ยนแปลงข้อมูล — คืนค่า {ok, error, data}
   Phase 2: แทนที่แต่ละฟังก์ชันด้วย API ที่ตรวจสิทธิ์และใช้ Database Transaction */
const api={
 saveProduct(input,editId){
  if(!can('product'))return {error:'บทบาทนี้ไม่มีสิทธิ์แก้ไขทะเบียนสินค้า'};
  const code=String(input.code||'').trim(),name=String(input.name||'').trim(),category=input.category;
  const serial=category==='machines'?String(input.serial||'').trim():'';
  if(!code||!name)return {error:'กรอกรหัสและชื่อสินค้าให้ครบ'};
  if(category==='machines'&&!serial)return {error:'เครื่องจักรต้องระบุเลขประจำเครื่อง'};
  if(db.products.some(p=>p.id!==editId&&p.code.toUpperCase()===code.toUpperCase()))return {error:'รหัสสินค้านี้มีอยู่แล้ว'};
  if(serial&&db.products.some(p=>p.id!==editId&&p.serial&&p.serial.toUpperCase()===serial.toUpperCase()))return {error:'เลขประจำเครื่องนี้มีอยู่แล้ว'};
  const min=Number(input.min||0),cost=Number(input.cost||0);
  if(!Number.isFinite(min)||min<0||!Number.isFinite(cost)||cost<0)return {error:'จุดแจ้งเตือนและต้นทุนต้องเป็นตัวเลขไม่ติดลบ'};
  const old=editId?productById(editId):null;
  if(old&&category==='machines'&&old.category!=='machines'&&qty(old)>1)return {error:'สินค้านี้มียอดมากกว่า 1 จึงเปลี่ยนเป็นเครื่องจักรไม่ได้'};
  const data={code,name,category,serial,model:String(input.model||'').trim(),unit:String(input.unit||'ชิ้น'),min,cost,location:String(input.location||'').trim(),images:input.images||{}};
  const snap=JSON.stringify(db);
  if(old){Object.assign(old,data);old.updatedAt=now();old.updatedBy=actor();}
  else db.products.push({id:uid(),...data,balances:{},demo:false,createdAt:now(),createdBy:actor()});
  if(!persist(db,true)){db=JSON.parse(snap);return {error:'พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม ลองลดจำนวนรูปหรือสำรองแล้วล้างข้อมูลตัวอย่าง'};}
  return {ok:true,data:old||db.products.at(-1)};
 },
 deleteProduct(id){
  if(!can('product'))return {error:'บทบาทนี้ไม่มีสิทธิ์ลบสินค้า'};
  const p=productById(id);if(!p)return {error:'ไม่พบสินค้า'};
  if(qty(p)!==0||db.movements.some(m=>m.productId===id))return {error:'ลบไม่ได้ เพราะสินค้านี้ยังมียอดหรือเคยมีรายการเคลื่อนไหว'};
  db.products=db.products.filter(x=>x.id!==id);persist();return {ok:true};
 },
 /* บันทึกรายการสต๊อก: in / out / transfer / count */
 postMovement(input,{at,by,demo}={}){
  const type=input.type,p=productById(input.product),wh=String(input.warehouse||''),dest=String(input.destination||'');
  const right=can(type);
  if(!right&&!by)return {error:'บทบาทนี้ไม่มีสิทธิ์ทำรายการนี้'};
  if(!p)return {error:'กรุณาเลือกสินค้า'};
  if(!db.warehouses.some(w=>w.id===wh))return {error:'กรุณาเลือกคลังสินค้า'};
  const raw=String(input.amount??'').trim(),amount=Number(raw);
  if(!/^\d+(?:\.\d{1,3})?$/.test(raw))return {error:'จำนวนต้องเป็นตัวเลข ทศนิยมได้ไม่เกิน 3 ตำแหน่ง'};
  if(type!=='count'&&amount<=0)return {error:'จำนวนต้องมากกว่า 0'};
  if(type==='transfer'&&(!dest||dest===wh||!db.warehouses.some(w=>w.id===dest)))return {error:'กรุณาเลือกคลังปลายทางที่ต่างจากต้นทาง'};
  if(p.category==='machines'){
   if(type!=='count'&&amount!==1)return {error:'เครื่องจักรทำรายการได้ครั้งละ 1 เครื่องต่อเลขประจำเครื่อง'};
   if(type==='count'&&amount!==0&&amount!==1)return {error:'เครื่องจักรนับได้เพียง 0 หรือ 1 เครื่อง'};
  }
  if(type==='out'&&!String(input.requester||'').trim())return {error:'กรุณาระบุชื่อผู้เบิก'};
  if(type==='out'&&!input.purpose)return {error:'กรุณาเลือกวัตถุประสงค์การเบิก'};
  const deltas=deltasFor(type,p,wh,dest,amount);
  if(type==='count'&&deltas[wh]!==0&&!String(input.note||'').trim())return {error:'ยอดนับต่างจากระบบ กรุณาระบุเหตุผลการปรับยอด'};
  const isRequest=right==='request';
  if(!isRequest){const err=checkDeltas(p,deltas);if(err)return {error:err};}
  else if(type==='out'&&amount>qtyAt(p,wh))return {error:`สต๊อกไม่พอ: ${whName(wh)} คงเหลือ ${nfmt(qtyAt(p,wh))} ${p.unit}`};
  const at2=at||now();
  const m={id:uid(),no:nextNo(db,type,at2),type,status:isRequest?'pending':'done',productId:p.id,productCode:p.code,productName:p.name,unit:p.unit,amount,deltas,
   from:type==='in'?null:wh,to:type==='out'?null:type==='transfer'?dest:wh,
   ref:String(input.ref||'').trim(),requester:String(input.requester||'').trim(),purpose:input.purpose||'',note:String(input.note||'').trim(),
   by:by||actor(),at:at2,demo:!!(demo||p.demo)};
  if(!isRequest)applyDeltas(p,deltas);
  db.movements.unshift(m);
  persist();
  return {ok:true,data:m};
 },
 decide(id,approve,reason=''){
  if(!can('approve'))return {error:'เฉพาะผู้จัดการคลังหรือผู้ดูแลระบบที่อนุมัติได้'};
  const m=db.movements.find(x=>x.id===id);if(!m||m.status!=='pending')return {error:'ไม่พบรายการที่รออนุมัติ'};
  const p=productById(m.productId);if(!p)return {error:'ไม่พบสินค้าของรายการนี้'};
  if(approve){
   // ยอดอาจเปลี่ยนไปหลังส่งคำขอ จึงคำนวณใหม่ ณ เวลาที่อนุมัติ
   const deltas=deltasFor(m.type,p,m.from||m.to,m.to,m.amount);
   const err=checkDeltas(p,deltas);if(err)return {error:err};
   m.deltas=deltas;applyDeltas(p,deltas);m.status='done';
  }else{
   if(!String(reason).trim())return {error:'กรุณาระบุเหตุผลที่ไม่อนุมัติ'};
   m.status='rejected';
  }
  m.decidedBy=actor();m.decidedAt=now();m.decisionNote=String(reason).trim();
  persist();return {ok:true,data:m};
 },
 /* ย้อนรายการโดยสร้างรายการกลับด้าน ไม่ลบประวัติเดิม */
 reverse(id,reason){
  if(!can('reverse'))return {error:'เฉพาะผู้จัดการคลังหรือผู้ดูแลระบบที่ย้อนรายการได้'};
  const m=db.movements.find(x=>x.id===id);
  if(!m||m.status!=='done'||m.type==='reverse')return {error:'รายการนี้ย้อนไม่ได้'};
  if(!String(reason||'').trim())return {error:'กรุณาระบุเหตุผลการย้อนรายการ'};
  const p=productById(m.productId);if(!p)return {error:'ไม่พบสินค้าของรายการนี้'};
  const deltas=Object.fromEntries(Object.entries(m.deltas||{}).map(([w,d])=>[w,-d]));
  const err=checkDeltas(p,deltas);if(err)return {error:'ย้อนไม่ได้ — '+err};
  applyDeltas(p,deltas);
  const r={id:uid(),no:nextNo(db,'reverse'),type:'reverse',status:'done',productId:p.id,productCode:p.code,productName:p.name,unit:p.unit,
   amount:Math.abs(totalChange({deltas}))||m.amount,deltas,from:m.to,to:m.from,ref:m.no,requester:'',purpose:'',note:String(reason).trim(),reverses:m.id,by:actor(),at:now(),demo:m.demo};
  m.status='reversed';m.reversedBy=r.id;
  db.movements.unshift(r);persist();return {ok:true,data:r};
 },
 addWarehouse(name){
  if(!can('settings'))return {error:'บทบาทนี้ไม่มีสิทธิ์ตั้งค่าคลัง'};
  name=String(name||'').trim();
  if(!name)return {error:'กรอกชื่อคลัง'};
  if(db.warehouses.some(w=>w.name===name))return {error:'มีชื่อคลังนี้อยู่แล้ว'};
  db.warehouses.push({id:uid(),name});persist();return {ok:true};
 },
 replaceAll(data){db=migrate(data);persist();return {ok:true};},
 resetAll(){db=empty();persist();return {ok:true};},
 clearDemo(){
  const ids=new Set(db.products.filter(p=>p.demo).map(p=>p.id));
  db.products=db.products.filter(p=>!p.demo);
  db.movements=db.movements.filter(m=>!m.demo&&!ids.has(m.productId));
  persist();return {ok:true,data:ids.size};
 },
 loadDemo(){
  if(db.products.some(p=>p.demo))return {error:'มีข้อมูลตัวอย่างอยู่แล้ว'};
  const base=[
   ['DEMO-M-001','machines','เครื่องพิมพ์เรซิน 3 มิติ (ตัวอย่าง)','รุ่นตัวอย่าง R1','DEMO-SN-0001','เครื่อง',0,0,'โซน A'],
   ['DEMO-M-002','machines','เครื่องพิมพ์เรซิน 3 มิติ (ตัวอย่าง)','รุ่นตัวอย่าง R1','DEMO-SN-0002','เครื่อง',0,0,'โซน A'],
   ['DEMO-P-001','parts','หัวฉีดแว็กซ์ (ตัวอย่าง)','ขนาดตัวอย่าง','','ชิ้น',5,0,'ชั้น B-01'],
   ['DEMO-P-002','parts','สายพานขับ (ตัวอย่าง)','','','เส้น',3,0,'ชั้น B-02'],
   ['DEMO-E-001','equipment','คีมจับชิ้นงาน (ตัวอย่าง)','','','ชิ้น',2,0,'ชั้น C-01'],
   ['DEMO-C-001','consumables','เรซินหล่อ (ตัวอย่าง)','1 ลิตร','','ขวด',10,0,'ห้องวัสดุ'],
   ['DEMO-C-002','consumables','แว็กซ์ฉีด (ตัวอย่าง)','','','กิโลกรัม',5,0,'ห้องวัสดุ']
  ];
  if(base.some(b=>db.products.some(p=>p.code===b[0])))return {error:'มีรหัส DEMO- ซ้ำอยู่ในระบบ'};
  base.forEach(([code,category,name,model,serial,unit,min,cost,location])=>db.products.push({id:uid(),code,category,name,model,serial,unit,min,cost,location,images:{},balances:{},demo:true,createdAt:now(),createdBy:'ข้อมูลตัวอย่าง'}));
  const P=c=>db.products.find(p=>p.code===c).id;
  const day=n=>{const d=new Date();d.setDate(d.getDate()-n);d.setHours(9+n%7,15,0,0);return d.toISOString();};
  const steps=[
   [12,{type:'in',product:P('DEMO-M-001'),warehouse:'main',amount:'1',ref:'ตัวอย่าง-PO-01'}],
   [12,{type:'in',product:P('DEMO-M-002'),warehouse:'main',amount:'1',ref:'ตัวอย่าง-PO-01'}],
   [11,{type:'in',product:P('DEMO-P-001'),warehouse:'service',amount:'20',ref:'ตัวอย่าง-PO-02'}],
   [11,{type:'in',product:P('DEMO-P-002'),warehouse:'service',amount:'6',ref:'ตัวอย่าง-PO-02'}],
   [10,{type:'in',product:P('DEMO-C-001'),warehouse:'main',amount:'24',ref:'ตัวอย่าง-PO-03'}],
   [10,{type:'in',product:P('DEMO-C-002'),warehouse:'main',amount:'12',ref:'ตัวอย่าง-PO-03'}],
   [8,{type:'out',product:P('DEMO-P-001'),warehouse:'service',amount:'6',requester:'ช่างตัวอย่าง',purpose:'งาน Service',ref:'ตัวอย่าง-JOB-01'}],
   [6,{type:'transfer',product:P('DEMO-M-002'),warehouse:'main',destination:'dispatch',amount:'1',note:'เตรียมส่งลูกค้าตัวอย่าง'}],
   [5,{type:'out',product:P('DEMO-C-001'),warehouse:'main',amount:'10',requester:'ฝ่ายผลิตตัวอย่าง',purpose:'ใช้ภายใน'}],
   [3,{type:'out',product:P('DEMO-P-002'),warehouse:'service',amount:'4',requester:'ช่างตัวอย่าง',purpose:'งาน Service',ref:'ตัวอย่าง-JOB-02'}],
   [2,{type:'out',product:P('DEMO-C-002'),warehouse:'main',amount:'8',requester:'ฝ่ายผลิตตัวอย่าง',purpose:'ใช้ภายใน'}],
   [1,{type:'count',product:P('DEMO-C-001'),warehouse:'main',amount:'13',note:'ตัวอย่าง: นับจริงได้น้อยกว่าระบบ 1 ขวด'}],
   [0,{type:'out',product:P('DEMO-P-001'),warehouse:'service',amount:'3',requester:'ช่างตัวอย่าง',purpose:'งาน Service'}]
  ];
  for(const [d,s] of steps){const r=api.postMovement(s,{at:day(d),by:'ข้อมูลตัวอย่าง',demo:true});if(r.error)return r;}
  db.movements.sort((a,b)=>b.at.localeCompare(a.at));
  persist();return {ok:true};
 }
};
function deltasFor(type,p,wh,dest,amount){
 if(type==='in')return {[wh]:amount};
 if(type==='out')return {[wh]:-amount};
 if(type==='transfer')return {[wh]:-amount,[dest]:amount};
 return {[wh]:nearZero(amount-qtyAt(p,wh))};
}

function handleScan(val){
 const code=String(val||'').trim();
 if(!code){toast('กรุณาระบุรหัสสินค้า','bad');return;}
 ui.lastScan=code;ui.scanValue='';
 $('#scanInput').value='';$('#scanResult').innerHTML=scanResult(code);
 $('#scanInput').focus();     // พร้อมรับการยิงบาร์โค้ดครั้งถัดไป
}
async function startScan(){
 const scanner=$('#cameraPanel'),btn=$('#startCamera');
 if(!scanner||scanActive)return;
 if(!navigator.mediaDevices?.getUserMedia)return toast('เบราว์เซอร์นี้เปิดกล้องไม่ได้ กรุณาพิมพ์รหัสหรือใช้เครื่องสแกนแทน','bad');
 if(!('BarcodeDetector' in window))return toast('เบราว์เซอร์นี้ยังอ่านรหัสผ่านกล้องไม่ได้ (เช่น Safari / Firefox) กรุณาพิมพ์รหัสหรือใช้ Chrome บน Android','bad');
 try{
  const supported=await BarcodeDetector.getSupportedFormats();
  const formats=['qr_code','code_128','code_39','ean_13','ean_8','upc_a'].filter(v=>supported.includes(v));
  if(!formats.length)return toast('ไม่พบรูปแบบบาร์โค้ดที่เบราว์เซอร์รองรับ','bad');
  const detector=new BarcodeDetector({formats});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(ui.view!=='scan'){stopScan();return;}
  scanActive=true;scanner.style.display='block';$('#scanVideo').srcObject=stream;await $('#scanVideo').play();
  btn.hidden=true;$('#stopCamera').hidden=false;
  const loop=async()=>{if(!scanActive)return;try{const r=await detector.detect($('#scanVideo'));if(r.length){stopScan();handleScan(r[0].rawValue);toast('อ่านรหัสสำเร็จ');return;}}catch(e){}if(scanActive)setTimeout(loop,230);};
  loop();
 }catch(e){stopScan();toast('เปิดกล้องไม่ได้ โปรดอนุญาตการใช้กล้องและเปิดผ่าน https','bad');}
}
function stopScan(){
 scanActive=false;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 const s=$('#cameraPanel');if(s)s.style.display='none';
 const v=$('#scanVideo');if(v)v.srcObject=null;
 if($('#startCamera'))$('#startCamera').hidden=false;
 if($('#stopCamera'))$('#stopCamera').hidden=true;
}

function resizeImage(file,max=520){
 return new Promise((resolve,reject)=>{
  if(!file.type.startsWith('image/'))return reject(new Error('type'));
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',max>800?.82:.74));};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('load'));};
  img.src=url;
 });
}

 <div class="stock-box"><div><div class="action-label">คงเหลือรวมทุกคลัง</div><div class="big-zero">${nfmt(qty(p))} <span>${esc(p.unit)}</span></div></div><span class="status-badge ${st.type}">${st.text}</span></div>
 <div class="label">ยอดคงเหลือแยกตามคลัง</div><div class="kv-list">${db.warehouses.map(w=>`<div class="kv"><span>${esc(w.name)}</span><b>${nfmt(qtyAt(p,w.id))} ${esc(p.unit)}</b></div>`).join('')}</div>
 <div class="helper-note" style="margin:10px 0 14px">จุดสั่งซื้อขั้นต่ำ ${nfmt(p.min)} ${esc(p.unit)} • ต้นทุน ฿${money(p.cost||0)} / ${esc(p.unit)}${p.createdBy?` • สร้างโดย ${esc(p.createdBy)}`:''} • รูป ${shots.length}/${IMAGE_SLOTS.length}</div>
 ${moves.length?`<div class="label">ความเคลื่อนไหวล่าสุด</div><div class="mini-moves">${moves.map(m=>`<button class="recent-row" data-action="viewMove" data-id="${m.id}"><span class="recent-icon ${m.type}">${icon(MOVE_ICON[m.type])}</span><span class="recent-info"><strong>${MOVE_LABEL[m.type]} ${m.status!=='done'?`<span class="mstatus ${m.status}">${STATUS_LABEL[m.status]}</span>`:''}</strong><p>${esc(m.no)} • ${moveLine(m)}</p></span><span class="recent-time">${dateText(m.at)}</span></button>`).join('')}</div>`:''}
 <div class="form-submit wrap"><button class="btn outline" data-action="label" data-id="${p.id}">${icon('print')}ป้ายบาร์โค้ด</button>${can('product')?`<button class="btn outline" data-action="editProduct" data-id="${p.id}">${icon('edit')}แก้ไข</button>`:''}${acts}</div>`);
}
function roleModal(){
 openModal('สลับผู้ใช้จำลอง',`<p class="helper-note" style="margin-bottom:12px">เลือกบทบาทเพื่อดูว่าแต่ละฝ่ายเห็นและทำอะไรได้บ้าง ประวัติจะบันทึกชื่อบทบาทเป็นผู้ทำรายการ</p><div class="role-list">${Object.entries(ROLES).map(([k,r])=>`<button class="role-option ${k===session.role?'active':''}" data-action="setRole" data-role="${k}" aria-pressed="${k===session.role}"><span class="avatar">${r.abbr}</span><span><strong>${esc(r.name)}</strong><small>${esc(r.desc)}</small></span>${k===session.role?icon('check'):''}</button>`).join('')}</div><div class="callout" style="margin:12px 0 0">${icon('lock')}เป็นการจำลองบนหน้าจอเท่านั้น ระบบจริงต้องตรวจสิทธิ์ที่ Backend</div>`);
}
function askReason(title,label,action,id,danger=true){
 openModal(title,`<form id="reasonForm" data-kind="${action}" data-ref="${id}" novalidate><div class="field"><label class="label" for="reasonInput">${label} <span class="required" aria-hidden="true">*</span></label><textarea class="form-control" id="reasonInput" name="reason" rows="3" maxlength="200" required autofocus></textarea></div><div class="form-submit"><button type="button" class="btn outline" data-action="closeModal">ยกเลิก</button><button class="btn ${danger?'danger':'primary'}" type="submit">ยืนยัน</button></div></form>`);
}

/* ป้ายบาร์โค้ด Code 39 (เฉพาะ A-Z 0-9 และ - . $ / + % เว้นวรรค) */
function viewLabel(pid){
 const p=productById(pid);if(!p)return;const code=p.code.toUpperCase();
 const patterns={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};
 if(![...code].every(c=>patterns[c]))return toast('รหัสนี้มีอักขระที่บาร์โค้ดพื้นฐานไม่รองรับ ใช้ได้เฉพาะ A-Z, 0-9 และ - . / + % $','bad');
 let x=15,lines='';
 [...'*'+code+'*'].forEach(c=>{const pat=patterns[c];for(let i=0;i<9;i++){const w=pat[i]==='w'?3:1;if(i%2===0)lines+=`<rect x="${x}" y="14" width="${w}" height="70" fill="#111"/>`;x+=w;}x+=2;});
 const svg=`<svg viewBox="0 0 ${x+15} 106" width="100%" style="max-height:115px"><rect width="100%" height="100%" fill="white"/>${lines}<text x="${x/2+7}" y="99" text-anchor="middle" font-size="11" font-family="monospace">${esc(code)}</text></svg>`;
 openModal('ป้ายรหัสสินค้า',`<div id="labelToPrint" class="label-card"><div class="label-brand">IMODE</div><div class="label-name">${esc(p.name)}</div>${svg}<div class="label-sub">${esc(p.serial||p.model||catName(p.category))}</div></div><div class="form-submit"><button class="btn primary" data-action="printLabel">${icon('print')}พิมพ์ป้าย</button></div><p class="helper-note" style="margin-top:12px">ป้าย Code 39 สำหรับทดลอง ป้ายคิวอาร์สำหรับระบบจริงจะทำใน Phase 3</p>`);
}
function printLabel(){
 const node=$('#labelToPrint');if(!node)return;
 const w=window.open('','_blank','width=540,height=460');if(!w){toast('เบราว์เซอร์ปิดกั้นหน้าต่างพิมพ์','bad');return;}
 w.document.write(`<!doctype html><html lang="th"><head><meta charset="UTF-8"><title>ป้ายสินค้า IMODE</title><style>body{font-family:Kanit,Tahoma,sans-serif;margin:25px;text-align:center}svg{width:90%;max-width:400px}.label-brand{font-weight:700;color:#15379c;font-size:19px}.label-name{font-weight:600;margin:5px 0}.label-sub{font-size:11px;color:#556}@page{size:auto;margin:10mm}</style></head><body>${node.innerHTML}<script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();
}

/* ส่งออกและสำรองข้อมูล */
function csvEscape(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function download(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
const stamp=()=>new Date().toLocaleDateString('en-CA');
const toCsv=rows=>'﻿'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
function exportCsv(){
 const rows=[['รหัสสินค้า','ชื่อสินค้า','หมวดหมู่','รุ่น','เลขประจำเครื่อง','หน่วยนับ','คงเหลือรวม','สถานะ','จุดสั่งซื้อขั้นต่ำ','ต้นทุนต่อหน่วย','มูลค่ารวม','ตำแหน่งจัดเก็บ','จำนวนรูป','ข้อมูลตัวอย่าง',...db.warehouses.map(w=>w.name)]];
 db.products.forEach(p=>rows.push([p.code,p.name,catName(p.category),p.model,p.serial,p.unit,qty(p),stockStatus(p).text,p.min,p.cost,nearZero(qty(p)*p.cost),p.location,Object.keys(p.images||{}).length,p.demo?'ใช่':'',...db.warehouses.map(w=>qtyAt(p,w.id))]));
 download(`IMODE_รายการสินค้า_${stamp()}.csv`,toCsv(rows),'text/csv;charset=utf-8');toast('ส่งออกไฟล์ CSV แล้ว');
}
function exportMovement(){
 const rows=[['เลขที่','วันเวลา','ประเภท','สถานะ','รหัสสินค้า','ชื่อสินค้า','จำนวน','เปลี่ยนแปลงสุทธิ','หน่วย','คลังต้นทาง','คลังปลายทาง','ผู้เบิก','วัตถุประสงค์','เอกสารอ้างอิง','หมายเหตุ','ผู้ทำรายการ','ผู้อนุมัติ','ข้อมูลตัวอย่าง']];
 db.movements.forEach(m=>rows.push([m.no,dateText(m.at),MOVE_LABEL[m.type],STATUS_LABEL[m.status],m.productCode,m.productName,m.amount,m.status==='done'?totalChange(m):'',m.unit,m.from?whName(m.from):'',m.to?whName(m.to):'',m.requester,m.purpose,m.ref,m.note,m.by,m.decidedBy||'',m.demo?'ใช่':'']));
 download(`IMODE_ประวัติสต๊อก_${stamp()}.csv`,toCsv(rows),'text/csv;charset=utf-8');toast('ส่งออกประวัติแล้ว');
}
function backup(){download(`IMODE_สำรองข้อมูลสต๊อก_${stamp()}.json`,JSON.stringify({format:'imode-inventory-v2',exportedAt:now(),data:db},null,2),'application/json');toast('ดาวน์โหลดไฟล์สำรองแล้ว');}
function restore(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const root=JSON.parse(reader.result);
   if(!['imode-inventory-v1','imode-inventory-v2'].includes(root.format)||!validShape(root.data))throw Error('invalid');
   if(!confirm('นำเข้าไฟล์นี้แทนข้อมูลทั้งหมดในเครื่องนี้หรือไม่?'))return;
   api.replaceAll(root.data);render();toast('เรียกคืนข้อมูลเรียบร้อย');
  }catch(e){toast('ไฟล์สำรองไม่ถูกต้องหรือไม่รองรับ','bad');}
  $('#restoreFile').value='';
 };
 reader.readAsText(file);
}
function resetData(){
 if(!confirm('ลบสินค้า ประวัติ และการตั้งค่าคลังทั้งหมดในเครื่องนี้?'))return;
 if(!confirm('ยืนยันอีกครั้ง: ข้อมูลจะหายถาวรหากไม่มีไฟล์สำรอง'))return;
 api.resetAll();ui={...ui,dashSearch:'',prodSearch:'',lastScan:'',txProduct:'',txWarehouse:''};go('dashboard');toast('ล้างข้อมูลทั้งหมดแล้ว');
}

/* ---------- 4. เหตุการณ์ ---------- */
document.addEventListener('click',e=>{
 const kpiBtn=e.target.closest('[data-kpi]');
 if(kpiBtn){const k=kpiBtn.dataset.kpi;ui.prodStatus=k==='alert'||k==='out'?k:'all';ui.prodWarehouse='all';go(k==='machines'?'machines':'products');return;}
 const nav=e.target.closest('[data-view]');if(nav){go(nav.dataset.view);return;}
 const cat=e.target.closest('[data-cat]');if(cat){ui.dashCat=cat.dataset.cat;document.querySelectorAll('[data-cat]').forEach(b=>{b.classList.toggle('active',b===cat);b.setAttribute('aria-pressed',b===cat);});refreshDash();return;}
 const el=e.target.closest('[data-action]');
 if(el){
  const {action:a,id,type}=el.dataset;
  switch(a){
   case 'addProduct':closeModal();productModal(null,{code:el.dataset.code});break;
   case 'editProduct':closeModal();productModal(productById(id));break;
   case 'viewProduct':closeModal();productDetails(id);break;
   case 'deleteProduct':if(confirm('ต้องการลบรายการสินค้านี้หรือไม่?')&&done(api.deleteProduct(id),'ลบรายการสินค้าแล้ว')){closeModal();render();}break;
   case 'closeModal':closeModal();break;
   case 'quickTx':closeModal();ui.txProduct=id;go(type);break;
   case 'viewMove':closeModal();moveDetails(id);break;
   case 'approve':if(done(api.decide(id,true),'อนุมัติและปรับยอดแล้ว')){closeModal();render();}break;
   case 'reject':closeModal();askReason('ไม่อนุมัติรายการ','เหตุผลที่ไม่อนุมัติ','reject',id);break;
   case 'reverse':closeModal();askReason('ย้อนรายการ','เหตุผลการย้อนรายการ (ระบบจะสร้างรายการกลับด้าน ไม่ลบประวัติเดิม)','reverse',id);break;
   case 'switchRole':roleModal();break;
   case 'setTheme':prefs.theme=el.dataset.value;savePrefs();if(ui.view==='settings')render();break;
   case 'setText':prefs.text=el.dataset.value;savePrefs();if(ui.view==='settings')render();break;
   case 'setRole':session.role=el.dataset.role;saveSession();closeModal();render();toast(`สลับเป็น “${role().name}” แล้ว`);break;
   case 'loadDemo':if(done(api.loadDemo(),'โหลดข้อมูลตัวอย่างแล้ว')){render();}break;
   case 'clearDemo':if(confirm('ลบสินค้าตัวอย่าง (DEMO-) และประวัติที่เกี่ยวข้องทั้งหมด?')){const r=api.clearDemo();done(r,`ลบข้อมูลตัวอย่าง ${r.data} รายการแล้ว`);render();}break;
   case 'removeImage':delete ui.pendingImages[el.dataset.slot];refreshSlot(el.dataset.slot);break;
   case 'galleryPick':{const p=productById(id),sl=IMAGE_SLOTS.find(s=>s.id===el.dataset.slot);$('#galleryMain').src=p.images[sl.id];$('#galleryMain').alt=sl.name;$('#galleryCap').textContent=sl.name;document.querySelectorAll('.gallery-thumb').forEach(b=>b.classList.toggle('active',b===el));break;}
   case 'exportCsv':exportCsv();break;
   case 'exportMovement':exportMovement();break;
   case 'backup':backup();break;
   case 'restore':$('#restoreFile')?.click();break;
   case 'reset':resetData();break;
   case 'label':closeModal();viewLabel(id);break;
   case 'printLabel':printLabel();break;
  }
  return;
 }
 if(e.target.closest('#menuButton')){$('#sidebar').classList.add('open');$('#navScrim').classList.add('show');return;}
 if(e.target.id==='navScrim'){closeNav();return;}
 if(e.target.id==='modalBackdrop'){closeModal();return;}
 if(e.target.closest('#startCamera')){startScan();return;}
 if(e.target.closest('#stopCamera')){stopScan();return;}
 if(e.target.closest('#themeButton')){prefs.theme=resolvedTheme()==='dark'?'light':'dark';savePrefs();if(ui.view==='settings')render();return;}
 if(e.target.closest('#alertButton')){ui.prodStatus='alert';ui.prodWarehouse='all';go('products');return;}
 if(e.target.closest('#profileButton')||e.target.closest('#sideRole')){closeNav();roleModal();return;}
});
document.addEventListener('submit',e=>{
 const form=e.target;e.preventDefault();
 if(form.id==='productForm')submitProduct(form);
 else if(form.id==='txForm')txSubmit(form);
 else if(form.id==='scanForm')handleScan(new FormData(form).get('code'));
 else if(form.id==='warehouseForm'){if(done(api.addWarehouse(new FormData(form).get('name')),'เพิ่มคลังสินค้าแล้ว'))render();}
 else if(form.id==='reasonForm'){
  const reason=new FormData(form).get('reason'),action=form.dataset.kind,id=form.dataset.ref;
  const res=action==='reverse'?api.reverse(id,reason):api.decide(id,false,reason);
  if(done(res,action==='reverse'?`ย้อนรายการแล้ว เลขที่ ${res.data?.no||''}`:'บันทึกไม่อนุมัติแล้ว')){closeModal();render();}
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='productCategory'){const machine=t.value==='machines';$('#serialField').style.display=machine?'':'none';if(machine)$('#productForm').elements.unit.value='เครื่อง';}
 if(t.dataset.slotInput&&t.files?.[0]){const sl=IMAGE_SLOTS.find(s=>s.id===t.dataset.slotInput);resizeImage(t.files[0],sl.max).then(url=>{ui.pendingImages[sl.id]=url;refreshSlot(sl.id);}).catch(()=>toast('อ่านไฟล์รูปไม่ได้ กรุณาเลือกไฟล์รูปภาพ','bad'));}
 if(t.id==='dashWarehouse'){ui.dashWarehouse=t.value;refreshDash();}
 if(t.id==='dashStatus'){ui.dashStatus=t.value;refreshDash();}
 if(t.id==='prodWarehouseFilter'){ui.prodWarehouse=t.value;refreshProducts();}
 if(t.id==='prodStatusFilter'){ui.prodStatus=t.value;refreshProducts();}
 if(t.id==='histType'){ui.historyType=t.value;refreshHistory();}
 if(t.id==='histStatus'){ui.historyStatus=t.value;refreshHistory();}
 if(t.id==='txProduct'||t.id==='txWarehouse')updateTxBalance();
 if(t.id==='restoreFile')restore(t.files?.[0]);
});
document.addEventListener('input',e=>{
 if(e.target.id==='txAmount'){updateTxBalance();return;}
 const field=e.target.dataset.filter;if(!field)return;
 ui[field]=e.target.value;
 if(field==='dashSearch')refreshDash();
 if(field==='prodSearch')refreshProducts();
 if(field==='historySearch')refreshHistory();
});
document.addEventListener('reset',e=>{if(e.target.id==='txForm'){ui.txProduct='';setTimeout(updateTxBalance,0);}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();stopScan();closeNav();}
 if(e.key==='Tab'&&$('#modalRoot .modal')){ // วนโฟกัสภายในหน้าต่าง
  const f=[...$('#modalRoot .modal').querySelectorAll('button:not([hidden]),input:not([hidden]):not([type=hidden]),select,textarea,label.file-btn')].filter(x=>x.offsetParent);
  if(!f.length)return;const first=f[0],last=f.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});
window.addEventListener('storage',e=>{if(e.key===STORE_KEY){db=load();render();}}); // ซิงก์ระหว่างแท็บในเครื่องเดียวกัน
applyPrefs();
render();
})();

</script>
</body>
