<!doctype html>
<html lang="th" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>I-MODE ช่าง</title>
<script>
/* paint the right colours before anything draws: the saved app theme, else the phone's */
(function(){var t='auto';try{t=localStorage.getItem('imode.appTheme')||'auto'}catch(e){}
var dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.setAttribute('data-t',t==='auto'?(dark?'dark':'light'):t)})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
